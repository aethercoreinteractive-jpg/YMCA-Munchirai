<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | MY Food Store Catalog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        /* Custom styling for clean horizontal scrollbar */
        .no-scrollbar::-webkit-scrollbar { height: 3px; }
        .no-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .no-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        /* Forces exactly 3 items visible simultaneously in catalog slider */
        .mobile-triple-card {
            flex: 0 0 calc(33.333% - 6px);
            width: calc(33.333% - 6px);
            max-width: calc(33.333% - 6px);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-amber-500 selection:text-slate-950">

    <!-- Store Header -->
    <header class="sticky top-0 z-40 bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-14 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 shrink-0">
                <a href="index.html" class="text-sm sm:text-2xl font-black tracking-tighter uppercase text-white flex items-center gap-1.5">
                    <span class="bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-xs sm:text-lg font-bold">MY</span> Munchirai
                </a>
            </div>

            <div class="flex items-center gap-2">
                <a href="index.html" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition border border-slate-700 flex items-center gap-1">
                    <i class="fa-solid fa-house text-amber-400"></i> Home
                </a>
                <a href="cart.html" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1.5 rounded-lg font-bold text-[11px] shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart (<span id="cart-count">0</span>)</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Store Catalog Section -->
    <main class="max-w-7xl mx-auto px-2.5 sm:px-6 lg:px-8 py-4 sm:py-8">
        
        <!-- FULL PAGE-LIKE PRODUCT VIEW CONTAINER (Hidden by default, shown on card tap) -->
        <div id="product-page-view" class="hidden mb-8">
            <div class="bg-white border border-gray-200 rounded-2xl p-4 sm:p-8 shadow-xl relative animate-fadeIn">
                <!-- Back Button mimicking new page navigation -->
                <button onclick="closeProductPageView()" class="inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold px-3.5 py-2 rounded-xl transition border border-slate-200 mb-4 shadow-sm">
                    <i class="fa-solid fa-arrow-left"></i> Back to Catalog
                </button>

                <div id="product-page-content">
                    <!-- Injected via JavaScript -->
                </div>
            </div>
        </div>

        <!-- REGULAR CATALOG WRAPPER (Hidden when product page view is active) -->
        <div id="catalog-main-wrapper">
            <div class="mb-4 sm:mb-6 flex flex-col md:flex-row md:items-end justify-between gap-3 border-b pb-3 border-gray-200">
                <div>
                    <span class="text-[9px] font-bold uppercase tracking-widest text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">Official Storefront</span>
                    <h1 class="text-lg sm:text-3xl font-extrabold tracking-tight text-gray-900 mt-1">MY Food Product Catalog</h1>
                    <p class="text-[11px] text-gray-500">Live inventory. Exactly 3 compact cards visible per row.</p>
                </div>
                <div class="w-full md:w-72">
                    <input type="text" id="search-bar" onkeyup="filterProducts()" placeholder="Search products..." class="w-full bg-white border border-gray-200 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-amber-500 shadow-sm">
                </div>
            </div>

            <!-- Products Container Grouped by Category -->
            <div id="store-categories-container" class="space-y-6">
                <div class="text-center py-16 text-gray-400 text-xs">Loading live inventory from Firebase...</div>
            </div>

            <!-- Empty State Notice -->
            <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-200 shadow-sm mt-4">
                <div class="w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center mx-auto mb-2.5 text-base">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h3 class="font-bold text-xs text-gray-900">No products found</h3>
                <p class="text-[11px] text-gray-500 mt-0.5">Add items via your admin dashboard to display them here.</p>
            </div>
        </div>
    </main>

    <!-- Firebase SDK Imports & Store Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let liveInventory = [];
        let categoriesCache = [];
        let cart = JSON.parse(localStorage.getItem("ymca_cart")) || [];

        // Helper function for star rating HTML string
        function generateStarRatingHTML(ratingValue, iconSizeClass = "text-xs") {
            const rating = parseFloat(ratingValue) || 0;
            let starsHtml = '';
            
            for (let i = 1; i <= 5; i++) {
                if (rating >= i) {
                    starsHtml += `<i class="fa-solid fa-star text-amber-400 ${iconSizeClass}"></i>`;
                } else if (rating >= i - 0.5) {
                    starsHtml += `<i class="fa-solid fa-star-half-stroke text-amber-400 ${iconSizeClass}"></i>`;
                } else {
                    starsHtml += `<i class="fa-regular fa-star text-slate-300 ${iconSizeClass}"></i>`;
                }
            }
            return `<div class="inline-flex items-center gap-0.5" title="${rating} out of 5 stars">${starsHtml}</div>`;
        }

        const categoriesRef = ref(db, 'categories');
        onValue(categoriesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                categoriesCache = Object.keys(data).map(key => ({ key, ...data[key] }));
                categoriesCache.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            } else {
                categoriesCache = [];
            }
            renderCatalog(liveInventory);
        });

        const inventoryRef = ref(db, 'inventory');
        onValue(inventoryRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                liveInventory = Object.keys(data).map(key => ({
                    firebaseKey: key,
                    ...data[key]
                }));
            } else {
                liveInventory = [];
            }
            renderCatalog(liveInventory);
            updateCartCount();
        });

        window.renderCatalog = function(productsToRender) {
            const container = document.getElementById('store-categories-container');
            const emptyState = document.getElementById('empty-state');

            if (!productsToRender || productsToRender.length === 0) {
                container.innerHTML = "";
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            let categoryGroups = {};
            categoriesCache.forEach(cat => {
                categoryGroups[cat.name] = [];
            });
            categoryGroups["Uncategorized"] = [];

            productsToRender.forEach(item => {
                const cat = item.category || "Uncategorized";
                if (!categoryGroups[cat]) {
                    categoryGroups[cat] = [];
                }
                categoryGroups[cat].push(item);
            });

            Object.keys(categoryGroups).forEach(cat => {
                categoryGroups[cat].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            });

            let displayCategories = categoriesCache.map(c => c.name);
            if (!displayCategories.includes("Uncategorized") && categoryGroups["Uncategorized"].length > 0) {
                displayCategories.push("Uncategorized");
            }

            let htmlOutput = '';

            displayCategories.forEach(catName => {
                const groupItems = categoryGroups[catName] || [];
                if (groupItems.length === 0) return;

                htmlOutput += `
                    <div class="space-y-2.5">
                        <!-- Category Section Row Header -->
                        <div class="flex items-center justify-between border-b-2 border-amber-500 pb-1">
                            <h2 class="text-xs font-black text-slate-900 uppercase tracking-wider flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span>
                                ${catName}
                            </h2>
                            <span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">${groupItems.length} item${groupItems.length > 1 ? 's' : ''}</span>
                        </div>

                        <!-- Slider Row: Enforces exactly 3 cards visible simultaneously -->
                        <div class="flex overflow-x-auto no-scrollbar gap-2 pb-2 pt-0.5 snap-x scroll-smooth">
                `;

                groupItems.forEach(item => {
                    const cleanPrice = typeof item.price === 'string' ? item.price.replace('₹', '') : item.price;

                    htmlOutput += `
                        <div onclick="openProductPageView('${item.firebaseKey}')" class="mobile-triple-card flex-shrink-0 snap-start border border-gray-200 active:border-amber-500 bg-white rounded-lg p-1.5 shadow-sm transition flex flex-col justify-between cursor-pointer group">
                            <div>
                                <!-- Micro Image Frame -->
                                <div class="relative bg-slate-100 rounded-md overflow-hidden h-20 mb-1 border border-gray-100 flex items-center justify-center">
                                    <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${item.name}" class="w-full h-full object-contain p-0.5">
                                    <span class="absolute top-0.5 left-0.5 bg-amber-500 text-slate-950 font-bold text-[7px] px-1 py-0.2 rounded shadow">Stock</span>
                                </div>

                                <h3 class="font-bold text-[10px] text-gray-900 line-clamp-1 mb-0.5">${item.name}</h3>

                                <p class="text-[9px] text-gray-500 font-light line-clamp-1 mb-1">${item.smallDesc || 'No summary.'}</p>
                            </div>

                            <!-- Price on left, Quantity on right -->
                            <div>
                                <div class="flex items-center justify-between text-[10px] py-0.5 border-t border-b border-gray-100 mb-1 bg-gray-50 px-1 rounded">
                                    <span class="font-black text-slate-900">₹${cleanPrice}</span>
                                    <span class="text-[9px] text-slate-500 font-semibold truncate max-w-[45px]">${item.qty ? item.qty : 'Std'}</span>
                                </div>

                                <!-- Lengthy Full-Width Add to Cart Button -->
                                <button onclick="event.stopPropagation(); window.addToCart('${item.firebaseKey}')" class="w-full bg-amber-500 active:bg-amber-600 text-slate-950 text-[10px] font-bold py-1 px-1 rounded transition shadow flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-cart-plus text-[9px]"></i> Add
                                </button>
                            </div>
                        </div>
                    `;
                });

                htmlOutput += `</div></div>`;
            });

            container.innerHTML = htmlOutput;
        };

        window.openProductPageView = function(firebaseKey) {
            const item = liveInventory.find(p => p.firebaseKey === firebaseKey);
            if (!item) return;

            const starsDisplay = generateStarRatingHTML(item.rating || 5, "text-sm");
            const pageContent = document.getElementById('product-page-content');

            // Generate full grid of all products for the explore section with 2 cards per row (grid-cols-2)
            let exploreGridHtml = '';
            liveInventory.forEach(prod => {
                const cleanPrice = typeof prod.price === 'string' ? prod.price.replace('₹', '') : prod.price;
                exploreGridHtml += `
                    <div onclick="openProductPageView('${prod.firebaseKey}')" class="border border-gray-200 active:border-amber-500 bg-white rounded-lg p-2 shadow-sm transition flex flex-col justify-between cursor-pointer group">
                        <div>
                            <div class="relative bg-slate-100 rounded-md overflow-hidden h-24 mb-1.5 border border-gray-100 flex items-center justify-center">
                                <img src="${prod.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${prod.name}" class="w-full h-full object-contain p-1">
                            </div>
                            <h4 class="font-bold text-[11px] text-gray-900 line-clamp-1 mb-0.5">${prod.name}</h4>
                            <p class="text-[9px] text-gray-500 font-light line-clamp-1 mb-1.5">${prod.smallDesc || 'No summary.'}</p>
                        </div>
                        <div>
                            <div class="flex items-center justify-between text-[10px] py-1 border-t border-b border-gray-100 mb-1.5 bg-gray-50 px-1.5 rounded">
                                <span class="font-black text-slate-900">₹${cleanPrice}</span>
                                <span class="text-[9px] text-slate-500 font-semibold truncate max-w-[60px]">${prod.qty ? prod.qty : 'Std'}</span>
                            </div>
                            <button onclick="event.stopPropagation(); window.addToCart('${prod.firebaseKey}')" class="w-full bg-amber-500 active:bg-amber-600 text-slate-950 text-[10px] font-bold py-1 px-1 rounded transition shadow flex items-center justify-center gap-1">
                                <i class="fa-solid fa-cart-plus text-[9px]"></i> Add
                            </button>
                        </div>
                    </div>
                `;
            });

            pageContent.innerHTML = `
                <div class="grid grid-cols-1 gap-4 items-start">
                    <!-- Image Showcase -->
                    <div class="relative bg-slate-100 rounded-xl overflow-hidden aspect-[4/3] border border-slate-200 flex items-center justify-center shadow-inner">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${item.name}" class="w-full h-full object-contain p-3">
                        <span class="absolute top-2.5 left-2.5 bg-amber-500 text-slate-950 font-bold text-[10px] px-2.5 py-0.5 rounded shadow">In Stock</span>
                    </div>

                    <!-- Product Full Info Details -->
                    <div class="space-y-3">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <span class="text-amber-600 font-bold uppercase tracking-wider text-[10px] bg-amber-50 px-2.5 py-0.5 rounded-lg border border-amber-200">${item.category || 'General'}</span>
                            <div class="flex items-center gap-1.5 text-slate-700 font-bold bg-slate-50 border border-slate-200 px-2 py-0.5 rounded-xl text-xs">
                                ${starsDisplay}
                                <span class="text-slate-900 ml-0.5">${item.rating || '5'} / 5</span>
                            </div>
                        </div>

                        <h1 class="text-lg font-black text-slate-900 tracking-tight">${item.name}</h1>

                        <div class="flex items-center gap-3 py-1">
                            <span class="text-2xl font-black text-slate-900">₹${typeof item.price === 'string' ? item.price.replace('₹', '') : item.price}</span>
                            ${item.qty ? `<span class="text-[10px] bg-slate-100 border border-slate-200 px-2 py-1 rounded-xl text-slate-700 font-bold">Quantity / Unit: ${item.qty}</span>` : ''}
                        </div>

                        <!-- Full Detailed Specifications Box -->
                        <div class="bg-amber-50/60 border border-amber-200/80 p-3 rounded-xl text-xs text-slate-700 font-light leading-relaxed">
                            <strong class="block text-slate-900 font-bold mb-1 text-[11px] uppercase tracking-wider text-amber-800"><i class="fa-solid fa-circle-info text-amber-600 mr-1"></i> Detailed Overview & Specifications</strong>
                            ${item.bigDesc || item.desc || 'No detailed specifications provided for this product.'}
                        </div>

                        <!-- Action Buttons -->
                        <div class="pt-2 flex items-center gap-2">
                            <button onclick="window.addToCart('${item.firebaseKey}')" class="flex-1 bg-amber-500 active:bg-amber-600 text-slate-950 font-bold px-4 py-3 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
                                <i class="fa-solid fa-cart-plus"></i> Add to Cart
                            </button>
                        </div>
                    </div>
                </div>

                 <!-- Below Section: Explore More Products (All products displayed with 2 cards per row) -->
                <div class="mt-8 pt-4 border-t border-gray-200">
                    <h3 class="text-xs font-black text-slate-900 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-store text-amber-500"></i> Explore All Products (${liveInventory.length})
                    </h3>
                    <p class="text-[10px] text-gray-500 mb-3">Browse all items available in the store catalog below.</p>
                    
                    <div class="grid grid-cols-2 gap-2.5">
                        ${exploreGridHtml}
                    </div>
                </div>
            `;

            // Hide catalog and show page view
            document.getElementById('catalog-main-wrapper').classList.add('hidden');
            document.getElementById('product-page-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.closeProductPageView = function() {
            document.getElementById('product-page-view').classList.add('hidden');
            document.getElementById('catalog-main-wrapper').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.filterProducts = function() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = liveInventory.filter(item => 
                item.name.toLowerCase().includes(query) || 
                (item.smallDesc && item.smallDesc.toLowerCase().includes(query)) ||
                (item.bigDesc && item.bigDesc.toLowerCase().includes(query)) ||
                (item.category && item.category.toLowerCase().includes(query))
            );
            renderCatalog(filtered);
        };

        window.addToCart = function(firebaseKey) {
            const product = liveInventory.find(p => p.firebaseKey === firebaseKey);
            if (!product) return;

            const existing = cart.find(item => item.firebaseKey === firebaseKey);
            if (existing) {
                existing.qtyCount = (existing.qtyCount || 1) + 1;
            } else {
                cart.push({ ...product, qtyCount: 1 });
            }

            localStorage.setItem("ymca_cart", JSON.stringify(cart));
            updateCartCount();
            alert(`${product.name} added to cart!`);
        };

        function updateCartCount() {
            const totalCount = cart.reduce((sum, item) => sum + (item.qtyCount || 1), 0);
            document.getElementById('cart-count').textContent = totalCount;
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateCartCount();
        });
    </script>
</body>
</html>
