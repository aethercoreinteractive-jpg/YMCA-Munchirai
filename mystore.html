<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Storefront</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#090d16',
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes morphPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .icon-morph {
            animation: morphPulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-amber-500 selection:text-slate-950 pb-24 min-h-screen flex flex-col justify-between">

    <!-- TOP BAR NAVIGATION -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 shrink-0">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 font-black flex items-center justify-center text-xs tracking-tighter shadow-md">MY</div>
                <div>
                    <h1 class="text-xs font-extrabold text-white tracking-tight">MUNCHIRAI YMCA</h1>
                    <span class="text-[10px] text-amber-400 font-mono tracking-wider block">ONLINE STORE</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="toggleCartModal()" class="relative px-3.5 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-sm flex items-center gap-2 transition active:scale-95">
                    <i class="fa-solid fa-cart-shopping text-xs"></i>
                    <span class="hidden xs:inline">Cart</span>
                    <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white rounded-full text-[10px] w-5 h-5 flex items-center justify-center font-extrabold border-2 border-slate-900 shadow hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- SEARCH & BANNER SECTION -->
    <div class="max-w-4xl mx-auto w-full px-4 pt-4">
        <div class="relative">
            <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="search-bar" oninput="window.filterProducts()" placeholder="Search products, groceries..." class="w-full bg-white border border-slate-200/80 rounded-2xl pl-11 pr-4 py-3 text-xs sm:text-sm text-slate-900 focus:outline-none focus:border-amber-500 transition shadow-sm font-medium">
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <main class="max-w-4xl mx-auto w-full px-4 py-4 flex-grow space-y-4">
        
        <!-- SEARCH RESULTS CONTAINER (Hidden by default) -->
        <div id="search-results-section" class="hidden space-y-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80">
            <h2 id="search-results-title" class="text-xs font-black text-amber-600 uppercase tracking-wider flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> Search Results
            </h2>
            <div id="search-results-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                <!-- Populated via JS -->
            </div>
        </div>

        <!-- CATEGORY TABS -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="category-tabs-container">
            <!-- Dynamically populated category buttons -->
        </div>

        <!-- DYNAMIC CATALOG / STORE CONTENT CONTAINER -->
        <div id="store-content-container" class="space-y-4">
            <div class="text-center py-16 text-slate-400 text-xs">Loading store catalog...</div>
        </div>

    </main>

    <!-- CART SLIDE-OVER / MODAL -->
    <div id="cart-modal" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm transition-opacity" onclick="toggleCartModal()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white border-l border-slate-200 text-slate-900 flex flex-col shadow-2xl">
                <!-- Cart Header -->
                <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                    <h3 class="text-xs font-black uppercase tracking-wider text-amber-700 flex items-center gap-2">
                        <i class="fa-solid fa-cart-shopping"></i> Your Shopping Cart
                    </h3>
                    <button onclick="toggleCartModal()" class="text-slate-400 hover:text-slate-700 p-1">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>

                <!-- Cart Items List Container -->
                <div id="cart-items-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                    <!-- Populated dynamically -->
                </div>

                <!-- Cart Summary & Checkout Footer -->
                <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
                    <div class="space-y-1.5 text-xs">
                        <div class="flex justify-between text-slate-500 font-medium">
                            <span>Subtotal</span>
                            <span id="cart-subtotal" class="font-bold text-slate-900">₹0.00</span>
                        </div>
                        <div class="flex justify-between text-sm pt-2 border-t border-slate-200 font-black text-slate-900">
                            <span>Total Payable</span>
                            <span id="cart-total" class="text-amber-600">₹0.00</span>
                        </div>
                    </div>

                    <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black text-xs sm:text-sm py-3 px-4 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-base"></i> Checkout via WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ENTERPRISE FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 py-5 px-4 text-center text-[11px] text-slate-400 mt-auto">
        Munchirai YMCA Online Store &bull; Secure Customer Portal
    </footer>

    <!-- FIREBASE REALTIME ENGINE & STOREFRONT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        let liveInventory = [];
        let categoriesCache = [];
        let currentAds = [];
        let selectedCategoryFilter = null;
        let cart = JSON.parse(localStorage.getItem("ymca_cart")) || [];
        let currentSlideIndex = 0;
        let autoSlideInterval = null;

        // Fetch Categories
        onValue(ref(db, 'categories'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                categoriesCache = Object.keys(data).map(k => data[k]);
                categoriesCache.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
                renderCategoryTabs();
            }
        });

        // Fetch Ads Carousel
        onValue(ref(db, 'ads'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                currentAds = Object.keys(data).map(k => data[k]);
            } else {
                currentAds = [];
            }
            if (liveInventory.length > 0) {
                renderCatalog(liveInventory);
            }
        });

        // Fetch Inventory Realtime
        onValue(ref(db, 'inventory'), (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                liveInventory = [];
                document.getElementById('store-content-container').innerHTML = `<div class="text-center py-16 text-slate-400 text-xs">No products available in store.</div>`;
                return;
            }

            liveInventory = Object.keys(data).map(key => ({ firebaseKey: key, ...data[key] }));
            renderCategoryTabs();
            renderCatalog(liveInventory);
            
            const searchQuery = document.getElementById('search-bar').value;
            if (searchQuery) {
                window.filterProducts();
            }
        });

        function renderCategoryTabs() {
            const container = document.getElementById('category-tabs-container');
            let html = `<button onclick="window.selectCategory(null)" class="px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm shrink-0 ${selectedCategoryFilter === null ? 'bg-amber-500 text-slate-950 font-black shadow' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}">All Products</button>`;
            
            categoriesCache.forEach(cat => {
                const isSelected = selectedCategoryFilter === cat.name;
                html += `<button onclick="window.selectCategory('${cat.name}')" class="px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm shrink-0 ${isSelected ? 'bg-amber-500 text-slate-950 font-black shadow' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}">${cat.name}</button>`;
            });

            container.innerHTML = html;
        }

        window.selectCategory = function(catName) {
            selectedCategoryFilter = catName;
            renderCategoryTabs();
            
            if (catName === null) {
                renderCatalog(liveInventory);
                document.getElementById('search-results-section').classList.add('hidden');
                document.getElementById('search-bar').value = '';
            } else {
                const filtered = liveInventory.filter(item => item.category === catName);
                const searchResultsSection = document.getElementById('search-results-section');
                const searchResultsGrid = document.getElementById('search-results-grid');
                const searchResultsTitle = document.getElementById('search-results-title');

                searchResultsSection.classList.remove('hidden');
                searchResultsTitle.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> <i class="fa-solid fa-folder-open text-amber-500 mr-0.5"></i> Category: ${catName} (${filtered.length})` ;
                
                if (filtered.length === 0) {
                    searchResultsGrid.innerHTML = `<div class="col-span-full text-center py-6 text-gray-400 text-xs bg-white rounded-xl border border-gray-200">No products found in this category.</div>`;
                } else {
                    let resHtml = '';
                    filtered.forEach(item => {
                        resHtml += generateProductCardHTML(item);
                    });
                    searchResultsGrid.innerHTML = resHtml;
                }
                
                window.scrollTo({ top: searchResultsSection.offsetTop - 80, behavior: 'smooth' });
            }
        };

        // Helper function to calculate offer prices and render badges dynamically from productmanagement settings
        function calculateOfferDetails(item) {
            const rawPrice = Number(typeof item.price === 'string' ? item.price.replace('₹', '') : item.price) || 0;
            const hasOffer = item.hasOffer === true;
            const offerPercent = Number(item.offerPercent) || 0;

            if (hasOffer && offerPercent > 0) {
                const discountAmount = rawPrice * (offerPercent / 100);
                const finalPrice = Math.max(0, rawPrice - discountAmount);
                return {
                    hasOffer: true,
                    offerPercent: offerPercent,
                    originalPrice: rawPrice.toFixed(2),
                    finalPrice: finalPrice.toFixed(2)
                };
            }
            return {
                hasOffer: false,
                offerPercent: 0,
                originalPrice: rawPrice.toFixed(2),
                finalPrice: rawPrice.toFixed(2)
            };
        }

        // Reusable product card layout generator with professional offer badge integration
        function generateProductCardHTML(item) {
            const offerDetails = calculateOfferDetails(item);
            const actionButtonHtml = getCartActionHTML(item.firebaseKey);
            const cardSmallDesc = item.descSmall || item.smallDesc || item.desc || item.description || 'Authentic organic food product.';
            const isInStock = item.inStock !== false;

            // Professional Offer Badge overlay if individual switch is turned on
            const offerBadgeHtml = offerDetails.hasOffer 
                ? `<span class="absolute top-1 right-1 bg-amber-500 text-slate-950 font-black text-[8px] px-1.5 py-0.5 rounded shadow z-10">${offerDetails.offerPercent}% OFF</span>` 
                : '';

            const stockBadgeHtml = `<span class="absolute top-1 left-1 ${isInStock ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-white'} font-bold text-[7px] px-1.5 py-0.5 rounded shadow z-10">${isInStock ? 'In Stock' : 'Out'}</span>`;

            const priceDisplayHtml = offerDetails.hasOffer ? `
                <div>
                    <span class="font-black text-slate-900 text-xs">₹${offerDetails.finalPrice}</span>
                    <span class="text-[8px] text-slate-400 line-through block leading-none">₹${offerDetails.originalPrice}</span>
                </div>
            ` : `
                <span class="font-black text-slate-900 text-xs">₹${offerDetails.originalPrice}</span>
            `;

            return `
                <div class="border ${isInStock ? 'border-gray-200 active:border-amber-500' : 'border-slate-300 opacity-60 grayscale'} bg-white rounded-xl p-2.5 shadow-sm transition flex flex-col justify-between cursor-pointer group relative">
                    ${offerBadgeHtml}
                    ${stockBadgeHtml}
                    <div onclick="window.location.href='scaledup.html?id=${item.firebaseKey}'">
                        <div class="relative bg-slate-100 rounded-lg overflow-hidden h-24 mb-2 border border-gray-100 flex items-center justify-center">
                            <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${item.name}" class="w-full h-full object-contain p-1 group-hover:scale-105 transition duration-300">
                        </div>
                        <h3 class="font-bold text-gray-900 leading-tight mb-0.5 text-xs line-clamp-1">${item.name}</h3>
                        <p class="text-gray-500 font-light leading-tight mb-2 text-[9px] line-clamp-1">${cardSmallDesc}</p>
                    </div>
                    <div>
                        <div class="flex items-center justify-between text-[10px] py-1 border-t border-b border-gray-100 mb-2 bg-gray-50 px-1.5 rounded">
                            ${priceDisplayHtml}
                            <span class="text-[9px] text-slate-500 font-semibold truncate max-w-[50px]">${item.qty ? item.qty : 'Std'}</span>
                        </div>
                        <div id="action-container-${item.firebaseKey}">
                            ${actionButtonHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function getCartActionHTML(firebaseKey) {
            const cartItem = cart.find(item => item.firebaseKey === firebaseKey);
            const count = cartItem ? (cartItem.qtyCount || 1) : 0;
            const product = liveInventory.find(p => p.firebaseKey === firebaseKey);
            const isInStock = product ? product.inStock !== false : true;

            if (!isInStock) {
                return `<button disabled class="w-full bg-slate-100 text-slate-400 text-[10px] font-bold py-1 px-1 rounded cursor-not-allowed">Unavailable</button>`;
            }

            if (count > 0) {
                return `
                    <div class="flex items-center justify-between bg-amber-500 text-slate-950 rounded text-[10px] font-bold overflow-hidden shadow-sm" onclick="event.stopPropagation()">
                        <button onclick="window.updateQuantity('${firebaseKey}', -1)" class="w-7 py-1 bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white flex items-center justify-center transition">
                            <i class="fa-solid fa-minus text-[9px]"></i>
                        </button>
                        <span class="px-1.5 font-black text-slate-950">${count}</span>
                        <button onclick="window.updateQuantity('${firebaseKey}', 1)" class="w-7 py-1 bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white flex items-center justify-center transition">
                            <i class="fa-solid fa-plus text-[9px]"></i>
                        </button>
                    </div>
                `;
            } else {
                return `
                    <button onclick="event.stopPropagation(); window.addToCart('${firebaseKey}')" class="w-full bg-amber-500 active:bg-amber-600 text-slate-950 text-[10px] font-bold py-1 px-1 rounded transition shadow flex items-center justify-center gap-1">
                        <i class="fa-solid fa-cart-plus text-[9px]"></i> Add
                    </button>
                `;
            }
        }

        // Render Main Catalog Layout
        function renderCatalog(inventoryList) {
            const container = document.getElementById('store-content-container');
            let htmlOutput = '';

            const validCategories = categoriesCache.map(c => c.name);
            const categoryGroups = {};
            validCategories.forEach(cat => {
                categoryGroups[cat] = inventoryList.filter(item => item.category === cat);
            });

            // Best Sellers Section
            const generateBestSellersHTML = () => {
                const bestSellers = inventoryList.filter(item => item.bestSeller === true || item.isBestSeller === true).slice(0, 6);
                if (bestSellers.length === 0) return '';

                let bsHtml = `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
                        <h2 class="text-xs font-black text-amber-600 uppercase tracking-wider flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> Best Sellers
                        </h2>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                `;
                bestSellers.forEach(item => {
                    bsHtml += generateProductCardHTML(item);
                });
                bsHtml += `</div></div>`;
                return bsHtml;
            };

            // Recommended Section
            const generateRecommendedHTML = () => {
                const recommendedList = inventoryList.filter(item => item.recommended === true || item.isRecommended === true).slice(0, 6);
                if (recommendedList.length === 0) return '';

                let recHtml = `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
                        <h2 class="text-xs font-black text-amber-600 uppercase tracking-wider flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> Recommended For You
                        </h2>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                `;
                recommendedList.forEach(item => {
                    recHtml += generateProductCardHTML(item);
                });
                recHtml += `</div></div>`;
                return recHtml;
            };

            // Standard Category Slider Row
            const generateSliderRowHTML = (catName) => {
                const groupItems = categoryGroups[catName] || [];
                if (groupItems.length === 0) return '';

                let rowHtml = `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
                        <div class="flex items-center justify-between">
                            <h2 class="text-xs font-black text-amber-600 uppercase tracking-wider flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> ${catName}
                            </h2>
                            <button onclick="window.selectCategory('${catName}')" class="text-[11px] text-amber-600 hover:text-amber-700 font-bold transition flex items-center gap-1">
                                <span>View All</span> <i class="fa-solid fa-arrow-right text-[9px]"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                `;

                groupItems.slice(0, 4).forEach(item => {
                    rowHtml += generateProductCardHTML(item);
                });

                rowHtml += `</div></div>`;
                return rowHtml;
            };

            // Dark Box 8-Card Section
            const generateDark8CardSectionHTML = (catName) => {
                const fullGroupItems = categoryGroups[catName] || [];
                const displayGroupItems = fullGroupItems.slice(0, 8);
                if (displayGroupItems.length === 0) return '';

                let darkHtml = `
                    <div class="bg-slate-900 rounded-2xl p-4 shadow-xl border border-slate-800 space-y-3">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                            <h2 class="text-xs font-black text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> ${catName}
                            </h2>
                            <button onclick="window.selectCategory('${catName}')" class="text-[11px] bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 px-2.5 py-1 rounded-md font-bold transition shadow-sm flex items-center gap-1 cursor-pointer">
                                <span>View All</span> <i class="fa-solid fa-arrow-right text-[9px]"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-4 gap-2">
                `;

                displayGroupItems.forEach(item => {
                    const offerDetails = calculateOfferDetails(item);
                    const actionButtonHtml = getCartActionHTML(item.firebaseKey);
                    const cardSmallDesc = item.descSmall || item.smallDesc || item.desc || item.description || 'Authentic organic product.';
                    const isInStock = item.inStock !== false;

                    const darkOfferBadge = offerDetails.hasOffer 
                        ? `<span class="absolute top-0.5 left-0.5 bg-amber-500 text-slate-950 font-bold text-[6px] px-1 py-0.2 rounded shadow z-10">${offerDetails.offerPercent}% OFF</span>` 
                        : `<span class="absolute top-0.5 left-0.5 ${isInStock ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-white'} font-bold text-[6px] px-1 py-0.2 rounded shadow z-10">${isInStock ? 'Top' : 'Out'}</span>`;

                    darkHtml += `
                        <div onclick="window.location.href='scaledup.html?id=${item.firebaseKey}'" class="border ${isInStock ? 'border-slate-700 active:border-amber-500' : 'border-slate-800 opacity-60 grayscale'} bg-slate-950 rounded-lg p-1.5 shadow transition flex flex-col justify-between cursor-pointer group relative">
                            ${darkOfferBadge}
                            <div>
                                <div class="relative bg-slate-900 rounded-md overflow-hidden h-16 mb-1 border border-slate-800 flex items-center justify-center">
                                    <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${item.name}" class="w-full h-full object-contain p-0.5">
                                </div>
                                <h3 class="font-bold text-white leading-tight mb-0.5 truncate" style="font-size: 8px;">${item.name}</h3>
                                <p class="text-slate-400 font-light leading-tight mb-1 truncate" style="font-size: 6.5px;">${cardSmallDesc}</p>
                            </div>
                            <div>
                                <div class="flex items-center justify-between text-[9px] py-0.5 border-t border-b border-slate-800 mb-1 bg-slate-900 px-1 rounded">
                                    <span class="font-black text-amber-400">₹${offerDetails.finalPrice}</span>
                                    <span class="text-[8px] text-slate-400 font-semibold truncate max-w-[35px]">${item.qty ? item.qty : 'Std'}</span>
                                </div>
                                <div id="action-container-${item.firebaseKey}">
                                    ${actionButtonHtml}
                                </div>
                            </div>
                        </div>
                    `;
                });

                darkHtml += `</div></div>`;
                return darkHtml;
            };

            // Ad banner HTML snippet
            const adViewportHTML = `
                <div class="relative w-full h-52 sm:h-72 bg-slate-900 rounded-2xl overflow-hidden shadow-inner border border-slate-800 group my-3">
                    <div id="ad-preview-slider" class="flex h-full w-full overflow-x-auto snap-x snap-mandatory no-scrollbar transition-transform duration-500">
                        <div class="w-full h-full flex-shrink-0 snap-center flex items-center justify-center text-slate-400 text-xs">
                            Loading ads...
                        </div>
                    </div>
                    <div id="ad-indicators" class="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5 z-20 pointer-events-none"></div>
                </div>
            `;

            htmlOutput += generateBestSellersHTML();
            htmlOutput += generateRecommendedHTML();
            if (validCategories.length > 0) htmlOutput += generateSliderRowHTML(validCategories[0]);
            if (validCategories.length > 1) htmlOutput += generateSliderRowHTML(validCategories[1]);
            
            htmlOutput += adViewportHTML;

            if (validCategories.length > 2) htmlOutput += generateSliderRowHTML(validCategories[2]);
            if (validCategories.length > 3) htmlOutput += generateSliderRowHTML(validCategories[3]);
            
            const darkSectionCategory = validCategories.length > 4 ? validCategories[4] : (validCategories[0] || "Uncategorized");
            htmlOutput += generateDark8CardSectionHTML(darkSectionCategory);

            for (let i = 5; i < validCategories.length; i++) {
                htmlOutput += generateSliderRowHTML(validCategories[i]);
            }

            container.innerHTML = htmlOutput;
            renderPreviewSlider();
            setupAutoSlide();
        };

        // Render Preview Slider Logic
        function renderPreviewSlider() {
            const slider = document.getElementById('ad-preview-slider');
            const indicators = document.getElementById('ad-indicators');
            if (!slider || !indicators) return;

            if (!currentAds || currentAds.length === 0) {
                slider.innerHTML = `<div class="w-full h-full flex-shrink-0 snap-center flex items-center justify-center text-slate-400 text-xs">No active ads.</div>`;
                indicators.innerHTML = '';
                return;
            }

            slider.innerHTML = '';
            let dotsHtml = '';

            currentAds.forEach((ad, idx) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = "w-full h-full flex-shrink-0 snap-center relative flex items-center justify-center bg-black overflow-hidden cursor-pointer";

                if (ad.type === 'video') {
                    const videoEl = document.createElement('video');
                    videoEl.src = ad.link;
                    videoEl.autoplay = true;
                    videoEl.muted = true;
                    videoEl.playsInline = true;
                    videoEl.loop = true;
                    videoEl.className = "absolute inset-0 w-full h-full object-contain pointer-events-none";

                    const badge = document.createElement('div');
                    badge.className = "absolute inset-0 flex items-center justify-center pointer-events-none z-10 speaker-badge-container";
                    badge.innerHTML = `
                        <div class="w-14 h-14 rounded-full bg-slate-950/70 backdrop-blur-xl flex items-center justify-center text-white shadow-2xl border border-white/25 icon-morph">
                            <i class="fa-solid fa-volume-xmark text-lg text-amber-400"></i>
                        </div>
                    `;

                    slideDiv.addEventListener('click', () => {
                        videoEl.muted = !videoEl.muted;
                        const iconBox = badge.firstElementChild;
                        const icon = iconBox.querySelector('i');

                        badge.style.opacity = '1';
                        badge.style.transform = 'scale(1)';

                        if (videoEl.muted) {
                            icon.className = "fa-solid fa-volume-xmark text-lg text-amber-400 icon-morph";
                        } else {
                            icon.className = "fa-solid fa-volume-high text-lg text-amber-400 icon-morph";
                            setTimeout(() => {
                                badge.style.transform = 'scale(0.85)';
                                badge.style.opacity = '0';
                            }, 50);
                        }

                        iconBox.style.transform = 'scale(1.15)';
                        setTimeout(() => {
                            if (!videoEl.muted) return;
                            iconBox.style.transform = 'scale(1)';
                        }, 200);
                    });

                    slideDiv.appendChild(videoEl);
                    slideDiv.appendChild(badge);
                } else {
                    const imgEl = document.createElement('img');
                    imgEl.src = ad.link;
                    imgEl.alt = `Ad ${idx + 1}`;
                    imgEl.className = "absolute inset-0 w-full h-full object-contain pointer-events-none";
                    slideDiv.appendChild(imgEl);
                }

                slider.appendChild(slideDiv);
                dotsHtml += `<span class="w-2 h-2 rounded-full ${idx === 0 ? 'bg-amber-500 w-4' : 'bg-white/50'} transition-all duration-300 inline-block"></span>`;
            });

            indicators.innerHTML = dotsHtml;
        }

        function setupAutoSlide() {
            if (autoSlideInterval) {
                clearInterval(autoSlideInterval);
                autoSlideInterval = null;
            }

            if (currentAds.length <= 1) return;

            const slider = document.getElementById('ad-preview-slider');
            if (!slider) return;

            autoSlideInterval = setInterval(() => {
                if (currentAds.length <= 1) return;
                currentSlideIndex = (currentSlideIndex + 1) % currentAds.length;
                const scrollAmount = slider.clientWidth * currentSlideIndex;
                slider.scrollTo({ left: scrollAmount, behavior: 'smooth' });
                updateDots(currentSlideIndex);
            }, 4000);
        }

        function updateDots(activeIdx) {
            const dots = document.querySelectorAll('#ad-indicators span');
            dots.forEach((dot, idx) => {
                if (idx === activeIdx) {
                    dot.className = "w-4 h-2 rounded-full bg-amber-500 transition-all duration-300 inline-block";
                } else {
                    dot.className = "w-2 h-2 rounded-full bg-white/50 transition-all duration-300 inline-block";
                }
            });
        }

        window.filterProducts = function() {
            const query = document.getElementById('search-bar').value.toLowerCase().trim();
            const searchResultsSection = document.getElementById('search-results-section');
            const searchResultsGrid = document.getElementById('search-results-grid');
            const searchResultsTitle = document.getElementById('search-results-title');

            if (!query) {
                searchResultsTitle.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> <i class="fa-solid fa-magnifying-glass text-amber-500 mr-0.5"></i> Search Results`;
                if (selectedCategoryFilter === null) {
                    searchResultsSection.classList.add('hidden');
                }
                searchResultsGrid.innerHTML = '';
                renderCatalog(liveInventory);
                return;
            }

            const filtered = liveInventory.filter(item => 
                item.name.toLowerCase().includes(query) || 
                (item.descSmall && item.descSmall.toLowerCase().includes(query)) ||
                (item.descBig && item.descBig.toLowerCase().includes(query)) ||
                (item.category && item.category.toLowerCase().includes(query))
            );

            searchResultsSection.classList.remove('hidden');
            searchResultsTitle.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> <i class="fa-solid fa-magnifying-glass text-amber-500 mr-0.5"></i> Search Results (${query})`;
            
            if (filtered.length === 0) {
                searchResultsGrid.innerHTML = `<div class="col-span-full text-center py-6 text-gray-400 text-xs bg-white rounded-xl border border-gray-200">No matching products found.</div>`;
            } else {
                let resHtml = '';
                filtered.forEach(item => {
                    resHtml += generateProductCardHTML(item);
                });
                searchResultsGrid.innerHTML = resHtml;
            }
        };

        window.addToCart = function(firebaseKey) {
            const product = liveInventory.find(p => p.firebaseKey === firebaseKey);
            if (!product || product.inStock === false) return;

            const existing = cart.find(item => item.firebaseKey === firebaseKey);
            if (existing) {
                existing.qtyCount = (existing.qtyCount || 1) + 1;
            } else {
                cart.push({ ...product, qtyCount: 1 });
            }

            saveAndRefreshUI(firebaseKey);
        };

        window.updateQuantity = function(firebaseKey, change) {
            const existing = cart.find(item => item.firebaseKey === firebaseKey);
            if (!existing) return;

            existing.qtyCount = (existing.qtyCount || 1) + change;
            if (existing.qtyCount <= 0) {
                cart = cart.filter(item => item.firebaseKey !== firebaseKey);
            }

            saveAndRefreshUI(firebaseKey);
        };

        function saveAndRefreshUI(firebaseKey) {
            localStorage.setItem("ymca_cart", JSON.stringify(cart));
            updateCartCount();

            const newActionHtml = getCartActionHTML(firebaseKey);
            document.querySelectorAll(`[id="action-container-${firebaseKey}"]`).forEach(el => {
                el.innerHTML = newActionHtml;
            });
        }

        function updateCartCount() {
            const totalCount = cart.reduce((sum, item) => sum + (item.qtyCount || 1), 0);
            const badge = document.getElementById('cart-badge');
            if (badge) {
                badge.textContent = totalCount;
                if (totalCount > 0) {
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        window.toggleCartModal = function() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                renderCartModalItems();
            }
        };

        function renderCartModalItems() {
            const container = document.getElementById('cart-items-list');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs">Your cart is currently empty.</div>`;
                document.getElementById('cart-subtotal').textContent = '₹0.00';
                document.getElementById('cart-total').textContent = '₹0.00';
                return;
            }

            let html = '';
            let subtotal = 0;

            cart.forEach(item => {
                const offerDetails = calculateOfferDetails(item);
                const finalUnitPrice = parseFloat(offerDetails.finalPrice);
                const qty = item.qtyCount || 1;
                const itemTotal = finalUnitPrice * qty;
                subtotal += itemTotal;

                html += `
                    <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-white rounded-lg border border-slate-200 overflow-hidden shrink-0 flex items-center justify-center p-1">
                                <img src="${item.img || ''}" alt="" class="w-full h-full object-contain">
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-900 text-xs leading-snug">${item.name}</h4>
                                <p class="text-[10px] text-slate-500 mt-0.5">₹${offerDetails.finalPrice} × ${qty} = <strong class="text-amber-600">₹${itemTotal.toFixed(2)}</strong></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0 bg-white border border-slate-200 rounded-lg p-1">
                            <button onclick="window.updateQuantity('${item.firebaseKey}', -1); renderCartModalItems();" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-bold text-xs flex items-center justify-center">-</button>
                            <span class="text-xs font-bold text-slate-900 w-4 text-center">${qty}</span>
                            <button onclick="window.updateQuantity('${item.firebaseKey}', 1); renderCartModalItems();" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-bold text-xs flex items-center justify-center">+</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('cart-subtotal').textContent = `₹${subtotal.toFixed(2)}`;
            document.getElementById('cart-total').textContent = `₹${subtotal.toFixed(2)}`;
        }

        window.checkoutWhatsApp = function() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            let message = "🛍️ *New Order from Munchirai YMCA Store*\n\n";
            let totalPayable = 0;

            cart.forEach(item => {
                const offerDetails = calculateOfferDetails(item);
                const finalUnitPrice = parseFloat(offerDetails.finalPrice);
                const qty = item.qtyCount || 1;
                const itemTotal = finalUnitPrice * qty;
                totalPayable += itemTotal;

                message += `• *${item.name}* (${item.qty || 'Std'}) x ${qty} = ₹${itemTotal.toFixed(2)}\n`;
            });

            message += `\n💰 *Total Payable:* ₹${totalPayable.toFixed(2)}\n\nPlease confirm my order and share delivery details.`;

            const merchantWhatsAppNumber = "919487051234"; 
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${merchantWhatsAppNumber}?text=${encodedMessage}`, '_blank');
        };

        document.addEventListener('DOMContentLoaded', () => {
            updateCartCount();
            
            const slider = document.getElementById('ad-preview-slider');
            if (slider) {
                slider.addEventListener('scroll', () => {
                    if (currentAds.length <= 1) return;
                    const index = Math.round(slider.scrollLeft / slider.clientWidth);
                    if (index !== currentSlideIndex && index >= 0 && index < currentAds.length) {
                        currentSlideIndex = index;
                        updateDots(currentSlideIndex);
                    }
                }, { passive: true });
            }
        });
    </script>
</body>
</html>
