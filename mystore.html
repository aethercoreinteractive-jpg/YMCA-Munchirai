<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Storefront</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-500 selection:text-slate-950 pb-24">

    <!-- Store Navigation Bar -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md text-slate-900 shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-14 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 shrink-0">
                <a href="mystore.html" class="text-sm sm:text-lg font-black tracking-tighter uppercase text-slate-900 flex items-center gap-1.5">
                    <span class="bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-xs font-bold shadow-sm">MY</span> Munchirai YMCA
                </a>
            </div>
            
            <div class="flex items-center gap-2">
                <a href="productmanagement.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-bold transition border border-slate-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-[10px] text-amber-600"></i> Admin
                </a>
                <button onclick="toggleCartModal()" class="relative bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-black transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="hidden sm:inline">Cart</span>
                    <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white rounded-full text-[10px] w-5 h-5 flex items-center justify-center font-bold border-2 border-white shadow">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Global Promotional Banner Container -->
    <div id="global-banner-wrapper" class="hidden bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 text-slate-950 px-4 py-2 font-black text-center text-xs sm:text-sm shadow-sm tracking-wide flex items-center justify-center gap-2">
        <i class="fa-solid fa-bolt animate-pulse"></i>
        <span id="global-banner-text">Special Offer Active Now!</span>
    </div>

    <!-- Main Store Content Container -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-5 space-y-6">
        
        <!-- Search & Category Filters -->
        <div class="space-y-3">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="store-search" onkeyup="filterStoreCatalog()" placeholder="Search products by name..." class="w-full bg-white border border-slate-200 rounded-2xl pl-10 pr-4 py-3 text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-amber-500 shadow-sm">
            </div>

            <!-- Categories Horizontal Scroll Bar -->
            <div id="category-pills-container" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="filterByCategory('All')" class="category-pill bg-amber-500 text-slate-950 px-4 py-1.5 rounded-xl text-xs font-black shrink-0 transition shadow-sm">
                    All Products
                </button>
            </div>
        </div>

        <!-- Product Grid Section -->
        <section>
            <div class="flex items-center justify-between mb-3">
                <h2 id="current-category-title" class="text-xs sm:text-sm font-black text-amber-600 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-store text-amber-500"></i> Catalog (<span id="product-count">0</span>)
                </h2>
            </div>

            <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
                <div class="col-span-full text-center py-16 text-slate-400 text-xs">
                    <i class="fa-solid fa-spinner fa-spin text-xl text-amber-500 mb-2"></i>
                    <p>Loading catalog items...</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Slide-Over Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity" onclick="toggleCartModal()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white border-l border-slate-200 text-slate-900 flex flex-col shadow-2xl">
                <!-- Cart Header -->
                <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="text-sm font-black uppercase tracking-wider text-amber-600 flex items-center gap-2">
                        <i class="fa-solid fa-cart-shopping"></i> Your Shopping Cart
                    </h3>
                    <button onclick="toggleCartModal()" class="text-slate-400 hover:text-slate-700 p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <!-- Cart Items List -->
                <div id="cart-items-container" class="flex-1 overflow-y-auto p-4 space-y-3">
                    <div class="text-center py-12 text-slate-400 text-xs">Your cart is currently empty.</div>
                </div>

                <!-- Cart Summary & Checkout -->
                <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
                    <div class="space-y-1.5 text-xs">
                        <div class="flex justify-between text-slate-500">
                            <span>Subtotal</span>
                            <span id="cart-subtotal" class="font-bold text-slate-900">₹0</span>
                        </div>
                        <div class="flex justify-between text-slate-500">
                            <span>Total Savings</span>
                            <span id="cart-savings" class="font-bold text-amber-600">-₹0</span>
                        </div>
                        <div class="flex justify-between text-sm pt-2 border-t border-slate-200 font-black text-slate-900">
                            <span>Final Payable Amount</span>
                            <span id="cart-total" class="text-amber-600">₹0</span>
                        </div>
                    </div>

                    <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black text-xs sm:text-sm py-3 px-4 rounded-xl transition shadow-sm flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-base"></i> Checkout via WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 z-50 overflow-y-auto hidden flex items-center justify-center p-3">
        <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity" onclick="closeDetailModal()"></div>
        <div class="relative bg-white border border-slate-200 rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl z-10 p-4 sm:p-6 space-y-4">
            <button onclick="closeDetailModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-700 bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="detail-modal-content" class="space-y-4">
                <!-- Dynamically populated detail content -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK Imports & Storefront Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let globalInventory = [];
        let globalCategories = [];
        let globalStoreOffer = { enabled: false, percentage: 0 };
        let activeCategoryFilter = 'All';
        let cart = JSON.parse(localStorage.getItem('munchirai_cart')) || {};

        // Fetch Global Store Offer
        onValue(ref(db, 'storeOffer'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.enabled && data.percentage > 0) {
                globalStoreOffer = data;
                document.getElementById('global-banner-wrapper').classList.remove('hidden');
                document.getElementById('global-banner-text').textContent = `🎉 Special Store-Wide Offer: Get ${data.percentage}% OFF!`;
            } else {
                globalStoreOffer = { enabled: false, percentage: 0 };
                document.getElementById('global-banner-wrapper').classList.add('hidden');
            }
            renderStoreCatalog(globalInventory);
        });

        // Fetch Categories
        onValue(ref(db, 'categories'), (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('category-pills-container');
            if (data) {
                globalCategories = Object.keys(data).map(key => ({ key, ...data[key] }));
                globalCategories.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
                
                let html = `<button onclick="filterByCategory('All')" class="category-pill ${activeCategoryFilter === 'All' ? 'bg-amber-500 text-slate-950 font-black' : 'bg-white text-slate-700 border border-slate-200 font-semibold'} px-4 py-1.5 rounded-xl text-xs shrink-0 transition shadow-sm">All Products</button>`;
                
                globalCategories.forEach(cat => {
                    const isActive = activeCategoryFilter === cat.name;
                    html += `<button onclick="filterByCategory('${cat.name}')" class="category-pill ${isActive ? 'bg-amber-500 text-slate-950 font-black' : 'bg-white text-slate-700 border border-slate-200 font-semibold'} px-4 py-1.5 rounded-xl text-xs shrink-0 transition shadow-sm">${cat.name}</button>`;
                });
                container.innerHTML = html;
            }
        });

        // Fetch Inventory
        onValue(ref(db, 'inventory'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                globalInventory = Object.keys(data).map(key => ({
                    firebaseKey: key,
                    ...data[key]
                }));
            } else {
                globalInventory = [];
            }
            renderStoreCatalog(globalInventory);
            updateCartUI();
        });

        window.filterByCategory = function(categoryName) {
            activeCategoryFilter = categoryName;
            
            const container = document.getElementById('category-pills-container');
            let html = `<button onclick="filterByCategory('All')" class="category-pill ${activeCategoryFilter === 'All' ? 'bg-amber-500 text-slate-950 font-black' : 'bg-white text-slate-700 border border-slate-200 font-semibold'} px-4 py-1.5 rounded-xl text-xs shrink-0 transition shadow-sm">All Products</button>`;
            globalCategories.forEach(cat => {
                const isActive = activeCategoryFilter === cat.name;
                html += `<button onclick="filterByCategory('${cat.name}')" class="category-pill ${isActive ? 'bg-amber-500 text-slate-950 font-black' : 'bg-white text-slate-700 border border-slate-200 font-semibold'} px-4 py-1.5 rounded-xl text-xs shrink-0 transition shadow-sm">${cat.name}</button>`;
            });
            container.innerHTML = html;

            applyFiltersAndSearch();
        };

        window.filterStoreCatalog = function() {
            applyFiltersAndSearch();
        };

        function applyFiltersAndSearch() {
            const searchQuery = document.getElementById('store-search').value.toLowerCase().trim();
            
            let filtered = globalInventory.filter(item => {
                const matchesCategory = activeCategoryFilter === 'All' || item.category === activeCategoryFilter;
                const matchesSearch = !searchQuery || item.name.toLowerCase().includes(searchQuery) || (item.descSmall && item.descSmall.toLowerCase().includes(searchQuery));
                return matchesCategory && matchesSearch;
            });

            renderStoreCatalog(filtered);
        }

        // Helper function to check and compute individual or global offers
        function getProductOfferDetails(item) {
            let effectiveDiscount = 0;
            let hasOffer = false;

            // Check if individual product offer is configured and active in product management admin
            if (item.offerEnabled && item.offerPercentage > 0) {
                hasOffer = true;
                effectiveDiscount = item.offerPercentage;
            } else if (globalStoreOffer.enabled && globalStoreOffer.percentage > 0) {
                hasOffer = true;
                effectiveDiscount = globalStoreOffer.percentage;
            }

            const originalPrice = parseFloat(item.price) || 0;
            let finalPrice = originalPrice;
            if (hasOffer) {
                finalPrice = originalPrice - (originalPrice * (effectiveDiscount / 100));
            }

            return { hasOffer, effectiveDiscount, originalPrice, finalPrice };
        }

        window.renderStoreCatalog = function(items) {
            const grid = document.getElementById('product-grid');
            document.getElementById('product-count').textContent = items.length;

            if (!items || items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 text-xs">No products found matching your criteria.</div>`;
                return;
            }

            let html = '';
            items.forEach(item => {
                const isOutOfStock = item.inStock === false;
                const { hasOffer, effectiveDiscount, originalPrice, finalPrice } = getProductOfferDetails(item);

                const badgeHtml = hasOffer 
                    ? `<span class="absolute top-2 left-2 bg-amber-500 text-slate-950 font-black text-[9px] px-1.5 py-0.5 rounded shadow-sm z-10">${effectiveDiscount}% OFF</span>` 
                    : '';

                const stockOverlay = isOutOfStock
                    ? `<div class="absolute inset-0 bg-white/80 backdrop-blur-[1px] flex items-center justify-center z-20"><span class="bg-rose-500 text-white font-black text-[10px] px-2 py-1 rounded shadow-sm">OUT OF STOCK</span></div>`
                    : '';

                const cartQty = cart[item.firebaseKey] || 0;

                html += `
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between relative group">
                        ${badgeHtml}
                        ${stockOverlay}
                        <div>
                            <div class="w-full h-32 bg-slate-50 overflow-hidden relative cursor-pointer" onclick="openDetailModal('${item.firebaseKey}')">
                                <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=300'}" alt="${item.name}" class="w-full h-full object-contain p-2 group-hover:scale-105 transition duration-300">
                            </div>
                            <div class="p-2.5 space-y-1">
                                <span class="text-[9px] uppercase tracking-wider font-bold text-amber-600 block">${item.category || 'General'}</span>
                                <h3 onclick="openDetailModal('${item.firebaseKey}')" class="font-bold text-slate-900 text-xs leading-snug line-clamp-2 cursor-pointer hover:text-amber-600 transition">${item.name}</h3>
                                <p class="text-[10px] text-slate-500">${item.qty || 'Std'}</p>
                            </div>
                        </div>

                        <div class="p-2.5 pt-0 space-y-2">
                            <div class="flex items-baseline gap-1.5">
                                <span class="text-xs sm:text-sm font-black text-slate-900">₹${Math.round(finalPrice)}</span>
                                ${hasOffer ? `<span class="text-[10px] text-slate-400 line-through">₹${originalPrice}</span>` : ''}
                            </div>

                            ${!isOutOfStock ? (
                                cartQty === 0 ? `
                                    <button onclick="updateCart('${item.firebaseKey}', 1)" class="w-full bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-black text-xs py-1.5 px-2 rounded-lg transition shadow-sm flex items-center justify-center gap-1">
                                        <i class="fa-solid fa-cart-plus text-[10px]"></i> Add to Cart
                                    </button>
                                ` : `
                                    <div class="flex items-center justify-between bg-slate-100 border border-slate-200 rounded-lg p-1">
                                        <button onclick="updateCart('${item.firebaseKey}', -1)" class="w-6 h-6 bg-white hover:bg-slate-200 rounded text-amber-600 font-bold text-xs flex items-center justify-center shadow-sm">-</button>
                                        <span class="text-xs font-bold text-slate-900">${cartQty}</span>
                                        <button onclick="updateCart('${item.firebaseKey}', 1)" class="w-6 h-6 bg-white hover:bg-slate-200 rounded text-amber-600 font-bold text-xs flex items-center justify-center shadow-sm">+</button>
                                    </div>
                                `
                            ) : `
                                <button disabled class="w-full bg-slate-100 text-slate-400 font-bold text-xs py-1.5 px-2 rounded-lg cursor-not-allowed">Unavailable</button>
                            `}
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        };

        window.openDetailModal = function(firebaseKey) {
            const item = globalInventory.find(p => p.firebaseKey === firebaseKey);
            if (!item) return;

            const { hasOffer, effectiveDiscount, originalPrice, finalPrice } = getProductOfferDetails(item);
            const cartQty = cart[item.firebaseKey] || 0;
            const isOutOfStock = item.inStock === false;

            const modalHtml = `
                <div class="w-full h-56 bg-slate-50 rounded-xl overflow-hidden flex items-center justify-center border border-slate-200">
                    <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=400'}" alt="${item.name}" class="w-full h-full object-contain p-2">
                </div>
                <div>
                    <span class="text-[10px] font-bold text-amber-600 uppercase">${item.category || 'General'}</span>
                    <h2 class="text-base sm:text-lg font-black text-slate-900 mt-0.5">${item.name}</h2>
                    <p class="text-xs text-slate-600 mt-1">${item.descBig || item.descSmall || 'No additional description available.'}</p>
                </div>
                <div class="flex items-center justify-between border-t border-slate-100 pt-3">
                    <div>
                        <span class="text-base sm:text-lg font-black text-slate-900">₹${Math.round(finalPrice)}</span>
                        ${hasOffer ? `<span class="text-xs text-slate-400 line-through ml-2">₹${originalPrice}</span>` : ''}
                        <span class="block text-[10px] text-slate-500">Unit: ${item.qty || 'Std'}</span>
                    </div>
                    <div>
                        ${isOutOfStock ? `<span class="bg-rose-50 text-rose-600 border border-rose-200 px-2 py-1 rounded text-xs font-bold">Out of Stock</span>` : `
                            <span class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-2 py-1 rounded text-xs font-bold">In Stock</span>
                        `}
                    </div>
                </div>
                ${!isOutOfStock ? `
                    <div class="pt-2">
                        ${cartQty === 0 ? `
                            <button onclick="updateCart('${item.firebaseKey}', 1); closeDetailModal();" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs py-2.5 rounded-xl transition shadow-sm">
                                Add to Cart
                            </button>
                        ` : `
                            <div class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl p-2">
                                <span class="text-xs text-slate-700 font-semibold">Quantity in Cart:</span>
                                <div class="flex items-center gap-3">
                                    <button onclick="updateCart('${item.firebaseKey}', -1)" class="w-7 h-7 bg-white hover:bg-slate-200 rounded-lg text-amber-600 font-bold text-xs flex items-center justify-center shadow-sm">-</button>
                                    <span class="text-xs font-bold text-slate-900">${cartQty}</span>
                                    <button onclick="updateCart('${item.firebaseKey}', 1)" class="w-7 h-7 bg-white hover:bg-slate-200 rounded-lg text-amber-600 font-bold text-xs flex items-center justify-center shadow-sm">+</button>
                                </div>
                            </div>
                        `}
                    </div>
                ` : ''}
            `;

            document.getElementById('detail-modal-content').innerHTML = modalHtml;
            document.getElementById('detail-modal').classList.remove('hidden');
        };

        window.closeDetailModal = function() {
            document.getElementById('detail-modal').classList.add('hidden');
        };

        window.updateCart = function(firebaseKey, delta) {
            cart[firebaseKey] = (cart[firebaseKey] || 0) + delta;
            if (cart[firebaseKey] <= 0) {
                delete cart[firebaseKey];
            }
            localStorage.setItem('munchirai_cart', JSON.stringify(cart));
            renderStoreCatalog(globalInventory);
            updateCartUI();
        };

        window.toggleCartModal = function() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('hidden');
            if (!drawer.classList.contains('hidden')) {
                renderCartItems();
            }
        };

        function updateCartUI() {
            let totalCount = 0;
            Object.values(cart).forEach(qty => totalCount += qty);
            document.getElementById('cart-badge').textContent = totalCount;
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const keys = Object.keys(cart);

            if (keys.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs">Your cart is currently empty.</div>`;
                document.getElementById('cart-subtotal').textContent = '₹0';
                document.getElementById('cart-savings').textContent = '-₹0';
                document.getElementById('cart-total').textContent = '₹0';
                return;
            }

            let html = '';
            let subtotal = 0;
            let totalSavings = 0;
            let finalPayable = 0;

            keys.forEach(key => {
                const item = globalInventory.find(p => p.firebaseKey === key);
                if (!item) return;

                const qty = cart[key];
                const { hasOffer, effectiveDiscount, originalPrice, finalPrice } = getProductOfferDetails(item);

                const itemSubtotal = originalPrice * qty;
                const itemFinalTotal = finalPrice * qty;
                const itemSavings = itemSubtotal - itemFinalTotal;

                subtotal += itemSubtotal;
                totalSavings += itemSavings;
                finalPayable += itemFinalTotal;

                html += `
                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                            <div class="w-10 h-10 bg-white rounded-lg overflow-hidden border border-slate-200 shrink-0 flex items-center justify-center">
                                <img src="${item.img || ''}" alt="${item.name}" class="w-full h-full object-contain p-0.5">
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-900 text-xs">${item.name}</h4>
                                <p class="text-[10px] text-slate-500">₹${Math.round(finalPrice)} × ${qty} = <strong class="text-amber-600">₹${Math.round(itemFinalTotal)}</strong></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button onclick="updateCart('${key}', -1); renderCartItems();" class="w-6 h-6 bg-white hover:bg-slate-200 rounded text-amber-600 font-bold text-xs flex items-center justify-center shadow-sm">-</button>
                            <span class="text-xs font-bold text-slate-900 w-4 text-center">${qty}</span>
                            <button onclick="updateCart('${key}', 1); renderCartItems();" class="w-6 h-6 bg-white hover:bg-slate-200 rounded text-amber-600 font-bold text-xs flex items-center justify-center shadow-sm">+</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('cart-subtotal').textContent = `₹${Math.round(subtotal)}`;
            document.getElementById('cart-savings').textContent = `-₹${Math.round(totalSavings)}`;
            document.getElementById('cart-total').textContent = `₹${Math.round(finalPayable)}`;
        }

        window.checkoutWhatsApp = function() {
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            let message = "🛍️ *New Order from Munchirai YMCA Store*\n\n";
            let finalPayable = 0;

            keys.forEach(key => {
                const item = globalInventory.find(p => p.firebaseKey === key);
                if (!item) return;

                const qty = cart[key];
                const { finalPrice } = getProductOfferDetails(item);
                const itemTotal = finalPrice * qty;
                finalPayable += itemTotal;

                message += `• *${item.name}* (${item.qty || 'Std'}) x ${qty} = ₹${Math.round(itemTotal)}\n`;
            });

            message += `\n💰 *Total Payable:* ₹${Math.round(finalPayable)}\n\nPlease confirm my order and share delivery details.`;

            const merchantWhatsAppNumber = "919487051234"; 
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${merchantWhatsAppNumber}?text=${encodedMessage}`, '_blank');
        };
    </script>
</body>
</html>
