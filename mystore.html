<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munchirai YMCA | MY Food Store Catalog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Custom styling for clean horizontal scrollbar */
        .no-scrollbar::-webkit-scrollbar { height: 6px; }
        .no-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .no-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .no-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-amber-500 selection:text-slate-950">

    <!-- Store Header -->
    <header class="sticky top-0 z-40 bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 shrink-0">
                <a href="index.html" class="text-xl sm:text-2xl font-black tracking-tighter uppercase text-white flex items-center gap-2">
                    <span class="bg-amber-500 text-slate-950 px-2 py-0.5 rounded text-lg font-bold">MY</span> Munchirai
                </a>
            </div>

            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-lg transition border border-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-house text-amber-400"></i> Home
                </a>
                <a href="cart.html" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg font-bold text-xs shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart (<span id="cart-count">0</span>)</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Store Catalog Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4 border-b pb-4 border-gray-200">
            <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-amber-600 bg-amber-50 px-2.5 py-1 rounded border border-amber-200">Official Storefront</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-gray-900 mt-2">MY Food Product Catalog</h1>
                <p class="text-xs text-gray-500 mt-1">Live inventory organized by category. Slide to see more items per row.</p>
            </div>
            <div class="w-full md:w-72">
                <input type="text" id="search-bar" onkeyup="filterProducts()" placeholder="Search products..." class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-amber-500 shadow-sm">
            </div>
        </div>

        <!-- Products Container Grouped by Category -->
        <div id="store-categories-container" class="space-y-12">
            <div class="text-center py-20 text-gray-400 text-xs">Loading live inventory from Firebase...</div>
        </div>

        <!-- Empty State Notice -->
        <div id="empty-state" class="hidden text-center py-20 bg-white rounded-2xl border border-gray-200 shadow-sm mt-4">
            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center mx-auto mb-3 text-lg">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <h3 class="font-bold text-sm text-gray-900">No products found</h3>
            <p class="text-xs text-gray-500 mt-1">Add items via your admin dashboard to display them here.</p>
        </div>
    </main>

    <!-- Firebase SDK Imports & Store Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let liveInventory = [];
        let categoriesCache = [];
        let cart = JSON.parse(localStorage.getItem("ymca_cart")) || [];
        let expandedProductKeys = {}; // Tracks which category has an inline expanded view open

        // Helper function to generate Amazon-style star rating HTML string
        function generateStarRatingHTML(ratingValue, iconSizeClass = "text-sm") {
            const rating = parseFloat(ratingValue) || 0;
            let starsHtml = '';
            
            for (let i = 1; i <= 5; i++) {
                if (rating >= i) {
                    starsHtml += `<i class="fa-solid fa-star text-amber-400 ${iconSizeClass}"></i>`;
                } else if (rating >= i - 0.5) {
                    starsHtml += `<i class="fa-solid fa-star-half-stroke text-amber-400 ${iconSizeClass}"></i>`;
                } else {
                    starsHtml += `<i class="fa-regular fa-star text-slate-300 ${iconSizeClass}"></i>`;
                }
            }
            return `<div class="inline-flex items-center gap-0.5" title="${rating} out of 5 stars">${starsHtml}</div>`;
        }

        // Fetch Categories first to keep exact sorting order
        const categoriesRef = ref(db, 'categories');
        onValue(categoriesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                categoriesCache = Object.keys(data).map(key => ({ key, ...data[key] }));
                categoriesCache.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            } else {
                categoriesCache = [];
            }
            renderCatalog(liveInventory);
        });

        // Fetch Inventory items
        const inventoryRef = ref(db, 'inventory');
        onValue(inventoryRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                liveInventory = Object.keys(data).map(key => ({
                    firebaseKey: key,
                    ...data[key]
                }));
            } else {
                liveInventory = [];
            }
            renderCatalog(liveInventory);
            updateCartCount();
        });

        window.renderCatalog = function(productsToRender) {
            const container = document.getElementById('store-categories-container');
            const emptyState = document.getElementById('empty-state');

            if (!productsToRender || productsToRender.length === 0) {
                container.innerHTML = "";
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            let categoryGroups = {};
            categoriesCache.forEach(cat => {
                categoryGroups[cat.name] = [];
            });
            categoryGroups["Uncategorized"] = [];

            productsToRender.forEach(item => {
                const cat = item.category || "Uncategorized";
                if (!categoryGroups[cat]) {
                    categoryGroups[cat] = [];
                }
                categoryGroups[cat].push(item);
            });

            Object.keys(categoryGroups).forEach(cat => {
                categoryGroups[cat].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            });

            let displayCategories = categoriesCache.map(c => c.name);
            if (!displayCategories.includes("Uncategorized") && categoryGroups["Uncategorized"].length > 0) {
                displayCategories.push("Uncategorized");
            }

            let htmlOutput = '';

            displayCategories.forEach(catName => {
                const groupItems = categoryGroups[catName] || [];
                if (groupItems.length === 0) return;

                const activeExpandedKey = expandedProductKeys[catName];
                const expandedItem = groupItems.find(i => i.firebaseKey === activeExpandedKey);

                htmlOutput += `
                    <div class="space-y-4">
                        <!-- Category Section Row Header -->
                        <div class="flex items-center justify-between border-b-2 border-amber-500 pb-2">
                            <h2 class="text-base sm:text-lg font-black text-slate-900 uppercase tracking-wider flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                                ${catName}
                            </h2>
                            <span class="text-xs font-bold bg-amber-100 text-amber-800 px-3 py-0.5 rounded-full">${groupItems.length} item${groupItems.length > 1 ? 's' : ''}</span>
                        </div>

                        <!-- Slider Row: Exactly 3 cards visible on desktop, scrollable for more -->
                        <div class="flex overflow-x-auto no-scrollbar gap-6 pb-3 pt-1 snap-x scroll-smooth">
                `;

                groupItems.forEach(item => {
                    const isSelected = item.firebaseKey === activeExpandedKey;
                    const selectedCardRing = isSelected ? 'border-amber-500 ring-2 ring-amber-400 shadow-md' : 'border-gray-200 hover:border-amber-400';

                    htmlOutput += `
                        <div onclick="toggleExpandProduct('${catName}', '${item.firebaseKey}')" class="min-w-[280px] sm:min-w-[320px] max-w-[340px] flex-shrink-0 snap-start bg-white border ${selectedCardRing} rounded-xl p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between cursor-pointer group">
                            <div>
                                <!-- Image: Fully visible without cropping using object-contain -->
                                <div class="relative bg-slate-100 rounded-lg overflow-hidden aspect-[4/3] mb-3 border border-gray-100 flex items-center justify-center">
                                    <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${item.name}" class="w-full h-full object-contain p-2 transition duration-300 group-hover:scale-105">
                                    <span class="absolute top-2 left-2 bg-amber-500 text-slate-950 font-bold text-[9px] px-2 py-0.5 rounded shadow">In Stock</span>
                                </div>

                                <div class="flex items-center justify-between text-[10px] font-semibold text-gray-500 mb-1">
                                    <span class="text-amber-600 font-bold">${item.category || 'MY Food Store'}</span>
                                    <span class="text-[10px] text-slate-500 font-medium bg-slate-100 px-2 py-0.5 rounded"><i class="fa-solid fa-arrow-pointer text-amber-500 mr-1"></i> Tap to view</span>
                                </div>

                                <h3 class="font-bold text-sm text-gray-900 line-clamp-1 mb-1 group-hover:text-amber-600 transition">${item.name}</h3>

                                <!-- Small Description Shown Directly on Card -->
                                <p class="text-[11px] text-gray-600 font-light line-clamp-2 mb-3">${item.smallDesc || 'No brief summary available.'}</p>
                            </div>

                            <!-- Price, Quantity, & Add to Cart Button -->
                            <div class="mt-2 pt-3 border-t border-gray-100 flex items-center justify-between">
                                <div>
                                    <span class="font-black text-base text-gray-900">₹${typeof item.price === 'string' ? item.price.replace('₹', '') : item.price}</span>
                                    ${item.qty ? `<span class="block text-[10px] text-slate-400 font-medium">Qty: ${item.qty}</span>` : ''}
                                </div>
                                <button onclick="event.stopPropagation(); window.addToCart('${item.firebaseKey}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3.5 py-2 rounded-lg transition shadow flex items-center gap-1.5">
                                    <i class="fa-solid fa-cart-plus text-xs"></i> Add to Cart
                                </button>
                            </div>
                        </div>
                    `;
                });

                htmlOutput += `</div>`;

                // Inline Expanded Product View (Appears right below this row, pushing subsequent categories down)
                if (expandedItem) {
                    const starsDisplay = generateStarRatingHTML(expandedItem.rating || 5, "text-sm");
                    htmlOutput += `
                        <div class="bg-white border-2 border-amber-400 rounded-2xl p-5 sm:p-6 shadow-xl relative animate-fadeIn mt-2">
                            <!-- Close Inline Detail Button -->
                            <button onclick="toggleExpandProduct('${catName}', '${expandedItem.firebaseKey}')" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition z-10">
                                <i class="fa-solid fa-xmark text-sm"></i>
                            </button>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                                <!-- Big Scaled Image Preview -->
                                <div class="relative bg-slate-100 rounded-xl overflow-hidden aspect-[4/3] border border-slate-200 flex items-center justify-center shadow-inner">
                                    <img src="${expandedItem.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${expandedItem.name}" class="w-full h-full object-contain p-4">
                                    <span class="absolute top-3 left-3 bg-amber-500 text-slate-950 font-bold text-[10px] px-2.5 py-1 rounded shadow">In Stock</span>
                                </div>

                                <!-- Expanded Details & Specs -->
                                <div class="md:col-span-2 space-y-3">
                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                        <span class="text-amber-600 font-bold uppercase tracking-wider text-[10px] bg-amber-50 px-2.5 py-1 rounded border border-amber-200">${expandedItem.category || 'General'}</span>
                                        <div class="flex items-center gap-1.5 text-slate-700 font-bold bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-lg">
                                            ${starsDisplay}
                                            <span class="text-slate-800 text-xs ml-1">${expandedItem.rating || '5'} / 5</span>
                                        </div>
                                    </div>

                                    <h3 class="text-lg sm:text-xl font-black text-slate-900">${expandedItem.name}</h3>

                                    <div class="flex items-center gap-4">
                                        <span class="text-xl font-black text-slate-900">₹${typeof expandedItem.price === 'string' ? expandedItem.price.replace('₹', '') : expandedItem.price}</span>
                                        ${expandedItem.qty ? `<span class="text-xs bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-lg text-slate-700 font-bold">Quantity / Unit: ${expandedItem.qty}</span>` : ''}
                                    </div>

                                    <!-- Big Detailed Description -->
                                    <div class="bg-amber-50/60 border border-amber-200/80 p-3.5 rounded-xl text-xs text-slate-700 font-light leading-relaxed">
                                        <strong class="block text-slate-900 font-bold mb-1"><i class="fa-solid fa-circle-info text-amber-600 mr-1"></i> Detailed Overview & Specifications:</strong>
                                        ${expandedItem.bigDesc || expandedItem.desc || 'No detailed specifications provided for this product.'}
                                    </div>

                                    <!-- Action Button inside Expanded View -->
                                    <div class="pt-2 flex items-center justify-end gap-3">
                                        <button onclick="toggleExpandProduct('${catName}', '${expandedItem.firebaseKey}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl text-xs transition border border-slate-200">
                                            Collapse
                                        </button>
                                        <button onclick="window.addToCart('${expandedItem.firebaseKey}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-md flex items-center gap-2">
                                            <i class="fa-solid fa-cart-plus"></i> Add to Cart
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                htmlOutput += `</div>`;
            });

            container.innerHTML = htmlOutput;
        };

        window.toggleExpandProduct = function(categoryName, firebaseKey) {
            if (expandedProductKeys[categoryName] === firebaseKey) {
                delete expandedProductKeys[categoryName]; // Collapse if already open
            } else {
                expandedProductKeys[categoryName] = firebaseKey; // Expand this product inline
            }
            renderCatalog(liveInventory);
        };

        window.filterProducts = function() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = liveInventory.filter(item => 
                item.name.toLowerCase().includes(query) || 
                (item.smallDesc && item.smallDesc.toLowerCase().includes(query)) ||
                (item.bigDesc && item.bigDesc.toLowerCase().includes(query)) ||
                (item.category && item.category.toLowerCase().includes(query))
            );
            renderCatalog(filtered);
        };

        window.addToCart = function(firebaseKey) {
            const product = liveInventory.find(p => p.firebaseKey === firebaseKey);
            if (!product) return;

            const existing = cart.find(item => item.firebaseKey === firebaseKey);
            if (existing) {
                existing.qtyCount = (existing.qtyCount || 1) + 1;
            } else {
                cart.push({ ...product, qtyCount: 1 });
            }

            localStorage.setItem("ymca_cart", JSON.stringify(cart));
            updateCartCount();
            alert(`${product.name} added to cart!`);
        };

        function updateCartCount() {
            const totalCount = cart.reduce((sum, item) => sum + (item.qtyCount || 1), 0);
            document.getElementById('cart-count').textContent = totalCount;
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateCartCount();
        });
    </script>
</body>
</html>
