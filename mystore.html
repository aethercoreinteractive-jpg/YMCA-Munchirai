<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munchirai YMCA | MY Food Store Catalog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Custom styling for clean horizontal scrollbar */
        .no-scrollbar::-webkit-scrollbar { height: 5px; }
        .no-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .no-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .no-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-amber-500 selection:text-slate-950">

    <!-- Store Header -->
    <header class="sticky top-0 z-40 bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 shrink-0">
                <a href="index.html" class="text-xl sm:text-2xl font-black tracking-tighter uppercase text-white flex items-center gap-2">
                    <span class="bg-amber-500 text-slate-950 px-2 py-0.5 rounded text-lg font-bold">MY</span> Munchirai
                </a>
            </div>

            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-lg transition border border-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-house text-amber-400"></i> Home
                </a>
                <a href="cart.html" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg font-bold text-xs shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart (<span id="cart-count">0</span>)</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Store Catalog Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- FULL PAGE-LIKE PRODUCT VIEW CONTAINER (Hidden by default, shown on card tap) -->
        <div id="product-page-view" class="hidden mb-12">
            <div class="bg-white border border-gray-200 rounded-3xl p-6 sm:p-8 shadow-xl relative animate-fadeIn">
                <!-- Back Button mimicking new page navigation -->
                <button onclick="closeProductPageView()" class="inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold px-4 py-2.5 rounded-xl transition border border-slate-200 mb-6 shadow-sm">
                    <i class="fa-solid fa-arrow-left"></i> Back to Catalog
                </button>

                <div id="product-page-content">
                    <!-- Injected via JavaScript -->
                </div>
            </div>
        </div>

        <!-- REGULAR CATALOG WRAPPER (Hidden when product page view is active) -->
        <div id="catalog-main-wrapper">
            <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4 border-b pb-4 border-gray-200">
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-amber-600 bg-amber-50 px-2.5 py-1 rounded border border-amber-200">Official Storefront</span>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-gray-900 mt-2">MY Food Product Catalog</h1>
                    <p class="text-xs text-gray-500 mt-1">Live inventory organized by category. Compact cards with price/qty split and full-width buttons.</p>
                </div>
                <div class="w-full md:w-72">
                    <input type="text" id="search-bar" onkeyup="filterProducts()" placeholder="Search products..." class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-amber-500 shadow-sm">
                </div>
            </div>

            <!-- Products Container Grouped by Category -->
            <div id="store-categories-container" class="space-y-12">
                <div class="text-center py-20 text-gray-400 text-xs">Loading live inventory from Firebase...</div>
            </div>

            <!-- Empty State Notice -->
            <div id="empty-state" class="hidden text-center py-20 bg-white rounded-2xl border border-gray-200 shadow-sm mt-4">
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center mx-auto mb-3 text-lg">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h3 class="font-bold text-sm text-gray-900">No products found</h3>
                <p class="text-xs text-gray-500 mt-1">Add items via your admin dashboard to display them here.</p>
            </div>
        </div>
    </main>

    <!-- Firebase SDK Imports & Store Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let liveInventory = [];
        let categoriesCache = [];
        let cart = JSON.parse(localStorage.getItem("ymca_cart")) || [];

        // Helper function for Amazon-style star rating HTML string
        function generateStarRatingHTML(ratingValue, iconSizeClass = "text-base") {
            const rating = parseFloat(ratingValue) || 0;
            let starsHtml = '';
            
            for (let i = 1; i <= 5; i++) {
                if (rating >= i) {
                    starsHtml += `<i class="fa-solid fa-star text-amber-400 ${iconSizeClass}"></i>`;
                } else if (rating >= i - 0.5) {
                    starsHtml += `<i class="fa-solid fa-star-half-stroke text-amber-400 ${iconSizeClass}"></i>`;
                } else {
                    starsHtml += `<i class="fa-regular fa-star text-slate-300 ${iconSizeClass}"></i>`;
                }
            }
            return `<div class="inline-flex items-center gap-0.5" title="${rating} out of 5 stars">${starsHtml}</div>`;
        }

        const categoriesRef = ref(db, 'categories');
        onValue(categoriesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                categoriesCache = Object.keys(data).map(key => ({ key, ...data[key] }));
                categoriesCache.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            } else {
                categoriesCache = [];
            }
            renderCatalog(liveInventory);
        });

        const inventoryRef = ref(db, 'inventory');
        onValue(inventoryRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                liveInventory = Object.keys(data).map(key => ({
                    firebaseKey: key,
                    ...data[key]
                }));
            } else {
                liveInventory = [];
            }
            renderCatalog(liveInventory);
            updateCartCount();
        });

        window.renderCatalog = function(productsToRender) {
            const container = document.getElementById('store-categories-container');
            const emptyState = document.getElementById('empty-state');

            if (!productsToRender || productsToRender.length === 0) {
                container.innerHTML = "";
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            let categoryGroups = {};
            categoriesCache.forEach(cat => {
                categoryGroups[cat.name] = [];
            });
            categoryGroups["Uncategorized"] = [];

            productsToRender.forEach(item => {
                const cat = item.category || "Uncategorized";
                if (!categoryGroups[cat]) {
                    categoryGroups[cat] = [];
                }
                categoryGroups[cat].push(item);
            });

            Object.keys(categoryGroups).forEach(cat => {
                categoryGroups[cat].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            });

            let displayCategories = categoriesCache.map(c => c.name);
            if (!displayCategories.includes("Uncategorized") && categoryGroups["Uncategorized"].length > 0) {
                displayCategories.push("Uncategorized");
            }

            let htmlOutput = '';

            displayCategories.forEach(catName => {
                const groupItems = categoryGroups[catName] || [];
                if (groupItems.length === 0) return;

                htmlOutput += `
                    <div class="space-y-4">
                        <!-- Category Section Row Header -->
                        <div class="flex items-center justify-between border-b-2 border-amber-500 pb-2">
                            <h2 class="text-base sm:text-lg font-black text-slate-900 uppercase tracking-wider flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                                ${catName}
                            </h2>
                            <span class="text-xs font-bold bg-amber-100 text-amber-800 px-3 py-0.5 rounded-full">${groupItems.length} item${groupItems.length > 1 ? 's' : ''}</span>
                        </div>

                        <!-- Slider Row: Enforces exactly 3 cards visible at a time -->
                        <div class="flex overflow-x-auto no-scrollbar gap-5 pb-3 pt-1 snap-x scroll-smooth">
                `;

                groupItems.forEach(item => {
                    const cleanPrice = typeof item.price === 'string' ? item.price.replace('₹', '') : item.price;

                    htmlOutput += `
                        <div onclick="openProductPageView('${item.firebaseKey}')" class="w-[85%] sm:w-[calc(50%-10px)] lg:w-[calc(33.333%-14px)] flex-shrink-0 snap-start border border-gray-200 hover:border-amber-400 bg-white rounded-xl p-2.5 shadow-sm hover:shadow transition flex flex-col justify-between cursor-pointer group">
                            <div>
                                <!-- Very Small Image Sized Compact Frame -->
                                <div class="relative bg-slate-100 rounded-lg overflow-hidden h-32 mb-2 border border-gray-100 flex items-center justify-center">
                                    <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${item.name}" class="w-full h-full object-contain p-1 transition duration-300 group-hover:scale-105">
                                    <span class="absolute top-1 left-1 bg-amber-500 text-slate-950 font-bold text-[8px] px-1.5 py-0.5 rounded shadow">In Stock</span>
                                </div>

                                <h3 class="font-bold text-xs text-gray-900 line-clamp-1 mb-0.5 group-hover:text-amber-600 transition">${item.name}</h3>

                                <p class="text-[10px] text-gray-500 font-light line-clamp-1 mb-2">${item.smallDesc || 'No brief summary.'}</p>
                            </div>

                            <!-- Price on one side, Quantity on the other side -->
                            <div>
                                <div class="flex items-center justify-between text-xs py-1 border-t border-b border-gray-100 mb-2 bg-gray-50/50 px-2 rounded">
                                    <span class="font-black text-slate-900">₹${cleanPrice}</span>
                                    <span class="text-[10px] text-slate-500 font-semibold">${item.qty ? item.qty : 'Standard'}</span>
                                </div>

                                <!-- Lengthy Full-Width Add to Cart Button -->
                                <button onclick="event.stopPropagation(); window.addToCart('${item.firebaseKey}')" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold py-2 px-3 rounded-lg transition shadow flex items-center justify-center gap-1.5">
                                    <i class="fa-solid fa-cart-plus text-xs"></i> Add to Cart
                                </button>
                            </div>
                        </div>
                    `;
                });

                htmlOutput += `</div></div>`;
            });

            container.innerHTML = htmlOutput;
        };

        window.openProductPageView = function(firebaseKey) {
            const item = liveInventory.find(p => p.firebaseKey === firebaseKey);
            if (!item) return;

            const starsDisplay = generateStarRatingHTML(item.rating || 5, "text-base");
            const pageContent = document.getElementById('product-page-content');

            pageContent.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
                    <!-- Left: Large Scaled Image Showcase -->
                    <div class="relative bg-slate-100 rounded-2xl overflow-hidden aspect-[4/3] border border-slate-200 flex items-center justify-center shadow-inner">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${item.name}" class="w-full h-full object-contain p-6">
                        <span class="absolute top-4 left-4 bg-amber-500 text-slate-950 font-bold text-xs px-3 py-1 rounded shadow">In Stock</span>
                    </div>

                    <!-- Right: Product Full Info Details -->
                    <div class="space-y-4">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <span class="text-amber-600 font-bold uppercase tracking-wider text-xs bg-amber-50 px-3 py-1 rounded-lg border border-amber-200">${item.category || 'General'}</span>
                            <div class="flex items-center gap-2 text-slate-700 font-bold bg-slate-50 border border-slate-200 px-3 py-1 rounded-xl">
                                ${starsDisplay}
                                <span class="text-slate-900 text-sm ml-1">${item.rating || '5'} / 5</span>
                            </div>
                        </div>

                        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">${item.name}</h1>

                        <div class="flex items-center gap-4 py-2">
                            <span class="text-3xl font-black text-slate-900">₹${typeof item.price === 'string' ? item.price.replace('₹', '') : item.price}</span>
                            ${item.qty ? `<span class="text-xs bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl text-slate-700 font-bold">Quantity / Unit: ${item.qty}</span>` : ''}
                        </div>

                        <!-- Full Detailed Specifications Box -->
                        <div class="bg-amber-50/60 border border-amber-200/80 p-4 sm:p-5 rounded-2xl text-xs sm:text-sm text-slate-700 font-light leading-relaxed">
                            <strong class="block text-slate-900 font-bold mb-1.5 text-xs uppercase tracking-wider text-amber-800"><i class="fa-solid fa-circle-info text-amber-600 mr-1.5"></i> Detailed Overview & Specifications</strong>
                            ${item.bigDesc || item.desc || 'No detailed specifications provided for this product.'}
                        </div>

                        <!-- Action Buttons -->
                        <div class="pt-4 flex items-center gap-4">
                            <button onclick="window.addToCart('${item.firebaseKey}')" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-3.5 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2">
                                <i class="fa-solid fa-cart-plus text-base"></i> Add to Cart
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Below Section: Other Products in Store Catalog Preview -->
                <div class="mt-16 pt-8 border-t border-gray-200">
                    <h3 class="text-base font-black text-slate-900 uppercase tracking-wider mb-4"><i class="fa-solid fa-store text-amber-500 mr-2"></i> Explore More Products</h3>
                    <p class="text-xs text-gray-500 mb-4">Click back above to view full categorized rows or browse additional items.</p>
                </div>
            `;

            // Hide catalog and show page view
            document.getElementById('catalog-main-wrapper').classList.add('hidden');
            document.getElementById('product-page-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.closeProductPageView = function() {
            document.getElementById('product-page-view').classList.add('hidden');
            document.getElementById('catalog-main-wrapper').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.filterProducts = function() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = liveInventory.filter(item => 
                item.name.toLowerCase().includes(query) || 
                (item.smallDesc && item.smallDesc.toLowerCase().includes(query)) ||
                (item.bigDesc && item.bigDesc.toLowerCase().includes(query)) ||
                (item.category && item.category.toLowerCase().includes(query))
            );
            renderCatalog(filtered);
        };

        window.addToCart = function(firebaseKey) {
            const product = liveInventory.find(p => p.firebaseKey === firebaseKey);
            if (!product) return;

            const existing = cart.find(item => item.firebaseKey === firebaseKey);
            if (existing) {
                existing.qtyCount = (existing.qtyCount || 1) + 1;
            } else {
                cart.push({ ...product, qtyCount: 1 });
            }

            localStorage.setItem("ymca_cart", JSON.stringify(cart));
            updateCartCount();
            alert(`${product.name} added to cart!`);
        };

        function updateCartCount() {
            const totalCount = cart.reduce((sum, item) => sum + (item.qtyCount || 1), 0);
            document.getElementById('cart-count').textContent = totalCount;
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateCartCount();
        });
    </script>
</body>
</html>
