<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munchirai YMCA | MY Food Store Catalog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-black selection:text-white">

    <!-- Store Header -->
    <header class="sticky top-0 z-40 bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 shrink-0">
                <a href="index.html" class="text-xl sm:text-2xl font-black tracking-tighter uppercase text-white flex items-center gap-2">
                    <span class="bg-amber-500 text-slate-950 px-2 py-0.5 rounded text-lg font-bold">MY</span> Munchirai
                </a>
            </div>

            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-lg transition border border-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-house text-amber-400"></i> Home
                </a>
                <a href="cart.html" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg font-bold text-xs shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart (<span id="cart-count">0</span>)</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Store Catalog Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4 border-b pb-4 border-gray-200">
            <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-amber-600 bg-amber-50 px-2.5 py-1 rounded border border-amber-200">Official Storefront</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-gray-900 mt-2">MY Food Product Catalog</h1>
                <p class="text-xs text-gray-500 mt-1">Live inventory synchronized directly from your Firebase database.</p>
            </div>
            <div class="w-full md:w-72">
                <input type="text" id="search-bar" onkeyup="filterProducts()" placeholder="Search products..." class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-amber-500 shadow-sm">
            </div>
        </div>

        <!-- Products Grid -->
        <div id="store-products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-20 text-gray-400 text-xs">Loading live inventory from Firebase...</div>
        </div>

        <!-- Empty State Notice -->
        <div id="empty-state" class="hidden text-center py-20 bg-white rounded-2xl border border-gray-200 shadow-sm mt-4">
            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center mx-auto mb-3 text-lg">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <h3 class="font-bold text-sm text-gray-900">No products found</h3>
            <p class="text-xs text-gray-500 mt-1">Add items via your admin dashboard to display them here.</p>
        </div>
    </main>

    <!-- Firebase SDK Imports & Store Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let liveInventory = [];
        let cart = JSON.parse(localStorage.getItem("ymca_cart")) || [];

        const inventoryRef = ref(db, 'inventory');
        onValue(inventoryRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                liveInventory = Object.keys(data).map(key => ({
                    firebaseKey: key,
                    ...data[key]
                }));
            } else {
                liveInventory = [];
            }
            renderStoreProducts(liveInventory);
            updateCartCount();
        });

        window.renderStoreProducts = function(productsToRender) {
            const grid = document.getElementById('store-products-grid');
            const emptyState = document.getElementById('empty-state');

            if (!productsToRender || productsToRender.length === 0) {
                grid.innerHTML = "";
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = productsToRender.map(item => `
                <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md hover:border-amber-400 transition flex flex-col justify-between">
                    <div>
                        <!-- Image -->
                        <div class="relative bg-gray-50 rounded-lg overflow-hidden aspect-[4/3] mb-3 border border-gray-100 cursor-pointer" onclick="toggleExpand('${item.firebaseKey}')">
                            <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${item.name}" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 bg-amber-500 text-slate-950 font-bold text-[9px] px-2 py-0.5 rounded shadow">In Stock</span>
                        </div>

                        <div class="flex items-center justify-between text-[10px] font-semibold text-gray-500 mb-1">
                            <span class="text-amber-600 font-bold">MY Food Store</span>
                            <button onclick="toggleExpand('${item.firebaseKey}')" class="text-blue-600 hover:underline flex items-center gap-1 font-bold">
                                <span id="btn-text-${item.firebaseKey}">More Info</span> <i class="fa-solid fa-chevron-down text-[8px]" id="icon-${item.firebaseKey}"></i>
                            </button>
                        </div>

                        <h3 class="font-bold text-sm text-gray-900 line-clamp-1 mb-1">${item.name}</h3>

                        <!-- Small Description Below Image -->
                        <p class="text-[11px] text-gray-600 font-light line-clamp-2 mb-2">${item.smallDesc || item.desc || 'No brief summary available.'}</p>

                        <!-- Expanded Big Description (Hidden by default) -->
                        <div id="expanded-desc-${item.firebaseKey}" class="hidden bg-amber-50/50 border border-amber-200/60 p-2.5 rounded-lg mb-3 text-[11px] text-gray-700 font-light leading-relaxed">
                            <strong class="block text-gray-900 font-semibold mb-0.5">Detailed Overview:</strong>
                            ${item.bigDesc || item.desc || 'No detailed specifications provided.'}
                        </div>
                    </div>

                    <!-- Price & Add to Cart Button -->
                    <div class="mt-2 pt-3 border-t border-gray-100 flex items-center justify-between">
                        <span class="font-black text-base text-gray-900">₹${typeof item.price === 'string' ? item.price.replace('₹', '') : item.price}</span>
                        <button onclick="window.addToCart('${item.firebaseKey}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3.5 py-2 rounded-lg transition shadow flex items-center gap-1.5">
                            <i class="fa-solid fa-cart-plus text-xs"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        };

        window.toggleExpand = function(key) {
            const descEl = document.getElementById(`expanded-desc-${key}`);
            const btnText = document.getElementById(`btn-text-${key}`);
            const icon = document.getElementById(`icon-${key}`);
            
            if (descEl.classList.contains('hidden')) {
                descEl.classList.remove('hidden');
                btnText.textContent = "Less Info";
                icon.className = "fa-solid fa-chevron-up text-[8px]";
            } else {
                descEl.classList.add('hidden');
                btnText.textContent = "More Info";
                icon.className = "fa-solid fa-chevron-down text-[8px]";
            }
        };

        window.filterProducts = function() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = liveInventory.filter(item => 
                item.name.toLowerCase().includes(query) || 
                (item.smallDesc && item.smallDesc.toLowerCase().includes(query)) ||
                (item.bigDesc && item.bigDesc.toLowerCase().includes(query))
            );
            renderStoreProducts(filtered);
        };

        window.addToCart = function(firebaseKey) {
            const product = liveInventory.find(p => p.firebaseKey === firebaseKey);
            if (!product) return;

            const existing = cart.find(item => item.firebaseKey === firebaseKey);
            if (existing) {
                existing.qty = (existing.qty || 1) + 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }

            localStorage.setItem("ymca_cart", JSON.stringify(cart));
            updateCartCount();
            alert(`${product.name} added to cart!`);
        };

        function updateCartCount() {
            const totalCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            document.getElementById('cart-count').textContent = totalCount;
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateCartCount();
        });
    </script>
</body>
</html>
