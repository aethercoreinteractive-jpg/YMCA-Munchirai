<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munchirai YMCA | Secondary Ad Manager (ad2)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen pb-12">

    <!-- Professional Fixed Header -->
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="bg-amber-500 text-slate-950 px-2 py-0.5 rounded text-xs font-black">AD2</span>
                <h1 class="text-xs sm:text-sm font-bold tracking-tight uppercase text-white">Secondary Ad Manager</h1>
            </div>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition border border-slate-700 flex items-center gap-1.5">
                <i class="fa-solid fa-store text-amber-400"></i> Back to Store
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">
        
        <!-- Safe Isolation Notice -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex items-center gap-3 text-xs text-slate-400">
            <i class="fa-solid fa-shield-halved text-amber-400 text-base"></i>
            <div>
                <strong class="text-white">Isolated Database Node:</strong> This manager uses the dedicated Firebase key <code class="text-amber-400 bg-slate-950 px-1.5 py-0.5 rounded">ads2</code>. It will never touch or disturb your primary ads, inventory, or categories.
            </div>
        </div>

        <!-- Add New Ad Form Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
            <h2 class="text-xs font-black uppercase tracking-wider text-amber-400 flex items-center gap-2 border-b border-slate-800 pb-2">
                <i class="fa-solid fa-circle-plus"></i> Add New Secondary Ad Media
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Media Type Selection -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1">Media Type</label>
                    <select id="ad-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                        <option value="image">Image (JPG, PNG, WebP)</option>
                        <option value="video">Video (MP4 / Google Drive Link)</option>
                    </select>
                </div>

                <!-- Media Link / URL -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1">Media Link / URL</label>
                    <input type="url" id="ad-link" placeholder="Paste direct image or video URL..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div class="flex justify-end pt-2">
                <button onclick="window.saveNewAd()" class="bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition shadow-md flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-plus"></i> Add to Secondary Ads
                </button>
            </div>
        </div>

        <!-- Active Secondary Ads List -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
            <h2 class="text-xs font-black uppercase tracking-wider text-amber-400 flex items-center gap-2 border-b border-slate-800 pb-2">
                <i class="fa-solid fa-list-check"></i> Active Secondary Ads (<span id="ad-count">0</span>)
            </h2>

            <div id="ads-list-container" class="space-y-3">
                <div class="text-center py-8 text-slate-500 text-xs">Loading secondary ads...</div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK Imports & Management Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // STRICT ISOLATION: Using 'ads2' node exclusively so it never touches 'ads' or inventory
        const ads2Ref = ref(db, 'ads2');
        let secondaryAdsCache = [];

        onValue(ads2Ref, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                secondaryAdsCache = Object.keys(data).map(key => ({
                    firebaseKey: key,
                    ...data[key]
                }));
            } else {
                secondaryAdsCache = [];
            }
            renderAdsManagerList();
        });

        window.saveNewAd = function() {
            const type = document.getElementById('ad-type').value;
            const link = document.getElementById('ad-link').value.trim();

            if (!link) {
                alert('Please provide a valid link for the ad.');
                return;
            }

            const newAdRef = push(ads2Ref);
            set(newAdRef, {
                type: type,
                link: link,
                createdAt: Date.now()
            }).then(() => {
                document.getElementById('ad-link').value = '';
            }).catch(error => {
                alert('Failed to save ad: ' + error.message);
            });
        };

        window.deleteAd = function(firebaseKey) {
            if (confirm('Are you sure you want to delete this secondary ad?')) {
                remove(ref(db, `ads2/${firebaseKey}`)).catch(error => {
                    alert('Failed to delete: ' + error.message);
                });
            }
        };

        function renderAdsManagerList() {
            const container = document.getElementById('ads-list-container');
            const countSpan = document.getElementById('ad-count');
            
            countSpan.textContent = secondaryAdsCache.length;

            if (secondaryAdsCache.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">No secondary ads found. Add one above.</div>`;
                return;
            }

            let html = '';
            secondaryAdsCache.forEach((ad, idx) => {
                html += `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-12 h-12 bg-slate-900 rounded-lg border border-slate-800 flex items-center justify-center shrink-0 overflow-hidden">
                                ${ad.type === 'video' ? '<i class="fa-solid fa-video text-amber-400 text-sm"></i>' : `<img src="${ad.link}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=200'">`}
                            </div>
                            <div class="overflow-hidden">
                                <span class="bg-slate-800 text-slate-300 text-[9px] font-bold px-1.5 py-0.5 rounded uppercase">${ad.type}</span>
                                <p class="text-slate-300 text-xs truncate mt-1 max-w-xs sm:max-w-md">${ad.link}</p>
                            </div>
                        </div>
                        <button onclick="window.deleteAd('${ad.firebaseKey}')" class="bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 p-2 rounded-lg transition border border-rose-900/50 shrink-0 text-xs">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
