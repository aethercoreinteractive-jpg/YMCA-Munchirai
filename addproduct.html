<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Product Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#090d16',
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- ENTERPRISE NAVIGATION HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
            <!-- Brand Mark -->
            <div class="flex items-center gap-3 shrink-0">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 font-black flex items-center justify-center text-xs tracking-tighter shadow-md">MY</div>
                <div>
                    <h1 class="text-xs font-extrabold text-white tracking-tight">MUNCHIRAI YMCA</h1>
                    <span id="form-header-badge" class="text-[10px] text-amber-400 font-mono tracking-wider block">PRODUCT_REGISTRY</span>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="flex items-center gap-2">
                <a href="admin.html" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 shadow-sm flex items-center gap-1.5 transition active:scale-95">
                    <i class="fa-solid fa-arrow-left text-amber-400"></i>
                    <span>Admin Hub</span>
                </a>
                <a href="productmanagement.html" class="w-9 h-9 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 border border-slate-700 transition flex items-center justify-center active:scale-95" title="Product Management">
                    <i class="fa-solid fa-database"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN FORM CONTAINER -->
    <main class="max-w-2xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-10 flex-grow">
        <section class="bg-white rounded-3xl p-5 sm:p-8 shadow-xl shadow-slate-200/50 border border-slate-200/80">
            <div class="border-b border-slate-100 pb-4 mb-6 flex items-center justify-between">
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200/60">Inventory Record</span>
                    <h2 id="form-title" class="text-lg sm:text-xl font-extrabold text-slate-900 mt-1.5">Add New Product</h2>
                </div>
                <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-sm font-bold border border-amber-200 shadow-sm">
                    <i id="form-icon" class="fa-solid fa-plus"></i>
                </div>
            </div>

            <div id="form-status-msg" class="hidden mb-5 p-3.5 rounded-xl text-xs font-medium text-center shadow-sm"></div>

            <form id="product-form" class="space-y-4">
                <!-- Product Name -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Product Name</label>
                    <input type="text" id="product-name" placeholder="e.g. YMCA Badminton Racket" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs sm:text-sm text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition shadow-sm">
                </div>

                <!-- Category & Price Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Category</label>
                        <select id="product-category" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs sm:text-sm text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition shadow-sm">
                            <option value="">Loading categories...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Price (₹)</label>
                        <input type="number" step="0.01" id="product-price" placeholder="e.g. 450" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs sm:text-sm text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition shadow-sm">
                    </div>
                </div>

                <!-- Quantity & Rating Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Stock Quantity</label>
                        <input type="number" id="product-qty" placeholder="e.g. 25" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs sm:text-sm text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition shadow-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Rating (1 - 5)</label>
                        <input type="number" step="0.1" min="1" max="5" id="product-rating" value="5.0" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs sm:text-sm text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition shadow-sm">
                    </div>
                </div>

                <!-- Google Drive Image Link -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Image Link (Google Drive / Direct URL)</label>
                    <input type="url" id="product-img" placeholder="Paste Google Drive image share link or image URL..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs sm:text-sm text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition shadow-sm">
                    <p class="text-[10px] text-slate-400 mt-1">Tip: Make sure your Google Drive link is set to "Anyone with the link can view".</p>
                </div>

                <!-- Image Preview Box -->
                <div class="pt-1">
                    <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Live Image Preview</span>
                    <div class="w-24 h-24 rounded-2xl border border-slate-200 bg-slate-50 flex items-center justify-center overflow-hidden shadow-sm relative">
                        <img id="img-preview" src="" alt="Preview" class="w-full h-full object-cover hidden">
                        <span id="img-placeholder" class="text-[10px] text-slate-400 text-center px-1">No image link yet</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit" id="submit-btn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3.5 rounded-2xl text-xs sm:text-sm transition shadow-lg active:scale-[0.98]">
                        Save Product to Inventory
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- ENTERPRISE FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 py-5 px-4 text-center text-[11px] text-slate-400">
        Munchirai YMCA Secure Portal &bull; Enterprise Operations Center
    </footer>

    <!-- Firebase Realtime Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const editKey = urlParams.get('edit');

        const formTitle = document.getElementById('form-title');
        const formIcon = document.getElementById('form-icon');
        const formHeaderBadge = document.getElementById('form-header-badge');
        const submitBtn = document.getElementById('submit-btn');
        const categorySelect = document.getElementById('product-category');
        const imgInput = document.getElementById('product-img');
        const imgPreview = document.getElementById('img-preview');
        const imgPlaceholder = document.getElementById('img-placeholder');

        // Handle Image Preview Conversion & Display
        imgInput.addEventListener('input', (e) => {
            const url = e.target.value.trim();
            updateImagePreview(url);
        });

        function updateImagePreview(url) {
            if (!url) {
                imgPreview.src = '';
                imgPreview.classList.add('hidden');
                imgPlaceholder.classList.remove('hidden');
                return;
            }

            let previewUrl = url;
            // Convert standard Google Drive view/share links to direct viewable links if applicable
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    previewUrl = `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
            }

            imgPreview.src = previewUrl;
            imgPreview.onload = () => {
                imgPreview.classList.remove('hidden');
                imgPlaceholder.classList.add('hidden');
            };
            imgPreview.onerror = () => {
                // fallback if direct thumbnail fails to load immediately
                imgPreview.classList.add('hidden');
                imgPlaceholder.classList.remove('hidden');
            };
        }

        // Load Categories into Dropdown
        function loadCategories(selectedCategory = '') {
            get(child(ref(db), 'categories')).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    let cats = Object.keys(data).map(k => data[k]);
                    cats.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

                    categorySelect.innerHTML = `<option value="">Select category...</option>` + cats.map(c => `
                        <option value="${c.name}" ${selectedCategory === c.name ? 'selected' : ''}>${c.name}</option>
                    `).join('');
                } else {
                    categorySelect.innerHTML = `<option value="">No categories found. Add one in Admin Hub.</option>`;
                }
            }).catch((err) => {
                categorySelect.innerHTML = `<option value="">Failed to load categories</option>`;
            });
        }

        // Check if Edit Mode
        if (editKey) {
            formTitle.textContent = "Edit Product";
            formHeaderBadge.textContent = "PRODUCT_EDIT_NODE";
            formIcon.className = "fa-solid fa-pen-to-square";
            submitBtn.textContent = "Update Product Record";

            get(child(ref(db), `inventory/${editKey}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    const item = snapshot.val();
                    document.getElementById('product-name').value = item.name || '';
                    document.getElementById('product-price').value = item.price || '';
                    document.getElementById('product-qty').value = item.qty || '';
                    document.getElementById('product-rating').value = item.rating || '5.0';
                    imgInput.value = item.img || '';
                    updateImagePreview(item.img || '');
                    loadCategories(item.category || '');
                } else {
                    showStatus("Product not found.", true);
                }
            });
        } else {
            loadCategories();
        }

        function showStatus(message, isError = false) {
            const msgEl = document.getElementById('form-status-msg');
            msgEl.textContent = message;
            msgEl.className = `mb-5 p-3.5 rounded-xl text-xs font-medium text-center shadow-sm ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            msgEl.classList.remove('hidden');
            setTimeout(() => { msgEl.classList.add('hidden'); }, 4000);
        }

        // Form Submit Handler
        document.getElementById('product-form').addEventListener('submit', (e) => {
            e.preventDefault();

            let rawImg = imgInput.value.trim();
            let finalImgUrl = rawImg;

            // Normalize Google Drive share links
            if (rawImg.includes('drive.google.com')) {
                const match = rawImg.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    finalImgUrl = `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
            }

            const productData = {
                name: document.getElementById('product-name').value.trim(),
                category: categorySelect.value,
                price: Number(document.getElementById('product-price').value),
                qty: Number(document.getElementById('product-qty').value),
                rating: Number(document.getElementById('product-rating').value),
                img: finalImgUrl,
                updatedAt: Date.now()
            };

            if (editKey) {
                set(ref(db, `inventory/${editKey}`), productData)
                    .then(() => {
                        showStatus("Product updated successfully!");
                        setTimeout(() => { window.location.href = 'productmanagement.html'; }, 1500);
                    })
                    .catch((err) => showStatus("Failed to update: " + err.message, true));
            } else {
                productData.order = 0; // default order index
                push(ref(db, 'inventory'), productData)
                    .then(() => {
                        showStatus("Product added successfully!");
                        document.getElementById('product-form').reset();
                        updateImagePreview('');
                        loadCategories();
                        setTimeout(() => { window.location.href = 'productmanagement.html'; }, 1500);
                    })
                    .catch((err) => showStatus("Failed to add product: " + err.message, true));
            }
        });
    </script>
</body>
</html>
