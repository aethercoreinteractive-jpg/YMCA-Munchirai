<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>News & Announcements | MY Food</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="bg-amber-500 text-slate-950 p-2 rounded-lg text-sm font-bold">
                    <i class="fa-solid fa-bullhorn"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-tight">MY Food</h1>
                    <p class="text-[10px] text-slate-400">Community News & Events</p>
                </div>
            </div>
            <nav class="flex items-center space-x-2">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5 border border-slate-700">
                    <i class="fa-solid fa-house text-[10px]"></i> Home
                </a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="mb-6 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold text-slate-900 tracking-tight">Latest Updates</h2>
                <p class="text-xs text-slate-500">Stay informed with the latest announcements from MY Food.</p>
            </div>
        </div>

        <div id="loading-box" class="text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl text-amber-500 mb-2"></i>
            <p class="text-slate-500 text-xs font-medium">Loading announcements...</p>
        </div>

        <div id="news-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 hidden"></div>
    </main>

    <!-- Fixed Live sync indicator dot -->
    <div class="fixed bottom-6 right-6 z-50 flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-full shadow-lg">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[10px] font-bold text-emerald-700 uppercase tracking-wide">Live</span>
    </div>

    <!-- Custom Inbuilt Modal for Professional Notifications/Prompts -->
    <div id="app-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 backdrop-blur-xs hidden">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xl max-w-sm w-full mx-4 p-5 text-center">
            <div id="modal-icon-container" class="w-10 h-10 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center mx-auto mb-3 text-base">
                <i id="modal-icon" class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="modal-title" class="font-bold text-slate-900 text-sm mb-1">Notification</h3>
            <p id="modal-message" class="text-slate-600 text-xs mb-4 leading-relaxed">Message goes here.</p>
            <div id="modal-actions" class="flex gap-2 justify-center">
                <button id="modal-btn-ok" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-2 px-4 rounded-xl transition w-full">OK</button>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t border-slate-200 text-slate-400 py-4 text-center text-[11px] mt-auto">
        &copy; 2026 MY Food. All Rights Reserved.
    </footer>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const newsRef = ref(db, 'news');

        // Custom Professional Modal System
        window.showAppModal = function(title, message, type = 'info', onConfirm = null) {
            const modal = document.getElementById('app-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalMessage = document.getElementById('modal-message');
            const modalIcon = document.getElementById('modal-icon');
            const modalIconContainer = document.getElementById('modal-icon-container');
            const modalActions = document.getElementById('modal-actions');

            modalTitle.textContent = title;
            modalMessage.textContent = message;

            if (type === 'success') {
                modalIconContainer.className = "w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-3 text-base";
                modalIcon.className = "fa-solid fa-circle-check";
            } else if (type === 'error') {
                modalIconContainer.className = "w-10 h-10 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mx-auto mb-3 text-base";
                modalIcon.className = "fa-solid fa-circle-exclamation";
            } else {
                modalIconContainer.className = "w-10 h-10 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center mx-auto mb-3 text-base";
                modalIcon.className = "fa-solid fa-triangle-exclamation";
            }

            modalActions.innerHTML = '';
            if (onConfirm) {
                modalActions.innerHTML = `
                    <button id="modal-btn-cancel" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 px-4 rounded-xl transition w-1/2">Cancel</button>
                    <button id="modal-btn-confirm" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold py-2 px-4 rounded-xl transition w-1/2">Confirm</button>
                `;
                document.getElementById('modal-btn-cancel').onclick = () => modal.classList.add('hidden');
                document.getElementById('modal-btn-confirm').onclick = () => {
                    modal.classList.add('hidden');
                    onConfirm();
                };
            } else {
                modalActions.innerHTML = `<button id="modal-btn-ok" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-2 px-4 rounded-xl transition w-full">OK</button>`;
                document.getElementById('modal-btn-ok').onclick = () => modal.classList.add('hidden');
            }

            modal.classList.remove('hidden');
        };

        function formatImageURL(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
                let idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (idMatch && idMatch[1]) {
                    return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
                }
            }
            return url;
        }

        function displayFriendlyDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
                if (!isNaN(dateObj)) {
                    return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                }
            }
            return dateStr;
        }

        // Real-time listener using Firebase SDK onValue
        function initRealtimeNews() {
            onValue(newsRef, (snapshot) => {
                const data = snapshot.val();
                handleDatabaseUpdate(data);
            }, (error) => {
                document.getElementById('loading-box').innerHTML = `<p class="text-rose-500 text-xs font-medium">Failed to load news feed. Please check your connection.</p>`;
            });
        }

        function handleDatabaseUpdate(data) {
            const loadingBox = document.getElementById('loading-box');
            const newsGrid = document.getElementById('news-grid');
            
            loadingBox.style.display = 'none';
            newsGrid.classList.remove('hidden');
            newsGrid.innerHTML = '';

            if (data && typeof data === 'object') {
                let records = data.data || data;
                const keys = Object.keys(records).filter(k => records[k] !== null);

                if (keys.length > 0) {
                    keys.reverse().forEach(id => {
                        const item = records[id];
                        if (!item) return;

                        const processedImg = formatImageURL(item.image);
                        const friendlyDate = displayFriendlyDate(item.date);
                        
                        let actionButtonHTML = '';
                        if (item.showButton && item.btnText && item.btnLink) {
                            actionButtonHTML = `
                                <div class="mt-4 pt-3 border-t border-slate-100">
                                    <a href="${item.btnLink}" target="_blank" class="w-full inline-flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold py-2 px-4 rounded-xl shadow-xs transition">
                                        ${item.btnText} <i class="fa-solid fa-arrow-right text-[10px]"></i>
                                    </a>
                                </div>
                            `;
                        }

                        const card = document.createElement('div');
                        card.className = "bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden flex flex-col justify-between relative group";
                        card.innerHTML = `
                            <div>
                                <div class="h-44 bg-slate-100 relative">
                                    <img src="${processedImg}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/600x400?text=MY+Food'">
                                    <span class="absolute top-2.5 right-2.5 bg-slate-900/75 backdrop-blur-xs text-white text-[10px] font-semibold px-2.5 py-1 rounded-md">${item.category}</span>
                                    <button onclick="window.editPost('${id}', window.currentNewsRecords)" class="absolute top-2.5 left-2.5 bg-white/90 hover:bg-white text-slate-800 text-xs w-7 h-7 rounded-lg shadow-sm flex items-center justify-center transition" title="Edit Post">
                                        <i class="fa-solid fa-pen text-[10px]"></i>
                                    </button>
                                </div>
                                <div class="p-4">
                                    <p class="text-[11px] text-slate-400 font-medium mb-1.5"><i class="fa-regular fa-calendar mr-1"></i>${friendlyDate}</p>
                                    <h3 class="font-bold text-slate-900 text-base mb-2 leading-snug">${item.title}</h3>
                                    <p class="text-slate-600 text-xs leading-relaxed whitespace-pre-line">${item.description}</p>
                                    ${actionButtonHTML}
                                </div>
                            </div>
                        `;
                        newsGrid.appendChild(card);
                    });
                } else {
                    newsGrid.innerHTML = `<div class="col-span-full text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300"><p class="text-slate-400 text-xs">No news announcements available right now. Please check back later.</p></div>`;
                }
            } else {
                newsGrid.innerHTML = `<div class="col-span-full text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300"><p class="text-slate-400 text-xs">No news announcements available right now. Please check back later.</p></div>`;
            }
        }

        // Store reference to records globally for editing
        window.currentNewsRecords = null;
        const originalOnValue = onValue;
        onValue(newsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.currentNewsRecords = data.data || data;
            }
            handleDatabaseUpdate(data);
        }, (error) => {
            document.getElementById('loading-box').innerHTML = `<p class="text-rose-500 text-xs font-medium">Failed to load news feed. Please check your connection.</p>`;
        });

        // Professional Edit Post Handler
        window.editPost = function(id, records) {
            if (!records || !records[id]) {
                window.showAppModal("Error", "Post details could not be retrieved.", "error");
                return;
            }
            const item = records[id];

            // Create inline professional editor form container if not present, or populate it
            let editModalHtml = `
                <div id="edit-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 backdrop-blur-xs p-4">
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                            <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-amber-500"></i> Edit Announcement</h3>
                            <button onclick="document.getElementById('edit-modal').remove()" class="text-slate-400 hover:text-slate-600 text-xs"><i class="fa-solid fa-xmark text-base"></i></button>
                        </div>
                        <form id="edit-post-form" class="space-y-3 text-left">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wide mb-1">Title</label>
                                <input type="text" id="edit-title" value="${item.title || ''}" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-amber-500" required>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wide mb-1">Category</label>
                                    <input type="text" id="edit-category" value="${item.category || ''}" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-amber-500" required>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wide mb-1">Date</label>
                                    <input type="date" id="edit-date" value="${item.date || ''}" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-amber-500" required>
                                </div>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wide mb-1">Image URL / Drive Link</label>
                                <input type="text" id="edit-image" value="${item.image || ''}" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-amber-500" required>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wide mb-1">Description</label>
                                <textarea id="edit-description" rows="4" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-amber-500" required>${item.description || ''}</textarea>
                            </div>
                            <div class="pt-2 flex gap-2">
                                <button type="button" onclick="document.getElementById('edit-modal').remove()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2.5 px-4 rounded-xl transition">Cancel</button>
                                <button type="submit" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold py-2.5 px-4 rounded-xl transition">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            // Remove any existing edit modal
            const existingModal = document.getElementById('edit-modal');
            if (existingModal) existingModal.remove();

            document.body.insertAdjacentHTML('beforeend', editModalHtml);

            document.getElementById('edit-post-form').onsubmit = async function(e) {
                e.preventDefault();
                const updatedTitle = document.getElementById('edit-title').value;
                const updatedCategory = document.getElementById('edit-category').value;
                const updatedDate = document.getElementById('edit-date').value;
                const updatedImage = document.getElementById('edit-image').value;
                const updatedDesc = document.getElementById('edit-description').value;

                try {
                    const targetPath = data.data ? 'news/data/' + id : 'news/' + id;
                    await update(ref(db, targetPath), {
                        title: updatedTitle,
                        category: updatedCategory,
                        date: updatedDate,
                        image: updatedImage,
                        description: updatedDesc
                    });
                    document.getElementById('edit-modal').remove();
                    window.showAppModal("Success", "Announcement updated successfully.", "success");
                } catch (err) {
                    window.showAppModal("Error", "Failed to update announcement. Please check your connection.", "error");
                }
            };
        };

        initRealtimeNews();
    </script>
</body>
</html>
