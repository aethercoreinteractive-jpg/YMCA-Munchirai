<!-- Firebase Reader Module with Error Debugging -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
      authDomain: "munchirai-ymca.firebaseapp.com",
      databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
      projectId: "munchirai-ymca",
      storageBucket: "munchirai-ymca.firebasestorage.app",
      messagingSenderId: "697387132253",
      appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
      measurementId: "G-XRRT0Q76YK"
    };

    const db = getDatabase(initializeApp(firebaseConfig));

    async function loadPublicNews() {
        const grid = document.getElementById('public-news-grid');
        const loading = document.getElementById('public-loading');

        try {
            console.log("Attempting to fetch from Firebase...");
            const snapshot = await get(ref(db, 'news'));

            loading.style.display = 'none';
            grid.classList.remove('hidden');
            grid.innerHTML = '';

            if (snapshot.exists()) {
                const data = snapshot.val();
                console.log("Data fetched successfully:", data);
                
                Object.values(data).reverse().forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="h-48 bg-gray-100 relative">
                                <img src="${item.image}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/600x400?text=Image+Unavailable'">
                                <span class="absolute top-3 right-3 bg-blue-900 text-white text-[10px] font-semibold px-2.5 py-1 rounded-full shadow">${item.category}</span>
                            </div>
                            <div class="p-5">
                                <p class="text-xs text-gray-500 mb-2"><i class="fa-solid fa-calendar-days text-blue-800 mr-1"></i> ${item.date}</p>
                                <h3 class="font-bold text-gray-900 text-lg mb-2 leading-snug">${item.title}</h3>
                                <p class="text-gray-600 text-sm whitespace-pre-line leading-relaxed">${item.description}</p>
                            </div>
                        </div>
                        ${item.showButton && item.btnLink ? `
                            <div class="p-5 pt-0">
                                <a href="${item.btnLink}" target="_blank" class="w-full block text-center bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2.5 rounded-lg transition shadow-sm">
                                    ${item.btnText || 'Learn More'} <i class="fa-solid fa-arrow-right ml-1"></i>
                                </a>
                            </div>
                        ` : ''}
                    `;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-16 bg-white rounded-xl border border-dashed">No announcements posted yet in database.</p>`;
            }
        } catch (err) {
            console.error("Firebase fetch error:", err);
            loading.innerHTML = `
                <div class="bg-red-50 border border-red-200 text-red-700 p-5 rounded-xl text-left max-w-lg mx-auto shadow-sm">
                    <p class="font-bold text-base mb-1"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Firebase Error Occurred</p>
                    <p class="text-xs font-mono bg-red-100 p-2 rounded mb-3">${err.message}</p>
                    <p class="text-xs">👉 <strong>Fix:</strong> Go to your Firebase Console -> Realtime Database -> Rules tab, and set <code class="bg-red-100 px-1 py-0.5 rounded">".read": true</code>.</p>
                </div>`;
        }
    }

    loadPublicNews();
</script>
