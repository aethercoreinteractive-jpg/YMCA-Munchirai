<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Admin Categories Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#090d16',
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .draggable-item { cursor: grab; user-select: none; }
        .draggable-item:active { cursor: grabbing; }
        .grip-handle { touch-action: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- ENTERPRISE NAVIGATION HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-3">
            <!-- Brand Mark -->
            <div class="flex items-center gap-2.5 shrink-0">
                <div class="w-8 h-8 rounded-lg bg-amber-500 text-slate-950 font-black flex items-center justify-center text-xs tracking-tighter shadow-md">MY</div>
                <div>
                    <h1 class="text-xs font-bold text-white tracking-tight">MUNCHIRAI</h1>
                    <span class="text-[9px] text-amber-400 font-mono block">ADMIN_NODE</span>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="flex items-center gap-2">
                <a href="add-product.html" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 shadow-sm flex items-center gap-1.5 transition hover:bg-amber-400">
                    <i class="fa-solid fa-plus text-[10px]"></i> Add Product
                </a>
                <a href="mystore.html" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 shadow-sm flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-store text-[10px] text-amber-400"></i> MY Store
                </a>
                <a href="index.html" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 border border-slate-700 transition" title="Home">
                    <i class="fa-solid fa-house text-[10px]"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="max-w-4xl mx-auto w-full px-3 sm:px-6 py-6 sm:py-10 flex-grow grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Categories Manager Section -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-xl border border-slate-200 h-fit">
            <div class="border-b border-slate-100 pb-3 mb-4">
                <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded border border-amber-200">Taxonomy</span>
                <h2 class="text-base font-bold text-slate-900 mt-1">Categories Manager</h2>
            </div>

            <div id="category-status-msg" class="hidden mb-3 p-2 rounded-xl text-xs font-medium text-center"></div>

            <form id="add-category-form" class="flex gap-2 mb-4">
                <input type="text" id="new-category-name" placeholder="New category name..." required class="flex-grow bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition">
                <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition shadow-sm shrink-0">
                    Add
                </button>
            </form>

            <div id="categories-list" class="flex flex-wrap gap-2 max-h-60 overflow-y-auto no-scrollbar">
                <span class="text-xs text-slate-400">Loading categories...</span>
            </div>
        </section>

        <!-- Category Sorting Manager Section (Touch & Drag via Grip) -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-xl border border-slate-200 h-fit">
            <div class="border-b border-slate-100 pb-3 mb-4">
                <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded border border-amber-200">Layout Control</span>
                <h2 class="text-base font-bold text-slate-900 mt-1">Category Order & Sorting</h2>
                <p class="text-[11px] text-slate-500 mt-0.5">Use the grip handle to drag items up or down.</p>
            </div>

            <div id="category-sort-list" class="space-y-2 max-h-60 overflow-y-auto no-scrollbar">
                <span class="text-xs text-slate-400">No categories to sort.</span>
            </div>
        </section>

    </main>

    <!-- ENTERPRISE FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-4 text-center text-[10px] text-slate-400">
        Munchirai YMCA Secure Portal &bull; Enterprise Operations Center
    </footer>

    <!-- Firebase Realtime Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let categoriesCache = [];
        let draggedCategoryKey = null;

        function showCategoryStatus(message, isError = false) {
            const msgEl = document.getElementById('category-status-msg');
            if (!msgEl) return;
            msgEl.textContent = message;
            msgEl.className = `mb-3 p-2 rounded-xl text-xs font-medium text-center ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            msgEl.classList.remove('hidden');
            setTimeout(() => { msgEl.classList.add('hidden'); }, 4000);
        }

        // Categories Management Engine
        document.getElementById('add-category-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputEl = document.getElementById('new-category-name');
            const catName = inputEl.value.trim();
            if (!catName) return;

            if (categoriesCache.some(c => c.name.toLowerCase() === catName.toLowerCase())) {
                showCategoryStatus(`Category "${catName}" already exists!`, true);
                return;
            }

            const newOrder = categoriesCache.length;
            push(ref(db, 'categories'), { name: catName, order: newOrder })
                .then(() => {
                    showCategoryStatus(`Category "${catName}" added successfully!`);
                    inputEl.value = '';
                })
                .catch((err) => showCategoryStatus("Failed to add category: " + err.message, true));
        });

        window.deleteCategory = function(key, name) {
            remove(ref(db, `categories/${key}`))
                .then(() => showCategoryStatus(`Category "${name}" removed.`))
                .catch((err) => showCategoryStatus("Failed to remove: " + err.message, true));
        };

        // Drag and Drop Handlers for Categories Sorting
        window.handleCategoryDragStart = function(e, key) {
            draggedCategoryKey = key;
            e.dataTransfer.effectAllowed = 'move';
            e.currentTarget.classList.add('opacity-40');
        };

        window.handleCategoryDragOver = function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        };

        window.handleCategoryDrop = function(e, targetKey) {
            e.preventDefault();
            if (!draggedCategoryKey || draggedCategoryKey === targetKey) return;

            const fromIdx = categoriesCache.findIndex(c => c.key === draggedCategoryKey);
            const toIdx = categoriesCache.findIndex(c => c.key === targetKey);

            if (fromIdx === -1 || toIdx === -1) return;

            const movedItem = categoriesCache.splice(fromIdx, 1)[0];
            categoriesCache.splice(toIdx, 0, movedItem);

            categoriesCache.forEach((cat, idx) => {
                cat.order = idx;
            });

            saveCategoryOrder();
        };

        window.handleCategoryDragEnd = function(e) {
            e.currentTarget.classList.remove('opacity-40');
            draggedCategoryKey = null;
        };

        let touchCategoryKey = null;
        window.handleCategoryTouchStart = function(e, key) {
            touchCategoryKey = key;
        };

        window.handleCategoryTouchMove = function(e) {
            if (!touchCategoryKey) return;
            e.preventDefault();
            const touch = e.touches[0];
            const elem = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetCard = elem ? elem.closest('.cat-draggable-item') : null;

            if (targetCard && targetCard.dataset.key && targetCard.dataset.key !== touchCategoryKey) {
                const fromIdx = categoriesCache.findIndex(c => c.key === touchCategoryKey);
                const toIdx = categoriesCache.findIndex(c => c.key === targetCard.dataset.key);

                if (fromIdx !== -1 && toIdx !== -1) {
                    const movedItem = categoriesCache.splice(fromIdx, 1)[0];
                    categoriesCache.splice(toIdx, 0, movedItem);
                    categoriesCache.forEach((cat, idx) => { cat.order = idx; });
                    renderCategorySortList();
                }
            }
        };

        window.handleCategoryTouchEnd = function(e) {
            if (touchCategoryKey) {
                touchCategoryKey = null;
                saveCategoryOrder();
            }
        };

        function saveCategoryOrder() {
            const updates = {};
            categoriesCache.forEach(cat => {
                updates[`categories/${cat.key}/order`] = cat.order;
            });

            update(ref(db), updates)
                .then(() => renderCategorySortList())
                .catch(err => alert("Failed to save category reorder: " + err.message));
        }

        function renderCategorySortList() {
            const sortContainer = document.getElementById('category-sort-list');
            if (categoriesCache.length === 0) {
                sortContainer.innerHTML = `<span class="text-xs text-slate-400">No categories available to sort.</span>`;
                return;
            }

            sortContainer.innerHTML = categoriesCache.map((cat, idx) => `
                <div draggable="true" 
                     data-key="${cat.key}"
                     ondragstart="window.handleCategoryDragStart(event, '${cat.key}')" 
                     ondragover="window.handleCategoryDragOver(event)" 
                     ondrop="window.handleCategoryDrop(event, '${cat.key}')" 
                     ondragend="window.handleCategoryDragEnd(event)"
                     class="cat-draggable-item draggable-item flex items-center justify-between bg-slate-50 border border-slate-200 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-800 transition active:scale-[0.98]">
                    <div class="flex items-center gap-2.5">
                        <i class="fa-solid fa-grip-vertical text-slate-400 text-xs grip-handle cursor-grab p-1"
                           ontouchstart="window.handleCategoryTouchStart(event, '${cat.key}')"
                           ontouchmove="window.handleCategoryTouchMove(event)"
                           ontouchend="window.handleCategoryTouchEnd(event)"
                           title="Tap and hold to drag"></i>
                        <span>${cat.name}</span>
                    </div>
                    <span class="text-[10px] text-slate-400 font-mono pointer-events-none">#${idx + 1}</span>
                </div>
            `).join('');
        }

        const categoriesRef = ref(db, 'categories');
        onValue(categoriesRef, (snapshot) => {
            const data = snapshot.val();
            const listContainer = document.getElementById('categories-list');

            if (!data) {
                categoriesCache = [];
                listContainer.innerHTML = `<span class="text-xs text-slate-400">No categories added yet. Add one above.</span>`;
                renderCategorySortList();
                return;
            }

            categoriesCache = Object.keys(data).map(key => ({ key, ...data[key] }));
            categoriesCache.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

            listContainer.innerHTML = categoriesCache.map(cat => `
                <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-800">
                    <span>${cat.name}</span>
                    <button type="button" onclick="window.deleteCategory('${cat.key}', '${cat.name}')" class="text-slate-400 hover:text-red-600 transition ml-1" title="Remove Category">
                        <i class="fa-solid fa-xmark text-[11px]"></i>
                    </button>
                </div>
            `).join('');

            renderCategorySortList();
        });
    </script>
</body>
</html>
