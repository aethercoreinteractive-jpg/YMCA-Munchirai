<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Admin Inventory Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151c2c',
                            900: '#0f172a',
                            950: '#090d16',
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- ENTERPRISE NAVIGATION HEADER -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-3">
            <!-- Brand Mark -->
            <div class="flex items-center gap-2.5 shrink-0">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 font-black flex items-center justify-center text-xs tracking-tighter shadow-md">MY</div>
                <div>
                    <h1 class="text-xs font-bold text-white tracking-tight">YMCA Munchirai</h1>
                    <span class="text-[9px] text-amber-400 font-mono block">INVENTORY_NODE</span>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="flex items-center gap-2">
                <a href="mystore.html" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 shadow-sm flex items-center gap-1.5 transition hover:bg-amber-400">
                    <i class="fa-solid fa-store text-[10px]"></i> View Storefront
                </a>
                <a href="index.html" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 border border-slate-800 transition" title="Home">
                    <i class="fa-solid fa-house text-[10px]"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="max-w-7xl mx-auto w-full px-3 sm:px-6 py-6 sm:py-10 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Add New Product Form Section -->
        <section class="lg:col-span-1 glass-card rounded-2xl p-5 sm:p-6 shadow-xl border border-slate-800 h-fit">
            <div class="border-b border-slate-800 pb-3 mb-5">
                <span class="text-[10px] font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 px-2.5 py-0.5 rounded border border-amber-500/20">Database Entry</span>
                <h2 class="text-base font-bold text-white mt-1">Add Product to Inventory</h2>
            </div>

            <form id="add-product-form" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1.5">Product Title</label>
                    <input type="text" id="prod-name" placeholder="e.g. Pure Wild Honey 500g" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1.5">Price (₹)</label>
                    <input type="number" id="prod-price" placeholder="e.g. 350" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1.5">Image Link (Google Drive / Direct URL)</label>
                    <input type="text" id="prod-img" placeholder="Paste image or Google Drive link..." required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1.5">Small Description (1-line summary)</label>
                    <input type="text" id="prod-small-desc" placeholder="Brief summary..." required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1.5">Big Description (Detailed overview)</label>
                    <textarea id="prod-big-desc" rows="3" placeholder="Full detailed overview, origin, ingredients..." required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition resize-none"></textarea>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Upload to Firebase Database</span>
                </button>
            </form>
        </section>

        <!-- Current Inventory Real-Time List -->
        <section class="lg:col-span-2 glass-card rounded-2xl p-5 sm:p-6 shadow-xl border border-slate-800">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-5">
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 px-2.5 py-0.5 rounded border border-amber-500/20">Live Management</span>
                    <h2 class="text-base font-bold text-white mt-1">Current Inventory List</h2>
                </div>
                <span id="item-count" class="text-xs bg-slate-900 font-bold text-amber-400 border border-slate-800 px-2.5 py-1 rounded-lg">0 Products</span>
            </div>

            <div id="admin-inventory-list" class="space-y-3">
                <div class="text-center py-12 text-xs text-slate-500">Connecting to Firebase Realtime Database...</div>
            </div>
        </section>
    </main>

    <!-- ENTERPRISE FOOTER -->
    <footer class="bg-slate-900/50 border-t border-slate-900 py-4 px-4 text-center text-[10px] text-slate-500">
        Munchirai YMCA Secure Portal &bull; Enterprise Operations Center
    </footer>

    <!-- Firebase Realtime Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function formatImageUrl(url) {
            if (url.includes("drive.google.com")) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
            }
            return url;
        }

        document.getElementById('add-product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`;

            const rawImg = document.getElementById('prod-img').value.trim();
            const formattedImg = formatImageUrl(rawImg);

            const newProduct = {
                name: document.getElementById('prod-name').value.trim(),
                price: document.getElementById('prod-price').value.trim(),
                img: formattedImg,
                smallDesc: document.getElementById('prod-small-desc').value.trim(),
                bigDesc: document.getElementById('prod-big-desc').value.trim(),
                createdAt: Date.now()
            };

            push(ref(db, 'inventory'), newProduct)
                .then(() => {
                    alert("Product added successfully to Firebase Database!");
                    document.getElementById('add-product-form').reset();
                })
                .catch((err) => {
                    alert("Error saving product: " + err.message);
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span>Upload to Firebase Database</span>`;
                });
        });

        const inventoryRef = ref(db, 'inventory');
        onValue(inventoryRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('admin-inventory-list');
            const countBadge = document.getElementById('item-count');

            if (!data) {
                container.innerHTML = `<p class="text-center py-10 text-xs text-slate-500">No products currently in inventory database.</p>`;
                countBadge.textContent = "0 Products";
                return;
            }

            const items = Object.keys(data).map(key => ({
                key: key,
                ...data[key]
            }));

            countBadge.textContent = `${items.length} Product${items.length > 1 ? 's' : ''}`;

            container.innerHTML = items.map(item => `
                <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-xl p-3 hover:border-amber-500/50 transition">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${item.name}" class="w-12 h-12 object-cover rounded-lg border border-slate-800 shrink-0">
                        <div class="truncate">
                            <h4 class="font-bold text-xs text-white truncate">${item.name}</h4>
                            <p class="text-[11px] text-slate-400">₹${item.price} &bull; ${item.smallDesc || 'No summary'}</p>
                        </div>
                    </div>
                    <button onclick="window.deleteProduct('${item.key}')" class="text-red-400 hover:text-red-300 bg-red-950/40 hover:bg-red-900/50 border border-red-900/30 p-2 rounded-lg transition shrink-0 ml-2">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                </div>
            `).join('');
        });

        window.deleteProduct = function(key) {
            if (confirm("Are you sure you want to delete this product from inventory?")) {
                remove(ref(db, `inventory/${key}`))
                    .then(() => alert("Product removed."))
                    .catch((err) => alert("Failed to delete: " + err.message));
            }
        };
    </script>
</body>
</html>
