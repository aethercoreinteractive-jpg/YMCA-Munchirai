<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Admin Inventory Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#090d16',
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- ENTERPRISE NAVIGATION HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-3">
            <!-- Brand Mark -->
            <div class="flex items-center gap-2.5 shrink-0">
                <div class="w-8 h-8 rounded-lg bg-amber-500 text-slate-950 font-black flex items-center justify-center text-xs tracking-tighter shadow-md">MY</div>
                <div>
                    <h1 class="text-xs font-bold text-white tracking-tight">MUNCHIRAI</h1>
                    <span class="text-[9px] text-amber-400 font-mono block">INVENTORY_NODE</span>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="flex items-center gap-2">
                <a href="mystore.html" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 shadow-sm flex items-center gap-1.5 transition hover:bg-amber-400">
                    <i class="fa-solid fa-store text-[10px]"></i> MY Store
                </a>
                <a href="index.html" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 border border-slate-700 transition" title="Home">
                    <i class="fa-solid fa-house text-[10px]"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="max-w-7xl mx-auto w-full px-3 sm:px-6 py-6 sm:py-10 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column: Categories Manager + Product Form -->
        <div class="space-y-6">
            <!-- Categories Manager Section -->
            <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-xl border border-slate-200">
                <div class="border-b border-slate-100 pb-3 mb-4">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded border border-amber-200">Taxonomy</span>
                    <h2 class="text-base font-bold text-slate-900 mt-1">Categories Manager</h2>
                </div>

                <div id="category-status-msg" class="hidden mb-3 p-2 rounded-xl text-xs font-medium text-center"></div>

                <form id="add-category-form" class="flex gap-2 mb-4">
                    <input type="text" id="new-category-name" placeholder="New category name..." required class="flex-grow bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition">
                    <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition shadow-sm shrink-0">
                        Add
                    </button>
                </form>

                <div id="categories-list" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto no-scrollbar">
                    <span class="text-xs text-slate-400">Loading categories...</span>
                </div>
            </section>

            <!-- Add / Edit Product Form Section -->
            <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-xl border border-slate-200 h-fit">
                <div class="border-b border-slate-100 pb-3 mb-5 flex items-center justify-between">
                    <div>
                        <span id="form-badge" class="text-[10px] font-bold uppercase tracking-widest text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded border border-amber-200">Database Entry</span>
                        <h2 id="form-title" class="text-base font-bold text-slate-900 mt-1">Add Product to Inventory</h2>
                    </div>
                    <button type="button" id="cancel-edit-top" onclick="cancelEdit()" class="text-[11px] text-slate-500 hover:text-amber-600 underline hidden font-medium">Cancel Edit</button>
                </div>

                <!-- Inline Notification Banner -->
                <div id="form-status-msg" class="hidden mb-4 p-2.5 rounded-xl text-xs font-medium text-center"></div>

                <form id="add-product-form" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Product Title</label>
                        <input type="text" id="prod-name" placeholder="e.g. Pure Wild Honey 500g" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Category</label>
                            <select id="prod-category" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition">
                                <option value="" disabled selected>Select category...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Price (₹)</label>
                            <input type="number" id="prod-price" placeholder="e.g. 350" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Quantity & Unit</label>
                            <input type="text" id="prod-qty" placeholder="e.g. 500g" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Rating (/5)</label>
                            <input type="number" id="prod-rating" step="0.1" min="0" max="5" placeholder="e.g. 4.5" value="5" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Image Link (Google Drive / Direct URL)</label>
                        <input type="text" id="prod-img" placeholder="Paste image or Google Drive link..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Small Description (1-line summary)</label>
                        <input type="text" id="prod-small-desc" placeholder="Brief summary..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Big Description (Detailed overview)</label>
                        <textarea id="prod-big-desc" rows="3" placeholder="Full detailed overview, origin, ingredients..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition resize-none"></textarea>
                    </div>

                    <div class="space-y-2 pt-2">
                        <button type="submit" id="submit-btn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span id="submit-btn-text">Save</span>
                        </button>
                        <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition hidden border border-slate-200">
                            Cancel Edit
                        </button>
                    </div>
                </form>
            </section>
        </div>

        <!-- Right Column: Current Inventory Real-Time List -->
        <section class="lg:col-span-2 bg-white rounded-2xl p-5 sm:p-6 shadow-xl border border-slate-200 h-fit">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-5">
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded border border-amber-200">Live Management</span>
                    <h2 class="text-base font-bold text-slate-900 mt-1">Current Inventory List</h2>
                </div>
                <span id="item-count" class="text-xs bg-slate-100 font-bold text-amber-700 border border-slate-200 px-2.5 py-1 rounded-lg">0 Products</span>
            </div>

            <div id="admin-inventory-list" class="space-y-3">
                <div class="text-center py-12 text-xs text-slate-400">Connecting to Firebase Realtime Database...</div>
            </div>
        </section>
    </main>

    <!-- ENTERPRISE FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-4 text-center text-[10px] text-slate-400">
        Munchirai YMCA Secure Portal &bull; Enterprise Operations Center
    </footer>

    <!-- Firebase Realtime Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let editingKey = null;
        let inventoryCache = {};
        let categoriesCache = [];

        function showStatusMessage(message, isError = false) {
            const msgEl = document.getElementById('form-status-msg');
            msgEl.textContent = message;
            msgEl.className = `mb-4 p-2.5 rounded-xl text-xs font-medium text-center ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            msgEl.classList.remove('hidden');
            setTimeout(() => { msgEl.classList.add('hidden'); }, 4000);
        }

        function showCategoryStatus(message, isError = false) {
            const msgEl = document.getElementById('category-status-msg');
            msgEl.textContent = message;
            msgEl.className = `mb-3 p-2 rounded-xl text-xs font-medium text-center ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            msgEl.classList.remove('hidden');
            setTimeout(() => { msgEl.classList.add('hidden'); }, 4000);
        }

        function formatImageUrl(url) {
            if (url.includes("drive.google.com")) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
            }
            return url;
        }

        // Categories Management Engine
        document.getElementById('add-category-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputEl = document.getElementById('new-category-name');
            const catName = inputEl.value.trim();
            if (!catName) return;

            push(ref(db, 'categories'), { name: catName })
                .then(() => {
                    showCategoryStatus(`Category "${catName}" added successfully!`);
                    inputEl.value = '';
                })
                .catch((err) => showCategoryStatus("Failed to add category: " + err.message, true));
        });

        window.deleteCategory = function(key, name) {
            if (confirm(`Remove category "${name}"?`)) {
                remove(ref(db, `categories/${key}`))
                    .then(() => showCategoryStatus(`Category "${name}" removed.`))
                    .catch((err) => showCategoryStatus("Failed to remove: " + err.message, true));
            }
        };

        const categoriesRef = ref(db, 'categories');
        onValue(categoriesRef, (snapshot) => {
            const data = snapshot.val();
            const listContainer = document.getElementById('categories-list');
            const selectEl = document.getElementById('prod-category');
            
            const currentSelected = selectEl.value;
            selectEl.innerHTML = `<option value="" disabled selected>Select category...</option>`;

            if (!data) {
                categoriesCache = [];
                listContainer.innerHTML = `<span class="text-xs text-slate-400">No categories added yet. Add one above.</span>`;
                return;
            }

            categoriesCache = Object.keys(data).map(key => ({ key, ...data[key] }));

            listContainer.innerHTML = categoriesCache.map(cat => `
                <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-800">
                    <span>${cat.name}</span>
                    <button type="button" onclick="window.deleteCategory('${cat.key}', '${cat.name}')" class="text-slate-400 hover:text-red-600 transition ml-1" title="Remove Category">
                        <i class="fa-solid fa-xmark text-[11px]"></i>
                    </button>
                </div>
            `).join('');

            categoriesCache.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name;
                opt.textContent = cat.name;
                selectEl.appendChild(opt);
            });

            if (currentSelected) {
                selectEl.value = currentSelected;
            }
        });

        // Product Form Handler
        document.getElementById('add-product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`;

            const rawImg = document.getElementById('prod-img').value.trim();
            const formattedImg = formatImageUrl(rawImg);

            const productData = {
                name: document.getElementById('prod-name').value.trim(),
                category: document.getElementById('prod-category').value,
                price: document.getElementById('prod-price').value.trim(),
                qty: document.getElementById('prod-qty').value.trim(),
                rating: document.getElementById('prod-rating').value.trim() || "5",
                img: formattedImg,
                smallDesc: document.getElementById('prod-small-desc').value.trim(),
                bigDesc: document.getElementById('prod-big-desc').value.trim(),
                updatedAt: Date.now()
            };

            if (editingKey) {
                update(ref(db, `inventory/${editingKey}`), productData)
                    .then(() => {
                        showStatusMessage("Product updated successfully!");
                        cancelEdit();
                    })
                    .catch((err) => showStatusMessage("Failed to update: " + err.message, true))
                    .finally(() => {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span id="submit-btn-text">Save</span>`;
                    });
            } else {
                productData.createdAt = Date.now();
                push(ref(db, 'inventory'), productData)
                    .then(() => {
                        showStatusMessage("Product added successfully!");
                        document.getElementById('add-product-form').reset();
                        document.getElementById('prod-rating').value = "5";
                    })
                    .catch((err) => showStatusMessage("Error saving product: " + err.message, true))
                    .finally(() => {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span id="submit-btn-text">Save</span>`;
                    });
            }
        });

        const inventoryRef = ref(db, 'inventory');
        onValue(inventoryRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('admin-inventory-list');
            const countBadge = document.getElementById('item-count');

            if (!data) {
                inventoryCache = {};
                container.innerHTML = `<p class="text-center py-12 text-xs text-slate-400">No products currently in inventory database.</p>`;
                countBadge.textContent = "0 Products";
                return;
            }

            inventoryCache = data;
            const items = Object.keys(data).map(key => ({
                key: key,
                ...data[key]
            }));

            countBadge.textContent = `${items.length} Product${items.length > 1 ? 's' : ''}`;

            container.innerHTML = items.map(item => `
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-slate-50 border border-slate-200 rounded-xl p-3.5 gap-3 hover:border-amber-500 transition shadow-sm">
                    <div class="flex items-center gap-3 overflow-hidden w-full sm:w-auto">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${item.name}" class="w-12 h-12 object-cover rounded-lg border border-slate-200 shrink-0">
                        <div class="truncate">
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-xs text-slate-900 truncate">${item.name}</h4>
                                <span class="text-[9px] bg-amber-100 text-amber-800 font-bold px-1.5 py-0.5 rounded shrink-0">${item.category || 'General'}</span>
                            </div>
                            <p class="text-[11px] text-slate-500 mt-0.5">₹${item.price} &bull; <i class="fa-solid fa-star text-amber-500 text-[10px]"></i> ${item.rating || '5'}/5</p>
                        </div>
                    </div>
                    
                    <div class="flex flex-wrap items-center justify-between sm:justify-end gap-2 w-full sm:w-auto border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-200">
                        <!-- Quick Quantity Update Section -->
                        <div class="flex items-center gap-1 bg-white border border-slate-200 rounded-lg px-2 py-1 shadow-inner">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Qty:</span>
                            <input type="text" id="qty-input-${item.key}" value="${item.qty || ''}" class="w-14 text-xs font-bold text-slate-900 bg-transparent focus:outline-none text-center">
                        </div>

                        <!-- Quick Rating Update Section -->
                        <div class="flex items-center gap-1 bg-white border border-slate-200 rounded-lg px-2 py-1 shadow-inner">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Rate:</span>
                            <input type="number" step="0.1" min="0" max="5" id="rating-input-${item.key}" value="${item.rating || '5'}" class="w-11 text-xs font-bold text-slate-900 bg-transparent focus:outline-none text-center">
                            <span class="text-[10px] text-slate-400">/5</span>
                            <button onclick="window.updateMetrics('${item.key}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-[10px] font-bold px-2 py-1 rounded transition ml-0.5" title="Save Changes">
                                Save
                            </button>
                        </div>

                        <div class="flex items-center gap-1 shrink-0">
                            <button onclick="window.startEdit('${item.key}')" class="text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 p-2 rounded-lg transition" title="Edit Full Product">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button onclick="window.deleteProduct('${item.key}')" class="text-red-500 hover:text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 p-2 rounded-lg transition" title="Delete Product">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        });

        window.updateMetrics = function(key) {
            const newQty = document.getElementById(`qty-input-${key}`).value.trim();
            const newRating = document.getElementById(`rating-input-${key}`).value.trim();
            
            update(ref(db, `inventory/${key}`), { qty: newQty, rating: newRating, updatedAt: Date.now() })
                .then(() => showStatusMessage("Quantity and rating updated successfully!"))
                .catch((err) => showStatusMessage("Failed to update: " + err.message, true));
        };

        window.startEdit = function(key) {
            const item = inventoryCache[key];
            if (!item) return;

            editingKey = key;
            document.getElementById('prod-name').value = item.name || '';
            document.getElementById('prod-category').value = item.category || '';
            document.getElementById('prod-price').value = item.price || '';
            document.getElementById('prod-qty').value = item.qty || '';
            document.getElementById('prod-rating').value = item.rating || '5';
            document.getElementById('prod-img').value = item.img || '';
            document.getElementById('prod-small-desc').value = item.smallDesc || '';
            document.getElementById('prod-big-desc').value = item.bigDesc || '';

            document.getElementById('form-title').textContent = "Edit Product Record";
            document.getElementById('form-badge').textContent = "Editing Mode";
            document.getElementById('submit-btn-text').textContent = "Save";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            document.getElementById('cancel-edit-top').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEdit = function() {
            editingKey = null;
            document.getElementById('add-product-form').reset();
            document.getElementById('prod-rating').value = "5";
            document.getElementById('form-title').textContent = "Add Product to Inventory";
            document.getElementById('form-badge').textContent = "Database Entry";
            document.getElementById('submit-btn-text').textContent = "Save";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            document.getElementById('cancel-edit-top').classList.add('hidden');
        };

        window.deleteProduct = function(key) {
            remove(ref(db, `inventory/${key}`))
                .then(() => {
                    if (editingKey === key) cancelEdit();
                    showStatusMessage("Product removed from inventory.");
                })
                .catch((err) => showStatusMessage("Failed to delete: " + err.message, true));
        };
    </script>
</body>
</html>
