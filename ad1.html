<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Manager - Munchirai YMCA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-50 rounded-2xl shadow-xl border border-slate-200 p-6 space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-lg font-bold text-slate-950 tracking-tight">Ad Manager & Preview</h1>
            <p class="text-xs text-slate-500 mt-0.5">Manage and preview rotation ads under label <span class="text-amber-600 font-mono font-bold">ad1</span></p>
        </div>

        <!-- Professional In-App Notification Message (No browser popups) -->
        <div id="status-msg" class="hidden p-3 rounded-xl text-xs font-semibold text-center transition-all duration-300"></div>

        <!-- Input Form Section -->
        <div class="space-y-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Google Drive Link (Image or Video)</label>
                <input type="url" id="ad-link-input" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition" placeholder="https://drive.google.com/file/d/...">
                <span class="text-[10px] text-slate-400 mt-1 block">Ensure link sharing is set to <strong class="text-slate-600">"Anyone with the link can view"</strong></span>
            </div>

            <!-- Save Button -->
            <button type="button" id="save-btn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition shadow-md active:scale-[0.98] flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Save Ad</span>
            </button>
        </div>

        <!-- Live Preview Screen Section -->
        <div class="space-y-2">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">Live Preview Rotation</span>
                <span id="slide-counter" class="text-[10px] font-mono text-amber-600 font-bold">0 / 0</span>
            </div>
            
            <div class="w-full aspect-[16/9] rounded-xl overflow-hidden bg-slate-950 relative shadow-inner border border-slate-200">
                <div id="slider-track" class="flex h-full w-full transition-transform duration-700 ease-in-out">
                    <div class="w-full h-full flex items-center justify-center shrink-0">
                        <span class="text-xs text-slate-400">Loading ads from Firebase...</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase Engine Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Exact Firebase reference for ad1 label
        const ad1Ref = ref(db, 'ad1');

        let adsArray = [];
        let currentIdx = 0;
        let slideTimer = null;

        const linkInput = document.getElementById('ad-link-input');
        const saveBtn = document.getElementById('save-btn');
        const sliderTrack = document.getElementById('slider-track');
        const slideCounter = document.getElementById('slide-counter');
        const statusMsg = document.getElementById('status-msg');

        function showMessage(text, isError = false) {
            statusMsg.textContent = text;
            statusMsg.className = `p-3 rounded-xl text-xs font-semibold text-center ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            statusMsg.classList.remove('hidden');
            setTimeout(() => statusMsg.classList.add('hidden'), 4000);
        }

        // Convert Google Drive link to direct media format
        function parseDriveLink(url) {
            if (!url) return { url: '', type: 'photo' };
            let fileId = '';
            
            if (url.includes('/d/')) {
                const parts = url.split('/d/');
                if (parts[1]) fileId = parts[1].split('/')[0];
            } else if (url.includes('id=')) {
                const params = new URLSearchParams(url.split('?')[1]);
                fileId = params.get('id');
            }

            let type = 'photo';
            const lower = url.toLowerCase();
            if (lower.includes('.mp4') || lower.includes('.webm') || lower.includes('.mov') || lower.includes('video') || lower.includes('preview')) {
                type = 'video';
            }

            if (fileId) {
                if (type === 'video') {
                    return { url: `https://drive.google.com/uc?export=download&id=${fileId}`, type: 'video' };
                } else {
                    return { url: `https://lh3.googleusercontent.com/d/${fileId}`, type: 'photo' };
                }
            }
            return { url: url, type: type };
        }

        function renderRotation() {
            if (adsArray.length === 0) {
                sliderTrack.innerHTML = `<div class="w-full h-full flex items-center justify-center shrink-0"><span class="text-xs text-slate-400">No ad items found under ad1.</span></div>`;
                slideCounter.textContent = "0 / 0";
                return;
            }

            if (currentIdx >= adsArray.length) currentIdx = 0;

            sliderTrack.innerHTML = adsArray.map(ad => {
                const rawLink = typeof ad === 'string' ? ad : (ad.link || '');
                const parsed = parseDriveLink(rawLink);
                
                if (parsed.type === 'video') {
                    return `<div class="w-full h-full shrink-0 relative bg-black"><video src="${parsed.url}" autoplay muted loop playsinline class="w-full h-full object-cover"></video></div>`;
                } else {
                    return `<div class="w-full h-full shrink-0 relative bg-black"><img src="${parsed.url}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400?text=Invalid+Image+Link'"></div>`;
                }
            }).join('');

            sliderTrack.style.transform = `translateX(-${currentIdx * 100}%)`;
            slideCounter.textContent = `${currentIdx + 1} / ${adsArray.length}`;

            startAutoSlide();
        }

        function startAutoSlide() {
            if (slideTimer) clearInterval(slideTimer);
            if (adsArray.length > 1) {
                slideTimer = setInterval(() => {
                    currentIdx = (currentIdx + 1) % adsArray.length;
                    sliderTrack.style.transform = `translateX(-${currentIdx * 100}%)`;
                    slideCounter.textContent = `${currentIdx + 1} / ${adsArray.length}`;
                }, 4000); // exactly 4 seconds
            }
        }

        // Automatically fetch from Firebase under 'ad1' on every refresh / page load
        async function fetchFromFirebase() {
            try {
                const snapshot = await get(ad1Ref);
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (Array.isArray(data)) {
                        adsArray = data;
                    } else if (typeof data === 'object') {
                        // Converts object entries or child records into a clean array
                        adsArray = Object.values(data).map(item => typeof item === 'string' ? { link: item } : item);
                    }
                    renderRotation();
                } else {
                    sliderTrack.innerHTML = `<div class="w-full h-full flex items-center justify-center shrink-0"><span class="text-xs text-slate-400">No ads stored under ad1 yet.</span></div>`;
                    slideCounter.textContent = "0 / 0";
                }
            } catch (error) {
                console.error("Firebase fetch error:", error);
                sliderTrack.innerHTML = `<div class="w-full h-full flex items-center justify-center shrink-0"><span class="text-xs text-red-500">Failed to connect to database.</span></div>`;
            }
        }

        // Save link when button is clicked
        saveBtn.addEventListener('click', async () => {
            const val = linkInput.value.trim();
            if (!val) {
                showMessage("Please enter a valid Google Drive link.", true);
                return;
            }

            // Push to local list
            adsArray.push({ link: val, timestamp: Date.now() });

            try {
                // Save under label 'ad1' in Firebase safely
                await set(ad1Ref, adsArray);
                
                // Form becomes empty completely
                linkInput.value = '';
                
                // Professional message confirmation
                showMessage("Success: Ad link successfully saved and published!");
                
                // Update preview instantly
                currentIdx = adsArray.length - 1;
                renderRotation();
            } catch (err) {
                console.error("Firebase save error:", err);
                showMessage("Failed to save. Check database rules.", true);
            }
        });

        // Trigger automatic loading check on page load / refresh
        window.addEventListener('DOMContentLoaded', fetchFromFirebase);
    </script>
</body>
</html>
