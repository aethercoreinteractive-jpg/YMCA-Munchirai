<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad Management Panel | Munchirai YMCA Food Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-amber-500 selection:text-slate-950 pt-14">

    <!-- Professional Fixed Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md text-white shadow-lg border-b border-slate-800">
        <div class="max-w-4xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 shrink-0">
                <a href="mystore.html" class="text-sm sm:text-2xl font-black tracking-tighter uppercase text-white flex items-center gap-1.5">
                    <span class="bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-xs sm:text-lg font-bold shadow">MY</span> Ad Panel
                </a>
            </div>

            <div class="flex items-center gap-2">
                <a href="mystore.html" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition border border-slate-700 flex items-center gap-1">
                    <i class="fa-solid fa-store text-amber-400"></i> Store
                </a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-3 sm:px-6 py-6 space-y-8">
        
        <!-- SECTION 1: LIVE PREVIEW SCREEN (Fetches from Firebase ONLY) -->
        <section class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 sm:p-6 space-y-3">
            <div class="flex items-center justify-between border-b border-gray-100 pb-2">
                <h2 class="text-xs font-black text-slate-900 uppercase tracking-wider flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span>
                    Live Ad Preview Screen
                </h2>
                <span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full">Auto-slides every 4s</span>
            </div>

            <!-- Carousel Viewport -->
            <div class="relative w-full h-48 sm:h-64 bg-slate-900 rounded-xl overflow-hidden shadow-inner border border-slate-800">
                <div id="ad-preview-slider" class="flex h-full w-full overflow-x-auto snap-x snap-mandatory no-scrollbar transition-transform duration-500">
                    <!-- Dynamic preview slides injected here -->
                    <div class="w-full h-full flex-shrink-0 snap-center flex items-center justify-center text-slate-400 text-xs">
                        Loading ads from Firebase...
                    </div>
                </div>

                <!-- Slide Indicators / Dots -->
                <div id="ad-indicators" class="absolute bottom-2.5 left-0 right-0 flex justify-center gap-1.5 z-10">
                    <!-- Dots injected via JS -->
                </div>
            </div>
            <p class="text-[11px] text-gray-500 text-center">Swipe horizontally to manually browse ads, or watch them auto-rotate.</p>
        </section>

        <!-- SECTION 2: AD EDITING PANEL -->
        <section class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 sm:p-6 space-y-4">
            <div class="flex items-center justify-between border-b border-gray-100 pb-2">
                <div>
                    <h2 class="text-sm font-black text-slate-900 uppercase tracking-wider flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span>
                        Manage Ad Links
                    </h2>
                    <p class="text-[11px] text-gray-500 mt-0.5">Paste Google Drive image/video sharing links below.</p>
                </div>
                <button onclick="addNewAdRow()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition shadow flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-amber-400"></i> Add Ad
                </button>
            </div>

            <!-- Ad Input Rows Container -->
            <div id="ad-inputs-container" class="space-y-3">
                <!-- Rendered dynamically -->
            </div>

            <!-- Save Button -->
            <div class="pt-3 border-t border-gray-100 flex items-center justify-between">
                <span id="save-status" class="text-xs font-semibold text-emerald-600 hidden"><i class="fa-solid fa-check-circle mr-1"></i> Saved successfully to Firebase!</span>
                <button onclick="saveAdsToFirebase()" class="ml-auto bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-black text-xs px-6 py-2.5 rounded-xl transition shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Save All Ads
                </button>
            </div>
        </section>

    </main>

    <!-- Firebase SDK Imports & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        let currentAdsData = [];
        let autoSlideInterval = null;
        let currentSlideIndex = 0;

        // Helper to convert Google Drive sharing links to direct embed viewable links if needed
        function formatDriveUrl(url) {
            if (!url) return '';
            // If it's a standard google drive view link, transform to direct file export/preview
            if (url.includes('drive.google.com') && url.includes('/file/d/')) {
                const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
            }
            return url;
        }

        // Fetch ads strictly from 'ads' node in Firebase (Safe from disturbing other nodes)
        const adsRef = ref(db, 'ads');
        onValue(adsRef, (snapshot) => {
            const data = snapshot.val();
            if (data && Array.isArray(data)) {
                currentAdsData = data;
            } else if (data && typeof data === 'object') {
                currentAdsData = Object.values(data);
            } else {
                currentAdsData = [
                    { link: "", type: "image" }
                ];
            }
            renderAdInputs();
            renderPreviewSlider();
            setupAutoSlide();
        });

        // Render input editing rows
        window.renderAdInputs = function() {
            const container = document.getElementById('ad-inputs-container');
            let html = '';

            if (currentAdsData.length === 0) {
                currentAdsData = [{ link: "", type: "image" }];
            }

            currentAdsData.forEach((ad, index) => {
                html += `
                    <div class="flex flex-col sm:flex-row items-center gap-2 bg-gray-50 p-3 rounded-xl border border-gray-200" data-index="${index}">
                        <div class="flex items-center justify-between w-full sm:w-auto gap-2">
                            <span class="text-xs font-black text-slate-700 bg-slate-200 px-2.5 py-1 rounded-md shrink-0">Ad ${index + 1}</span>
                            <select onchange="updateAdType(${index}, this.value)" class="bg-white border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-slate-800 focus:outline-none focus:border-amber-500">
                                <option value="image" ${ad.type === 'image' ? 'selected' : ''}>Image</option>
                                <option value="video" ${ad.type === 'video' ? 'selected' : ''}>Video</option>
                            </select>
                        </div>
                        <input type="text" value="${ad.link || ''}" oninput="updateAdLink(${index}, this.value)" placeholder="Paste Google Drive image/video link here..." class="w-full bg-white border border-gray-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-amber-500 shadow-sm">
                        <button onclick="removeAdRow(${index})" class="text-rose-500 hover:text-rose-700 p-1.5 rounded-lg text-xs shrink-0 self-end sm:self-center" title="Remove Ad">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        };

        window.addNewAdRow = function() {
            currentAdsData.push({ link: "", type: "image" });
            renderAdInputs();
        };

        window.removeAdRow = function(index) {
            if (currentAdsData.length <= 1) {
                alert("You must keep at least one ad slot.");
                return;
            }
            currentAdsData.splice(index, 1);
            renderAdInputs();
            renderPreviewSlider();
        };

        window.updateAdLink = function(index, val) {
            currentAdsData[index].link = val;
            // Live preview update on typing
            renderPreviewSlider();
        };

        window.updateAdType = function(index, val) {
            currentAdsData[index].type = val;
            renderPreviewSlider();
        };

        // Save safely to Firebase (Only updates 'ads' key, leaving inventory/categories untouched)
        window.saveAdsToFirebase = async function() {
            try {
                // Filter out empty rows or keep them clean
                await set(ref(db, 'ads'), currentAdsData);
                const status = document.getElementById('save-status');
                status.classList.remove('hidden');
                setTimeout(() => status.classList.add('hidden'), 3000);
            } catch (error) {
                console.error("Error saving ads:", error);
                alert("Failed to save ads. Please check your connection.");
            }
        };

        // Render Preview Carousel Slider
        window.renderPreviewSlider = function() {
            const slider = document.getElementById('ad-preview-slider');
            const indicators = document.getElementById('ad-indicators');
            
            const validAds = currentAdsData.filter(ad => ad.link && ad.link.trim() !== "");

            if (validAds.length === 0) {
                slider.innerHTML = `<div class="w-full h-full flex-shrink-0 snap-center flex items-center justify-center text-slate-400 text-xs">No active ad links configured. Paste a link below.</div>`;
                indicators.innerHTML = '';
                return;
            }

            let slidesHtml = '';
            let dotsHtml = '';

            validAds.forEach((ad, idx) => {
                const formattedUrl = formatDriveUrl(ad.link);
                if (ad.type === 'video') {
                    slidesHtml += `
                        <div class="w-full h-full flex-shrink-0 snap-center flex items-center justify-center bg-black">
                            <video src="${formattedUrl}" controls class="w-full h-full object-contain"></video>
                        </div>
                    `;
                } else {
                    slidesHtml += `
                        <div class="w-full h-full flex-shrink-0 snap-center flex items-center justify-center bg-slate-950">
                            <img src="${formattedUrl}" alt="Ad ${idx + 1}" class="w-full h-full object-contain" onerror="this.src='https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'">
                        </div>
                    `;
                }

                dotsHtml += `<span class="w-2 h-2 rounded-full ${idx === 0 ? 'bg-amber-500 w-4' : 'bg-white/50'} transition-all duration-300 inline-block"></span>`;
            });

            slider.innerHTML = slidesHtml;
            indicators.innerHTML = dotsHtml;
        };

        // Professional Industry-Standard 4-Second Auto-Slide with Manual Swipe Support
        function setupAutoSlide() {
            if (autoSlideInterval) clearInterval(autoSlideInterval);
            
            const slider = document.getElementById('ad-preview-slider');
            if (!slider) return;

            autoSlideInterval = setInterval(() => {
                const validAds = currentAdsData.filter(ad => ad.link && ad.link.trim() !== "");
                if (validAds.length <= 1) return;

                currentSlideIndex = (currentSlideIndex + 1) % validAds.length;
                const scrollAmount = slider.clientWidth * currentSlideIndex;
                slider.scrollTo({ left: scrollAmount, behavior: 'smooth' });
                updateDots(currentSlideIndex);
            }, 4000);
        }

        function updateDots(activeIdx) {
            const dots = document.querySelectorAll('#ad-indicators span');
            dots.forEach((dot, idx) => {
                if (idx === activeIdx) {
                    dot.className = "w-4 h-2 rounded-full bg-amber-500 transition-all duration-300 inline-block";
                } else {
                    dot.className = "w-2 h-2 rounded-full bg-white/50 transition-all duration-300 inline-block";
                }
            });
        }

        // Track manual finger swipe to update indicator dots accordingly
        document.addEventListener('DOMContentLoaded', () => {
            const slider = document.getElementById('ad-preview-slider');
            if (slider) {
                slider.addEventListener('scroll', () => {
                    const validAds = currentAdsData.filter(ad => ad.link && ad.link.trim() !== "");
                    if (validAds.length <= 1) return;
                    const index = Math.round(slider.scrollLeft / slider.clientWidth);
                    if (index !== currentSlideIndex && index >= 0 && index < validAds.length) {
                        currentSlideIndex = index;
                        updateDots(currentSlideIndex);
                    }
                }, { passive: true });
            }
        });
    </script>
</body>
</html>
