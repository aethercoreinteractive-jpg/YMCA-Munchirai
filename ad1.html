<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Ad 1 Mobile Optimization</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#090d16',
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .toggle-checkbox:checked { right: 0; border-color: #f59e0b; }
        .toggle-checkbox:checked + .toggle-label { background-color: #f59e0b; }
        input, select { font-size: 16px !important; } /* Prevents iOS auto-zoom on focus */
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- MOBILE NAVIGATION HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-45 shadow-md backdrop-blur-md bg-opacity-95">
        <div class="max-w-2xl mx-auto px-3.5 h-14 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 shrink-0">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 font-black flex items-center justify-center text-[11px] tracking-tighter shadow-sm">MY</div>
                <div>
                    <h1 class="text-[11px] font-extrabold text-white tracking-tight leading-tight">MUNCHIRAI YMCA</h1>
                    <span class="text-[9px] text-amber-400 font-mono tracking-wider block">MOBILE_AD_1</span>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <a href="admanagement.html" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 shadow-sm flex items-center gap-1 transition active:scale-95">
                    <i class="fa-solid fa-arrow-left text-amber-400 text-[10px]"></i>
                    <span>Back</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="max-w-2xl mx-auto w-full px-3 py-4 sm:py-6 flex-grow space-y-4">
        
        <!-- Multi-Ad Configuration Section -->
        <section class="bg-white rounded-2xl p-4 sm:p-6 shadow-lg shadow-slate-200/40 border border-slate-200/80">
            <div class="border-b border-slate-100 pb-3 mb-4 flex items-center justify-between gap-2">
                <div>
                    <span class="text-[9px] font-bold uppercase tracking-widest text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200/60">Rotation Manager</span>
                    <h2 class="text-sm sm:text-base font-extrabold text-slate-900 mt-1">Configure Slides</h2>
                </div>
                <button type="button" id="add-slide-btn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-3 py-2 rounded-xl text-xs transition shadow-sm active:scale-95 flex items-center gap-1.5 shrink-0">
                    <i class="fa-solid fa-plus text-[9px]"></i>
                    <span>Add Slide</span>
                </button>
            </div>

            <!-- Status Alert Box -->
            <div id="status-msg" class="hidden mb-4 p-2.5 rounded-xl text-xs font-medium text-center shadow-sm"></div>

            <!-- Slides Container -->
            <div id="slides-container" class="space-y-3 mb-4">
                <span class="text-xs text-slate-400 py-3 block text-center">No slides added yet. Tap "Add Slide" above.</span>
            </div>

            <!-- Save All Button -->
            <button type="button" id="save-all-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-extrabold py-3 rounded-xl text-xs transition shadow-md active:scale-[0.98]">
                Save & Publish Slides
            </button>
        </section>

        <!-- LIVE PREVIEW SECTION -->
        <section class="bg-white rounded-2xl p-4 sm:p-6 shadow-lg shadow-slate-200/40 border border-slate-200/80">
            <div class="border-b border-slate-100 pb-3 mb-3 flex items-center justify-between">
                <div>
                    <span class="text-[9px] font-bold uppercase tracking-widest text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200/60">Live Preview</span>
                    <h2 class="text-sm sm:text-base font-extrabold text-slate-900 mt-1">4s Auto-Rotation Preview</h2>
                </div>
                <div class="w-7 h-7 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-[10px] font-bold border border-emerald-200">
                    <i class="fa-solid fa-eye"></i>
                </div>
            </div>

            <!-- Ad Container Preview Box (Mobile Aspect Ratio Optimized) -->
            <div id="ad1-preview-wrapper" class="w-full aspect-[16/9] rounded-xl overflow-hidden bg-slate-950 relative shadow-inner flex items-center justify-center">
                <span class="text-[11px] text-slate-400">Add slides to view preview...</span>
            </div>
        </section>

    </main>

    <!-- MOBILE FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-3 text-center text-[10px] text-slate-400">
        Munchirai YMCA Secure Portal &bull; Mobile Admin
    </footer>

    <!-- Firebase Realtime Engine & Mobile-First Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const slidesContainer = document.getElementById('slides-container');
        const previewWrapper = document.getElementById('ad1-preview-wrapper');
        let slidesCache = [];
        let previewInterval = null;

        function formatDriveLink(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                const fileIdMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (fileIdMatch && fileIdMatch[1]) {
                    return `https://drive.google.com/uc?export=view&id=${fileIdMatch[1]}`;
                }
            }
            return url;
        }

        function showStatus(message, isError = false) {
            const msgEl = document.getElementById('status-msg');
            if (!msgEl) return;
            msgEl.textContent = message;
            msgEl.className = `mb-4 p-2.5 rounded-xl text-xs font-medium text-center shadow-sm ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            msgEl.classList.remove('hidden');
            setTimeout(() => { msgEl.classList.add('hidden'); }, 3500);
        }

        // Render Mobile-Friendly Slide Cards
        function renderSlideForm() {
            if (slidesCache.length === 0) {
                slidesContainer.innerHTML = `<span class="text-xs text-slate-400 py-3 block text-center">No slides added yet. Tap "Add Slide" above.</span>`;
                return;
            }

            slidesContainer.innerHTML = slidesCache.map((slide, index) => `
                <div class="slide-card bg-slate-50 border border-slate-200/90 rounded-2xl p-3.5 space-y-3 relative shadow-sm" data-index="${index}">
                    <div class="flex items-center justify-between border-b border-slate-200/80 pb-2">
                        <span class="text-xs font-extrabold text-slate-900"><i class="fa-solid fa-film text-amber-500 mr-1.5"></i> Slide #${index + 1}</span>
                        <button type="button" onclick="window.removeSlide(${index})" class="text-slate-400 hover:text-red-600 p-1.5 transition" title="Remove">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">Google Drive Link</label>
                        <input type="url" class="slide-link w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition" 
                               value="${slide.link || ''}" placeholder="https://drive.google.com/file/d/..." oninput="window.updateSlideData(${index}, 'link', this.value)">
                    </div>

                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">Media Type</label>
                            <select class="slide-type w-full bg-white border border-slate-200 rounded-xl px-2.5 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition" 
                                    onchange="window.updateSlideData(${index}, 'mediaType', this.value); window.toggleMediaTypeUI(${index}, this.value);">
                                <option value="photo" ${slide.mediaType === 'photo' ? 'selected' : ''}>Photo</option>
                                <option value="video" ${slide.mediaType === 'video' ? 'selected' : ''}>Video</option>
                            </select>
                        </div>
                        <div id="audio-box-${index}" class="${slide.mediaType === 'video' ? '' : 'hidden'}">
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">Video Audio</label>
                            <select class="slide-audio w-full bg-white border border-slate-200 rounded-xl px-2.5 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition" 
                                    onchange="window.updateSlideData(${index}, 'audioState', this.value)">
                                <option value="unmute" ${slide.audioState !== 'mute' ? 'selected' : ''}>Unmuted</option>
                                <option value="mute" ${slide.audioState === 'mute' ? 'selected' : ''}>Muted</option>
                            </select>
                        </div>
                    </div>

                    <!-- Action Button Section per Slide -->
                    <div class="pt-2 border-t border-slate-200/60">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[10px] font-bold text-slate-700">Action Button Overlay</span>
                            <div class="relative inline-block w-9 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" id="toggle-${index}" class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 border-slate-300 appearance-none cursor-pointer transition-all duration-300 right-5 checked:right-0" ${slide.showButton ? 'checked' : ''} onchange="window.toggleButtonSwitch(${index}, this.checked)">
                                <label for="toggle-${index}" class="toggle-label block overflow-hidden h-4 rounded-full bg-slate-300 cursor-pointer transition-colors duration-300"></label>
                            </div>
                        </div>

                        <div id="btn-fields-${index}" class="space-y-2 ${slide.showButton ? '' : 'hidden'} bg-white p-2.5 rounded-xl border border-slate-200">
                            <div>
                                <label class="block text-[9px] font-bold text-slate-500 mb-0.5">Button Name</label>
                                <input type="text" class="slide-btn-name w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500" 
                                       value="${slide.buttonName || ''}" placeholder="e.g. Shop Now" oninput="window.updateSlideData(${index}, 'buttonName', this.value)">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-500 mb-0.5">Button Link URL</label>
                                <input type="url" class="slide-btn-url w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500" 
                                       value="${slide.buttonUrl || ''}" placeholder="https://..." oninput="window.updateSlideData(${index}, 'buttonUrl', this.value)">
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            updateLivePreview();
        }

        window.updateSlideData = function(index, field, value) {
            if (slidesCache[index]) {
                slidesCache[index][field] = value;
                updateLivePreview();
            }
        };

        window.toggleMediaTypeUI = function(index, type) {
            const audioBox = document.getElementById(`audio-box-${index}`);
            if (audioBox) {
                if (type === 'video') audioBox.classList.remove('hidden');
                else audioBox.classList.add('hidden');
            }
        };

        window.toggleButtonSwitch = function(index, isChecked) {
            slidesCache[index].showButton = isChecked;
            const fields = document.getElementById(`btn-fields-${index}`);
            if (fields) {
                if (isChecked) fields.classList.remove('hidden');
                else fields.classList.add('hidden');
            }
            updateLivePreview();
        };

        window.removeSlide = function(index) {
            slidesCache.splice(index, 1);
            renderSlideForm();
        };

        document.getElementById('add-slide-btn').addEventListener('click', () => {
            slidesCache.push({
                link: '',
                mediaType: 'photo',
                audioState: 'unmute',
                showButton: false,
                buttonName: '',
                buttonUrl: ''
            });
            renderSlideForm();
        });

        // Live Auto-Sliding Preview Engine (Rotates every 4s)
        function updateLivePreview() {
            if (previewInterval) clearInterval(previewInterval);

            if (slidesCache.length === 0 || !slidesCache[0].link) {
                previewWrapper.innerHTML = `<span class="text-[11px] text-slate-400">Add slides to view preview...</span>`;
                return;
            }

            let currentIdx = 0;

            function showCurrentSlide() {
                const slide = slidesCache[currentIdx];
                if (!slide || !slide.link) return;

                const directUrl = formatDriveLink(slide.link);
                let content = '';

                if (slide.mediaType === 'video') {
                    const isMuted = slide.audioState === 'mute' ? 'muted' : '';
                    content = `
                        <video id="preview-vid" src="${directUrl}" autoplay loop playsinline ${isMuted} class="w-full h-full object-cover cursor-pointer"></video>
                        <div id="preview-badge" class="absolute bottom-2 right-2 bg-slate-950/80 backdrop-blur-md text-white px-2 py-0.5 rounded-full text-[9px] font-bold border border-white/10 shadow-md flex items-center gap-1 pointer-events-none">
                            <i class="fa-solid ${isMuted ? 'fa-volume-xmark text-amber-400' : 'fa-volume-high text-emerald-400'}"></i>
                            <span>${isMuted ? 'Muted' : 'Unmuted'}</span>
                        </div>
                    `;
                } else {
                    content = `<img src="${directUrl}" alt="Preview Slide" class="w-full h-full object-cover transition-opacity duration-700 ease-in-out">`;
                }

                if (slide.showButton && slide.buttonName && slide.buttonUrl) {
                    content += `
                        <div class="absolute bottom-2 left-2 z-10">
                            <a href="${slide.buttonUrl}" target="_blank" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-3 py-1.5 rounded-xl text-[10px] shadow-lg transition active:scale-95 flex items-center gap-1 border border-amber-300">
                                <span>${slide.buttonName}</span>
                                <i class="fa-solid fa-arrow-right text-[8px]"></i>
                            </a>
                        </div>
                    `;
                }

                previewWrapper.innerHTML = content;

                if (slide.mediaType === 'video') {
                    const vid = document.getElementById('preview-vid');
                    const badge = document.getElementById('preview-badge');
                    if (vid) {
                        vid.addEventListener('click', () => {
                            vid.muted = !vid.muted;
                            badge.innerHTML = `<i class="fa-solid ${vid.muted ? 'fa-volume-xmark text-amber-400' : 'fa-volume-high text-emerald-400'}"></i><span>${vid.muted ? 'Muted' : 'Unmuted'}</span>`;
                        });
                    }
                }
            }

            showCurrentSlide();

            if (slidesCache.length > 1) {
                previewInterval = setInterval(() => {
                    currentIdx = (currentIdx + 1) % slidesCache.length;
                    showCurrentSlide();
                }, 4000);
            }
        }

        // Load saved slides from Firebase on startup
        const adRef = ref(db, 'ads/ad1');
        get(adRef).then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                if (data.slides && Array.isArray(data.slides)) {
                    slidesCache = data.slides;
                } else if (data.link) {
                    slidesCache = [{
                        link: data.link,
                        mediaType: data.mediaType || 'photo',
                        audioState: data.audioState || 'unmute',
                        showButton: data.showButton || false,
                        buttonName: data.buttonName || '',
                        buttonUrl: data.buttonUrl || ''
                    }];
                }
                renderSlideForm();
            }
        }).catch(err => console.error("Error loading slides:", err));

        // Save All Slides to Firebase
        document.getElementById('save-all-btn').addEventListener('click', () => {
            if (slidesCache.length === 0) {
                showStatus("Please add at least one slide before saving.", true);
                return;
            }

            const payload = {
                slides: slidesCache,
                updatedAt: Date.now()
            };

            set(adRef, payload)
                .then(() => showStatus('Slides saved and published successfully!'))
                .catch(err => showStatus('Failed to save: ' + err.message, true));
        });
    </script>
</body>
</html>
