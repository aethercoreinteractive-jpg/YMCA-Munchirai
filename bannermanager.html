<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-full flex flex-col justify-between">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="admin.html" class="w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </a>
                <h1 class="text-sm font-bold text-slate-900">Banner Manager</h1>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-5xl mx-auto px-4 py-6 w-full grid grid-cols-1 md:grid-cols-12 gap-6 items-start flex-1">
        
        <!-- Left: Slide List & Add Button -->
        <div class="md:col-span-7 bg-white border border-slate-200 rounded-2xl p-5 shadow-xs">
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Active Banners</h2>
                <button type="button" onclick="openCreateModal()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-[10px]"></i> Add Banner
                </button>
            </div>

            <!-- Queue Container -->
            <div id="banner-queue-container" class="space-y-3">
                <div class="p-6 text-center text-xs text-slate-400 bg-slate-50 rounded-xl border border-slate-200 border-dashed">
                    <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-sm mb-2"></i>
                    <p>Loading banners...</p>
                </div>
            </div>
        </div>

        <!-- Right: Live Preview -->
        <div class="md:col-span-5 bg-white border border-slate-200 rounded-2xl p-5 md:sticky md:top-24 shadow-xs">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 pb-4 mb-4 border-b border-slate-100">Live Preview <span class="text-[10px] lowercase font-normal text-slate-400">(swipeable)</span></h2>
            
            <div id="preview-container" class="relative w-full aspect-[16/9] rounded-xl overflow-hidden bg-slate-950 border border-slate-200 shadow-inner cursor-grab active:cursor-grabbing select-none">
                <div id="preview-slider-track" class="flex h-full transition-transform duration-300 ease-out">
                    <div class="min-w-full h-full flex items-center justify-center text-slate-400 text-xs">
                        No preview available
                    </div>
                </div>

                <!-- Dots -->
                <div id="preview-dots-container" class="absolute bottom-2.5 left-1/2 -translate-x-1/2 z-10 flex items-center gap-1.5 bg-slate-950/60 backdrop-blur-xs px-2.5 py-1 rounded-full pointer-events-none">
                </div>
            </div>
        </div>

    </main>

    <!-- Modal Form (Create / Edit) -->
    <div id="slide-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs hidden items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-6 shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                <h3 id="modal-title" class="text-sm font-bold text-slate-900">Add Banner</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <form id="slide-form" class="space-y-4">
                <input type="hidden" id="modal-slide-id">
                
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Badge Tag</label>
                    <input type="text" id="slide-badge" placeholder="e.g. Featured" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Title</label>
                    <input type="text" id="slide-title" placeholder="e.g. Summer Camp 2026" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Image Link (Google Drive / URL)</label>
                    <input type="url" id="slide-image" placeholder="https://..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white transition">
                </div>

                <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition shadow-sm">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        <p>&copy; 2026 Munchirai YMCA & MY Store</p>
    </footer>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let slidesState = [];
        let previewIndex = 0;
        let previewTimer = null;

        // Touch & Mouse Drag Variables
        let startX = 0;
        let currentTranslate = 0;
        let prevTranslate = 0;
        let isDragging = false;
        let animationID = 0;

        function parseAssetURL(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
                let idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (idMatch && idMatch[1]) return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
            }
            return url;
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                let r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        async function initCMS() {
            try {
                const snapshot = await get(ref(db, 'heroicBanners'));
                if (snapshot.exists() && Array.isArray(snapshot.val())) {
                    slidesState = snapshot.val();
                } else {
                    slidesState = [{
                        id: generateUUID(),
                        badge: "Featured",
                        title: "Community Sports Program",
                        image: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&q=80&w=1600"
                    }];
                }
                renderWorkspace();
            } catch (err) {
                console.error("Error loading banners:", err);
            }
        }

        async function syncToFirebase() {
            try {
                await set(ref(db, 'heroicBanners'), slidesState);
            } catch (err) {
                console.error("Firebase sync error:", err);
            }
        }

        window.openCreateModal = function() {
            document.getElementById('modal-title').textContent = "Add Banner";
            document.getElementById('slide-form').reset();
            document.getElementById('modal-slide-id').value = "";
            document.getElementById('slide-modal').classList.remove('hidden');
            document.getElementById('slide-modal').classList.add('flex');
        };

        window.closeModal = function() {
            document.getElementById('slide-modal').classList.remove('flex');
            document.getElementById('slide-modal').classList.add('hidden');
        };

        document.getElementById('slide-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('modal-slide-id').value;
            const payload = {
                id: id || generateUUID(),
                badge: document.getElementById('slide-badge').value.trim(),
                title: document.getElementById('slide-title').value.trim(),
                image: document.getElementById('slide-image').value.trim()
            };

            if (id) {
                const idx = slidesState.findIndex(s => s.id === id);
                if (idx > -1) slidesState[idx] = payload;
            } else {
                slidesState.push(payload);
            }

            closeModal();
            renderWorkspace();
            await syncToFirebase();
        });

        window.editSlide = function(id) {
            const slide = slidesState.find(s => s.id === id);
            if (!slide) return;
            document.getElementById('modal-title').textContent = "Edit Banner";
            document.getElementById('modal-slide-id').value = slide.id;
            document.getElementById('slide-badge').value = slide.badge;
            document.getElementById('slide-title').value = slide.title;
            document.getElementById('slide-image').value = slide.image;

            document.getElementById('slide-modal').classList.remove('hidden');
            document.getElementById('slide-modal').classList.add('flex');
        };

        window.deleteSlide = async function(id) {
            if (confirm("Delete this banner?")) {
                slidesState = slidesState.filter(s => s.id !== id);
                renderWorkspace();
                await syncToFirebase();
            }
        };

        window.moveSlide = async function(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= slidesState.length) return;
            const temp = slidesState[index];
            slidesState[index] = slidesState[newIndex];
            slidesState[newIndex] = temp;
            renderWorkspace();
            await syncToFirebase();
        };

        function renderWorkspace() {
            renderQueueList();
            renderPreviewEngine();
            restartPreviewLoop();
        }

        function renderQueueList() {
            const container = document.getElementById('banner-queue-container');

            if (slidesState.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-xs text-slate-400 bg-slate-50 rounded-xl border border-slate-200">No banners found.</div>`;
                return;
            }

            container.innerHTML = slidesState.map((slide, idx) => `
                <div class="flex items-center justify-between gap-3 bg-slate-50/50 border border-slate-200 p-2.5 rounded-xl transition hover:bg-white hover:border-slate-300">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-12 h-9 rounded-lg bg-slate-200 overflow-hidden shrink-0 border border-slate-300">
                            <img src="${parseAssetURL(slide.image)}" alt="Thumb" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x60?text=ERR'">
                        </div>
                        <div class="min-w-0">
                            <span class="text-[9px] font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">${slide.badge}</span>
                            <h4 class="text-xs font-semibold text-slate-900 truncate mt-0.5">${slide.title}</h4>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="moveSlide(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-slate-600 hover:text-indigo-600 disabled:opacity-30 transition flex items-center justify-center text-xs"><i class="fa-solid fa-chevron-up"></i></button>
                        <button onclick="moveSlide(${idx}, 1)" ${idx === slidesState.length - 1 ? 'disabled' : ''} class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-slate-600 hover:text-indigo-600 disabled:opacity-30 transition flex items-center justify-center text-xs"><i class="fa-solid fa-chevron-down"></i></button>
                        <button onclick="editSlide('${slide.id}')" class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-slate-600 hover:text-indigo-600 transition flex items-center justify-center text-xs"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteSlide('${slide.id}')" class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-rose-500 hover:bg-rose-50 transition flex items-center justify-center text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderPreviewEngine() {
            const track = document.getElementById('preview-slider-track');
            const dots = document.getElementById('preview-dots-container');

            if (slidesState.length === 0) {
                track.innerHTML = `<div class="min-w-full h-full flex items-center justify-center text-slate-400 text-xs">No preview available</div>`;
                dots.innerHTML = ``;
                return;
            }

            track.innerHTML = slidesState.map(slide => `
                <div class="min-w-full h-full relative shrink-0">
                    <img src="${parseAssetURL(slide.image)}" alt="Preview" class="w-full h-full object-cover pointer-events-none" onerror="this.src='https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&q=80&w=1600'">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent flex flex-col justify-end p-3 text-white">
                        <span class="bg-indigo-600 text-white font-bold text-[8px] px-1.5 py-0.5 rounded w-max mb-0.5">${slide.badge}</span>
                        <h3 class="text-xs font-bold truncate">${slide.title}</h3>
                    </div>
                </div>
            `).join('');

            dots.innerHTML = slidesState.map((_, idx) => `
                <button onclick="jumpPreview(${idx})" class="w-1.5 h-1.5 rounded-full ${idx === previewIndex ? 'bg-indigo-400 w-3' : 'bg-white/50'} transition preview-dot"></button>
            `).join('');

            updateTransform();
            setupSwipeEvents();
        }

        window.jumpPreview = function(idx) {
            previewIndex = idx;
            updateTransform();
            restartPreviewLoop();
        }

        function updateTransform() {
            const track = document.getElementById('preview-slider-track');
            if (!track) return;
            track.style.transition = 'transform 0.3s ease-out';
            currentTranslate = previewIndex * -track.parentElement.clientWidth;
            prevTranslate = currentTranslate;
            track.style.transform = `translateX(${currentTranslate}px)`;

            document.querySelectorAll('.preview-dot').forEach((dot, idx) => {
                if (idx === previewIndex) {
                    dot.classList.remove('bg-white/50', 'w-1.5');
                    dot.classList.add('bg-indigo-400', 'w-3');
                } else {
                    dot.classList.add('bg-white/50', 'w-1.5');
                    dot.classList.remove('bg-indigo-400', 'w-3');
                }
            });
        }

        function restartPreviewLoop() {
            clearInterval(previewTimer);
            if (slidesState.length <= 1) return;
            previewTimer = setInterval(() => {
                if (!isDragging) {
                    previewIndex = (previewIndex + 1) % slidesState.length;
                    updateTransform();
                }
            }, 4000);
        }

        // Swipe & Touch Support for Live Preview
        function setupSwipeEvents() {
            const container = document.getElementById('preview-container');
            const track = document.getElementById('preview-slider-track');
            if (!container || !track) return;

            // Remove previous listeners to prevent duplicates
            container.ontouchstart = null;
            container.ontouchmove = null;
            container.ontouchend = null;
            container.onmousedown = null;
            container.onmousemove = null;
            container.onmouseup = null;
            container.onmouseleave = null;

            container.addEventListener('touchstart', touchStart(0), {passive: true});
            container.addEventListener('touchmove', touchMove, {passive: true});
            container.addEventListener('touchend', touchEnd);

            container.addEventListener('mousedown', touchStart(1));
            container.addEventListener('mousemove', touchMove);
            container.addEventListener('mouseup', touchEnd);
            container.addEventListener('mouseleave', () => {
                if (isDragging) touchEnd();
            });

            function getPositionX(event) {
                return event.type.includes('mouse') ? event.clientX : event.touches[0].clientX;
            }

            function touchStart(type) {
                return function(event) {
                    if (slidesState.length <= 1) return;
                    isDragging = true;
                    startX = getPositionX(event);
                    clearInterval(previewTimer);
                    track.style.transition = 'none';
                    animationID = requestAnimationFrame(animation);
                }
            }

            function touchMove(event) {
                if (!isDragging) return;
                const currentPosition = getPositionX(event);
                const diff = currentPosition - startX;
                currentTranslate = prevTranslate + diff;
            }

            function touchEnd() {
                if (!isDragging) return;
                isDragging = false;
                cancelAnimationFrame(animationID);

                const movedBy = currentTranslate - prevTranslate;
                const threshold = container.clientWidth / 4;

                if (movedBy < -threshold && previewIndex < slidesState.length - 1) {
                    previewIndex += 1;
                } else if (movedBy > threshold && previewIndex > 0) {
                    previewIndex -= 1;
                }

                updateTransform();
                restartPreviewLoop();
            }

            function animation() {
                if (isDragging) {
                    track.style.transform = `translateX(${currentTranslate}px)`;
                    requestAnimationFrame(animation);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', initCMS);
    </script>
</body>
</html>
