<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banner Manager & CMS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-full flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="admin.html" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </a>
                <div>
                    <h1 class="text-xs sm:text-sm font-bold text-slate-900">Banner Manager</h1>
                    <p class="text-[10px] text-slate-400">Manage hero carousel & live preview feed</p>
                </div>
            </div>
            <button type="button" onclick="openCreateModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-plus text-[10px]"></i> <span>Add Banner</span>
            </button>
        </div>
    </header>

    <!-- Main Content Workspace -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 w-full grid grid-cols-1 lg:grid-cols-12 gap-6 items-start flex-1">
        
        <!-- Left Column: Sortable Banner Queue -->
        <div class="lg:col-span-7 bg-white border border-slate-200/80 rounded-2xl p-4 sm:p-5 shadow-xs">
            <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Active Queue</h2>
                    <p class="text-[10px] text-slate-400">Drag items up/down to reorder instantly</p>
                </div>
                <div class="flex items-center gap-2">
                    <span id="autoSaveIndicator" class="text-[10px] font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md hidden">
                        <i class="fa-solid fa-circle-check mr-0.5"></i> Saved
                    </span>
                    <span id="banner-count-badge" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">0 Banners</span>
                </div>
            </div>

            <!-- Queue List Container -->
            <div id="banner-queue-container" class="space-y-2.5 min-h-[140px] max-h-[450px] overflow-y-auto pr-1">
                <div class="p-8 text-center text-xs text-slate-400 bg-slate-50/50 rounded-xl border border-slate-200 border-dashed">
                    <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-sm mb-2"></i>
                    <p>Loading banners...</p>
                </div>
            </div>
        </div>

        <!-- Right Column: Interactive Live Preview -->
        <div class="lg:col-span-5 bg-white border border-slate-200/80 rounded-2xl p-4 sm:p-5 lg:sticky lg:top-24 shadow-xs">
            <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Live Preview</h2>
                    <p class="text-[10px] text-slate-400">Seamless loop simulation</p>
                </div>
                <div class="flex items-center gap-1 text-[10px] font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Live Sync
                </div>
            </div>
            
            <div id="preview-container" class="relative w-full aspect-[16/9] rounded-xl overflow-hidden bg-slate-950 border border-slate-200 shadow-inner cursor-grab active:cursor-grabbing select-none">
                <div id="preview-slider-track" class="flex h-full transition-transform duration-300 ease-out w-full">
                    <div class="min-w-full h-full flex items-center justify-center text-slate-400 text-xs">
                        No preview available
                    </div>
                </div>

                <!-- Navigation Dots -->
                <div id="preview-dots-container" class="absolute bottom-3 left-1/2 -translate-x-1/2 z-10 flex items-center gap-1.5 bg-slate-950/60 backdrop-blur-xs px-3 py-1 rounded-full pointer-events-none">
                </div>
            </div>
        </div>

    </main>

    <!-- Modal Form (Create / Edit) -->
    <div id="slide-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all scale-100">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                <h3 id="modal-title" class="text-sm font-bold text-slate-900">Add Banner</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <form id="slide-form" class="space-y-4">
                <input type="hidden" id="modal-slide-id">
                
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Badge Tag</label>
                    <input type="text" id="slide-badge" placeholder="e.g. Featured" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Title</label>
                    <input type="text" id="slide-title" placeholder="e.g. Summer Camp 2026" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Image Link (Google Drive / Direct URL)</label>
                    <input type="url" id="slide-image" placeholder="https://..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white transition">
                </div>

                <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition shadow-sm">Save Banner</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        <p>&copy; 2026 Munchirai YMCA & MY Store</p>
    </footer>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.slidesState = [];
        let previewIndex = 0;
        let previewTimer = null;
        let draggedItemNode = null;

        // Preview Slider Gestures state
        let startX = 0;
        let currentTranslate = 0;
        let prevTranslate = 0;
        let isDraggingPreview = false;
        let animationID = 0;

        function parseAssetURL(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
                let idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (idMatch && idMatch[1]) return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
            }
            return url;
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                let r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        async function initCMS() {
            try {
                const snapshot = await get(ref(db, 'heroicBanners'));
                if (snapshot.exists()) {
                    let data = snapshot.val();
                    if (Array.isArray(data)) {
                        slidesState = data;
                    } else if (typeof data === 'object') {
                        slidesState = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                    }
                } else {
                    slidesState = [{
                        id: generateUUID(),
                        badge: "Featured",
                        title: "Community Sports Program",
                        image: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&q=80&w=1600",
                        order: 0
                    }];
                }
                
                slidesState.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
                renderWorkspace();
            } catch (err) {
                console.error("Error loading banners:", err);
            }
        }

        async function syncToFirebase() {
            try {
                await set(ref(db, 'heroicBanners'), slidesState);
            } catch (err) {
                console.error("Firebase sync error:", err);
            }
        }

        window.openCreateModal = function() {
            document.getElementById('modal-title').textContent = "Add Banner";
            document.getElementById('slide-form').reset();
            document.getElementById('modal-slide-id').value = "";
            document.getElementById('slide-modal').classList.remove('hidden');
            document.getElementById('slide-modal').classList.add('flex');
        };

        window.closeModal = function() {
            document.getElementById('slide-modal').classList.remove('flex');
            document.getElementById('slide-modal').classList.add('hidden');
        };

        document.getElementById('slide-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('modal-slide-id').value;
            const payload = {
                id: id || generateUUID(),
                badge: document.getElementById('slide-badge').value.trim(),
                title: document.getElementById('slide-title').value.trim(),
                image: document.getElementById('slide-image').value.trim(),
                order: id && slidesState.find(s => s.id === id)?.order !== undefined ? slidesState.find(s => s.id === id).order : slidesState.length
            };

            if (id) {
                const idx = slidesState.findIndex(s => s.id === id);
                if (idx > -1) slidesState[idx] = payload;
            } else {
                slidesState.push(payload);
            }

            closeModal();
            renderWorkspace();
            await syncToFirebase();
        });

        window.editSlide = function(id) {
            const slide = slidesState.find(s => s.id === id);
            if (!slide) return;
            document.getElementById('modal-title').textContent = "Edit Banner";
            document.getElementById('modal-slide-id').value = slide.id;
            document.getElementById('slide-badge').value = slide.badge;
            document.getElementById('slide-title').value = slide.title;
            document.getElementById('slide-image').value = slide.image;

            document.getElementById('slide-modal').classList.remove('hidden');
            document.getElementById('slide-modal').classList.add('flex');
        };

        window.deleteSlide = async function(id) {
            if (confirm("Are you sure you want to delete this banner?")) {
                slidesState = slidesState.filter(s => s.id !== id);
                renderWorkspace();
                await syncToFirebase();
            }
        };

        function renderWorkspace() {
            renderQueueList();
            renderPreviewEngine();
            restartPreviewLoop();
        }

        function renderQueueList() {
            const container = document.getElementById('banner-queue-container');
            const badge = document.getElementById('banner-count-badge');
            badge.textContent = `${slidesState.length} Banners`;

            if (slidesState.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-xs text-slate-400 bg-slate-50/50 rounded-xl border border-slate-200">No banners found. Click 'Add Banner' to start.</div>`;
                return;
            }

            container.innerHTML = '';
            slidesState.forEach((slide, index) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between gap-3 bg-white border border-slate-200/80 p-2.5 rounded-xl transition shadow-xs hover:border-slate-300 cursor-grab active:cursor-grabbing select-none";
                row.draggable = true;
                row.dataset.id = slide.id;

                row.addEventListener('dragstart', (e) => {
                    draggedItemNode = row;
                    e.dataTransfer.effectAllowed = 'move';
                    setTimeout(() => row.classList.add('opacity-40'), 0);
                });

                row.addEventListener('dragend', () => {
                    row.classList.remove('opacity-40');
                    draggedItemNode = null;
                    autoSaveOrder();
                });

                row.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const afterElement = getDragAfterElement(container, e.clientY);
                    if (afterElement == null) {
                        container.appendChild(draggedItemNode);
                    } else {
                        container.insertBefore(draggedItemNode, afterElement);
                    }
                });

                row.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="row-index text-xs font-bold text-slate-400 w-4 text-center">${index + 1}</div>
                        <div class="w-8 h-8 rounded-lg bg-slate-100 text-slate-400 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-grip-vertical text-xs"></i>
                        </div>
                        <div class="w-12 h-9 rounded-lg bg-slate-100 overflow-hidden shrink-0 border border-slate-200">
                            <img src="${parseAssetURL(slide.image)}" alt="Thumbnail" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x60?text=ERR'">
                        </div>
                        <div class="min-w-0">
                            <span class="text-[9px] font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">${slide.badge}</span>
                            <h4 class="text-xs font-semibold text-slate-900 truncate mt-0.5">${slide.title}</h4>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0" onclick="event.stopPropagation()">
                        <button type="button" onclick="editSlide('${slide.id}')" class="w-8 h-8 rounded-lg bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-600 hover:text-indigo-600 transition flex items-center justify-center text-xs"><i class="fa-solid fa-pen"></i></button>
                        <button type="button" onclick="deleteSlide('${slide.id}')" class="w-8 h-8 rounded-lg bg-slate-50 hover:bg-rose-50 border border-slate-200 text-slate-600 hover:text-rose-600 transition flex items-center justify-center text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('[draggable="true"]:not(.opacity-40)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        async function autoSaveOrder() {
            const container = document.getElementById('banner-queue-container');
            const rows = container.querySelectorAll('[data-id]');
            if (rows.length === 0) return;

            const indicator = document.getElementById('autoSaveIndicator');
            const newOrderIDs = Array.from(rows).map(row => row.getAttribute('data-id'));

            slidesState.sort((a, b) => newOrderIDs.indexOf(a.id) - newOrderIDs.indexOf(b.id));
            
            slidesState.forEach((slide, idx) => {
                slide.order = idx;
            });

            rows.forEach((row, idx) => {
                const idxLabel = row.querySelector('.row-index');
                if (idxLabel) idxLabel.textContent = idx + 1;
            });

            renderPreviewEngine();
            restartPreviewLoop();

            try {
                await syncToFirebase();
                indicator.classList.remove('hidden');
                setTimeout(() => indicator.classList.add('hidden'), 2000);
            } catch (err) {
                console.error("Auto-save order failed:", err);
            }
        }

        function renderPreviewEngine() {
            const track = document.getElementById('preview-slider-track');
            const dots = document.getElementById('preview-dots-container');

            if (!track || slidesState.length === 0) {
                if (track) track.innerHTML = `<div class="min-w-full h-full flex items-center justify-center text-slate-400 text-xs">No preview available</div>`;
                if (dots) dots.innerHTML = ``;
                return;
            }

            track.innerHTML = slidesState.map(slide => `
                <div class="min-w-full h-full relative shrink-0">
                    <img src="${parseAssetURL(slide.image)}" alt="Preview Slide" class="w-full h-full object-cover pointer-events-none" onerror="this.src='https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&q=80&w=1600'">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent flex flex-col justify-end p-4 text-white">
                        <span class="bg-indigo-600 text-white font-bold text-[8px] px-1.5 py-0.5 rounded w-max mb-1">${slide.badge}</span>
                        <h3 class="text-xs font-bold truncate">${slide.title}</h3>
                    </div>
                </div>
            `).join('');

            dots.innerHTML = slidesState.map((_, idx) => `
                <button type="button" onclick="jumpPreview(${idx})" class="w-1.5 h-1.5 rounded-full ${idx === previewIndex ? 'bg-indigo-400 w-3' : 'bg-white/50'} transition preview-dot"></button>
            `).join('');

            updateTransform();
            setupSwipeEvents();
        }

        window.jumpPreview = function(idx) {
            previewIndex = idx;
            updateTransform();
            restartPreviewLoop();
        }

        function updateTransform() {
            const track = document.getElementById('preview-slider-track');
            if (!track || slidesState.length === 0) return;
            
            if (previewIndex >= slidesState.length) previewIndex = 0;
            if (previewIndex < 0) previewIndex = slidesState.length - 1;

            track.style.transition = 'transform 0.3s ease-out';
            currentTranslate = previewIndex * -track.parentElement.clientWidth;
            prevTranslate = currentTranslate;
            track.style.transform = `translateX(${currentTranslate}px)`;

            document.querySelectorAll('.preview-dot').forEach((dot, idx) => {
                if (idx === previewIndex) {
                    dot.classList.remove('bg-white/50', 'w-1.5');
                    dot.classList.add('bg-indigo-400', 'w-3');
                } else {
                    dot.classList.add('bg-white/50', 'w-1.5');
                    dot.classList.remove('bg-indigo-400', 'w-3');
                }
            });
        }

        function restartPreviewLoop() {
            clearInterval(previewTimer);
            if (slidesState.length <= 1) return;
            previewTimer = setInterval(() => {
                if (!isDraggingPreview) {
                    previewIndex = (previewIndex + 1) % slidesState.length;
                    updateTransform();
                }
            }, 4000);
        }

        function setupSwipeEvents() {
            const container = document.getElementById('preview-container');
            const track = document.getElementById('preview-slider-track');
            if (!container || !track) return;

            const newContainer = container.cloneNode(true);
            container.parentNode.replaceChild(newContainer, container);
            
            const activeContainer = document.getElementById('preview-container');
            const activeTrack = document.getElementById('preview-slider-track');

            activeContainer.addEventListener('touchstart', touchStart, {passive: true});
            activeContainer.addEventListener('touchmove', touchMove, {passive: true});
            activeContainer.addEventListener('touchend', touchEnd);

            activeContainer.addEventListener('mousedown', touchStart);
            activeContainer.addEventListener('mousemove', touchMove);
            activeContainer.addEventListener('mouseup', touchEnd);
            activeContainer.addEventListener('mouseleave', () => {
                if (isDraggingPreview) touchEnd();
            });

            function getPositionX(event) {
                return event.type.includes('mouse') ? event.clientX : event.touches[0].clientX;
            }

            function touchStart(event) {
                if (slidesState.length <= 1) return;
                isDraggingPreview = true;
                startX = getPositionX(event);
                clearInterval(previewTimer);
                activeTrack.style.transition = 'none';
                animationID = requestAnimationFrame(animation);
            }

            function touchMove(event) {
                if (!isDraggingPreview) return;
                const currentPosition = getPositionX(event);
                const diff = currentPosition - startX;
                
                // Hard clamp bounds to ensure zero black space during drag
                const maxTranslate = 0;
                const minTranslate = -(slidesState.length - 1) * activeContainer.clientWidth;
                let potentialTranslate = prevTranslate + diff;
                
                if (potentialTranslate > maxTranslate) {
                    potentialTranslate = maxTranslate;
                } else if (potentialTranslate < minTranslate) {
                    potentialTranslate = minTranslate;
                }
                
                currentTranslate = potentialTranslate;
            }

            function touchEnd() {
                if (!isDraggingPreview) return;
                isDraggingPreview = false;
                cancelAnimationFrame(animationID);

                const movedBy = currentTranslate - prevTranslate;
                const threshold = activeContainer.clientWidth / 4;

                if (movedBy < -threshold) {
                    if (previewIndex < slidesState.length - 1) {
                        previewIndex++;
                    } else {
                        previewIndex = 0; // Wrap directly to first image
                    }
                } else if (movedBy > threshold) {
                    if (previewIndex > 0) {
                        previewIndex--;
                    } else {
                        previewIndex = slidesState.length - 1; // Wrap directly to last image
                    }
                }

                updateTransform();
                restartPreviewLoop();
            }

            function animation() {
                if (isDraggingPreview) {
                    activeTrack.style.transform = `translateX(${currentTranslate}px)`;
                    animationID = requestAnimationFrame(animation);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', initCMS);
    </script>
</body>
</html>
