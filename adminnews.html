<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Admin Panel | YMCA Munchirai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-blue-900 p-2 rounded-full font-bold text-xl">
                    <i class="fa-solid fa-gear"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">YMCA Munchirai</h1>
                    <p class="text-xs text-blue-200">News Admin Dashboard</p>
                </div>
            </div>
            <nav class="flex items-center space-x-4 text-sm font-medium">
                <a href="news.html" target="_blank" class="bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded transition flex items-center gap-1 text-xs">
                    <i class="fa-solid fa-eye"></i> View Live News Page
                </a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8 flex-grow">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Manage Articles & Events</h2>
                <p class="text-sm text-gray-600">Create, edit, or delete news announcements seamlessly.</p>
            </div>
            <button type="button" onclick="openModalForAdd()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Add New Post
            </button>
        </div>

        <div id="loading-box" class="text-center py-20">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-900 mb-3"></i>
            <p class="text-gray-500 text-sm">Connecting to Firebase Database...</p>
        </div>

        <div id="admin-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>
    </main>

    <div id="newsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl relative my-8">
            <button type="button" onclick="closeNewsModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            <h3 id="modalHeading" class="text-xl font-bold text-blue-900 mb-4">Add New Post</h3>
            
            <form id="newsForm" class="space-y-4">
                <input type="hidden" id="recordId" value="">

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Post Title</label>
                    <input type="text" id="inputTitle" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Youth Leadership Meet">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Date</label>
                        <input type="text" id="inputDate" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. October 15, 2026">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Category Badge</label>
                        <input type="text" id="inputCategory" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Seminar">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Image URL</label>
                    <input type="url" id="inputImage" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://...">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Description</label>
                    <textarea id="inputDescription" rows="4" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Enter post details..."></textarea>
                </div>

                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-700 uppercase">Enable Action Button</span>
                        <input type="checkbox" id="toggleButtonSwitch" class="w-4 h-4 text-blue-600 rounded cursor-pointer" onchange="toggleActionFields()">
                    </div>
                    <div id="actionFieldsContainer" class="space-y-3 hidden pt-2 border-t border-gray-200">
                        <input type="text" id="inputBtnText" class="w-full px-3 py-1.5 border rounded-lg text-sm bg-white" placeholder="Button Name (e.g. Register Now)">
                        <input type="url" id="inputBtnLink" class="w-full px-3 py-1.5 border rounded-lg text-sm bg-white" placeholder="Destination URL (https://...)">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeNewsModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300">Cancel</button>
                    <button type="submit" id="saveBtn" class="px-5 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">Save Post</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-xs mt-12">
        &copy; 2026 YMCA Munchirai. All Rights Reserved.
    </footer>

    <script>
        function openModalForAdd() {
            document.getElementById('modalHeading').innerText = "Add New Post";
            document.getElementById('recordId').value = "";
            document.getElementById('newsForm').reset();
            document.getElementById('toggleButtonSwitch').checked = false;
            toggleActionFields();
            document.getElementById('newsModal').classList.replace('hidden', 'flex');
        }
        function closeNewsModal() {
            document.getElementById('newsModal').classList.replace('flex', 'hidden');
        }
        function toggleActionFields() {
            const isChecked = document.getElementById('toggleButtonSwitch').checked;
            document.getElementById('actionFieldsContainer').classList.toggle('hidden', !isChecked);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.app.js";
        import { getDatabase, ref, get, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCX0_wH5grINMxhCqVnFjiYDj0i_Dw3dIc",
          authDomain: "munchirai-ymca-12de8.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-12de8-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-12de8",
          storageBucket: "munchirai-ymca-12de8.firebasestorage.app",
          messagingSenderId: "890981851605",
          appId: "1:890981851605:web:619a6fa847f309a87cdd5c",
          measurementId: "G-PN7S9DWCMC"
        };

        const db = getDatabase(initializeApp(firebaseConfig));
        const adminGrid = document.getElementById('admin-grid');
        const loadingBox = document.getElementById('loading-box');

        async function loadAdminData() {
            try {
                const snapshot = await get(ref(db, 'news'));
                loadingBox.style.display = 'none';
                adminGrid.classList.remove('hidden');
                adminGrid.innerHTML = '';

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    Object.keys(data).reverse().forEach(id => {
                        const item = data[id];
                        const card = document.createElement('div');
                        card.className = "bg-white rounded-xl shadow-md overflow-hidden border border-gray-200 flex flex-col justify-between";
                        card.innerHTML = `
                            <div>
                                <div class="h-40 bg-gray-200 relative">
                                    <img src="${item.image}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
                                    <span class="absolute top-2 right-2 bg-black bg-opacity-60 text-white text-[10px] px-2 py-1 rounded">${item.category}</span>
                                </div>
                                <div class="p-4">
                                    <p class="text-xs text-gray-500 mb-1"><i class="fa-solid fa-calendar-days mr-1"></i>${item.date}</p>
                                    <h3 class="font-bold text-gray-900 text-base mb-2 line-clamp-1">${item.title}</h3>
                                    <p class="text-gray-600 text-xs line-clamp-2">${item.description}</p>
                                </div>
                            </div>
                            <div class="p-4 bg-gray-50 border-t flex justify-between items-center">
                                <button onclick="window.triggerEdit('${id}', '${encodeURIComponent(item.title)}', '${encodeURIComponent(item.date)}', '${encodeURIComponent(item.category)}', '${encodeURIComponent(item.image)}', '${encodeURIComponent(item.description)}', ${item.showButton ? true : false}, '${encodeURIComponent(item.btnText || '')}', '${encodeURIComponent(item.btnLink || '')}')" class="text-blue-600 hover:text-blue-800 text-xs font-semibold flex items-center gap-1">
                                    <i class="fa-solid fa-pen"></i> Edit
                                </button>
                                <button onclick="window.triggerDelete('${id}')" class="text-red-600 hover:text-red-800 text-xs font-semibold flex items-center gap-1">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </div>
                        `;
                        adminGrid.appendChild(card);
                    });
                } else {
                    adminGrid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10 bg-white rounded-xl border border-dashed">No articles found in database. Click 'Add New Post'.</p>`;
                }
            } catch (err) {
                loadingBox.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 p-5 rounded-xl text-left max-w-lg mx-auto shadow-sm">
                    <p class="font-bold text-base mb-1"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Database Error</p>
                    <p class="text-xs font-mono bg-red-100 p-2 rounded mb-2">${err.message}</p>
                    <p class="text-xs">👉 Check your Firebase Console Realtime Database Rules.</p>
                </div>`;
            }
        }

        document.getElementById('newsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            const id = document.getElementById('recordId').value;
            const newsPayload = {
                title: document.getElementById('inputTitle').value.trim(),
                date: document.getElementById('inputDate').value.trim(),
                category: document.getElementById('inputCategory').value.trim(),
                image: document.getElementById('inputImage').value.trim(),
                description: document.getElementById('inputDescription').value.trim(),
                showButton: document.getElementById('toggleButtonSwitch').checked,
                btnText: document.getElementById('inputBtnText').value.trim(),
                btnLink: document.getElementById('inputBtnLink').value.trim()
            };

            try {
                if (id) {
                    await update(ref(db, 'news/' + id), newsPayload);
                } else {
                    const newRef = push(ref(db, 'news'));
                    await set(newRef, newsPayload);
                }
                closeNewsModal();
                await loadAdminData();
            } catch (err) {
                alert("Operation failed: " + err.message);
            } finally {
                saveBtn.innerText = "Save Post";
                saveBtn.disabled = false;
            }
        });

        window.triggerDelete = async function(id) {
            if (confirm("Are you sure you want to delete this post?")) {
                try {
                    await remove(ref(db, 'news/' + id));
                    await loadAdminData();
                } catch (err) {
                    alert("Delete failed: " + err.message);
                }
            }
        }

        window.triggerEdit = function(id, title, date, category, image, description, showButton, btnText, btnLink) {
            document.getElementById('modalHeading').innerText = "Edit Post";
            document.getElementById('recordId').value = id;
            document.getElementById('inputTitle').value = decodeURIComponent(title);
            document.getElementById('inputDate').value = decodeURIComponent(date);
            document.getElementById('inputCategory').value = decodeURIComponent(category);
            document.getElementById('inputImage').value = decodeURIComponent(image);
            document.getElementById('inputDescription').value = decodeURIComponent(description);
            
            const toggle = document.getElementById('toggleButtonSwitch');
            toggle.checked = showButton;
            toggleActionFields();

            document.getElementById('inputBtnText').value = decodeURIComponent(btnText);
            document.getElementById('inputBtnLink').value = decodeURIComponent(btnLink);
            document.getElementById('newsModal').classList.replace('hidden', 'flex');
        }

        loadAdminData();
    </script>
</body>
</html>
