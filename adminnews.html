<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>News Admin Panel | YMCA Munchirai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="bg-blue-600 text-white p-2 rounded-lg text-sm">
                    <i class="fa-solid fa-gauge-high"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-tight">YMCA Munchirai</h1>
                    <p class="text-[10px] text-slate-400">Admin Control Center</p>
                </div>
            </div>
            <nav class="flex items-center space-x-2">
                <a href="news.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5 border border-slate-700">
                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> Live Site
                </a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
            <div>
                <h2 class="text-xl font-bold text-slate-900 tracking-tight">News Announcements</h2>
                <p class="text-xs text-slate-500">Publish and manage updates visible to users.</p>
            </div>
            <button type="button" onclick="openModalForAdd()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-sm transition flex items-center justify-center gap-2 active:scale-95">
                <i class="fa-solid fa-plus"></i> Add New Post
            </button>
        </div>

        <div id="loading-box" class="text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-600 mb-2"></i>
            <p class="text-slate-500 text-xs font-medium">Syncing database records...</p>
        </div>

        <div id="admin-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 hidden"></div>
    </main>

    <!-- Modal Form -->
    <div id="newsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-3 z-50 overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl relative my-auto border border-slate-100">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
                <h3 id="modalHeading" class="text-base font-bold text-slate-900">Add New Post</h3>
                <button type="button" onclick="closeNewsModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200">&times;</button>
            </div>
            
            <form id="newsForm" class="space-y-3.5">
                <input type="hidden" id="recordId" value="">

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Post Title</label>
                    <input type="text" id="inputTitle" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none transition" placeholder="e.g. Youth Leadership Meet">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Date</label>
                        <!-- Changed input type to 'date' to trigger the calendar picker popup -->
                        <input type="date" id="inputDate" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Category</label>
                        <input type="text" id="inputCategory" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none transition" placeholder="e.g. Seminar">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Image URL (Google Drive or Direct Link)</label>
                    <input type="url" id="inputImage" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none transition" placeholder="Paste Google Drive link or image URL...">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Description</label>
                    <textarea id="inputDescription" rows="3" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none transition" placeholder="Enter post summary..."></textarea>
                </div>

                <!-- Modern Sliding Toggle Action Button Section -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-bold text-slate-700 uppercase tracking-wider">Enable Action Button</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggleButtonSwitch" class="sr-only peer" onchange="toggleActionFields()">
                            <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                    <div id="actionFieldsContainer" class="space-y-2.5 hidden pt-2 border-t border-slate-200">
                        <input type="text" id="inputBtnText" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="Button Label (e.g. Register Now)">
                        <input type="url" id="inputBtnLink" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="Destination Link (https://...)">
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-2.5 pt-2">
                    <button type="button" onclick="closeNewsModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-200 transition">Cancel</button>
                    <button type="submit" id="saveBtn" class="px-5 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700 shadow-sm transition">Save Post</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-white border-t border-slate-200 text-slate-400 py-4 text-center text-[11px] mt-auto">
        &copy; 2026 YMCA Munchirai. System Panel v2.2
    </footer>

    <script>
        const DB_URL = "https://munchirai-ymca-12de8-default-rtdb.firebaseio.com/news";

        function formatImageURL(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
                let idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (idMatch && idMatch[1]) {
                    return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
                }
            }
            return url;
        }

        // Helper to format date nicely for display (e.g. 2026-06-15 to Jun 15, 2026)
        function displayFriendlyDate(dateStr) {
            if (!dateStr) return '';
            // If it's already in YYYY-MM-DD format from the calendar picker:
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
                if (!isNaN(dateObj)) {
                    return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                }
            }
            return dateStr;
        }

        function openModalForAdd() {
            document.getElementById('modalHeading').innerText = "Add New Post";
            document.getElementById('recordId').value = "";
            document.getElementById('newsForm').reset();
            
            // Default date picker to today's date in YYYY-MM-DD format
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inputDate').value = today;

            document.getElementById('toggleButtonSwitch').checked = false;
            toggleActionFields();
            document.getElementById('newsModal').classList.replace('hidden', 'flex');
        }

        function closeNewsModal() {
            document.getElementById('newsModal').classList.replace('flex', 'hidden');
        }

        function toggleActionFields() {
            const isChecked = document.getElementById('toggleButtonSwitch').checked;
            const container = document.getElementById('actionFieldsContainer');
            if (isChecked) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
                document.getElementById('inputBtnText').value = '';
                document.getElementById('inputBtnLink').value = '';
            }
        }

        async function loadAdminData() {
            const loadingBox = document.getElementById('loading-box');
            const adminGrid = document.getElementById('admin-grid');

            try {
                const response = await fetch(DB_URL + ".json");
                const data = await response.json();
                
                loadingBox.style.display = 'none';
                adminGrid.classList.remove('hidden');
                adminGrid.innerHTML = '';

                if (data) {
                    Object.keys(data).reverse().forEach(id => {
                        const item = data[id];
                        const processedImg = formatImageURL(item.image);
                        const friendlyDate = displayFriendlyDate(item.date);
                        
                        const card = document.createElement('div');
                        card.className = "bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden flex flex-col justify-between";
                        card.innerHTML = `
                            <div>
                                <div class="h-36 bg-slate-100 relative">
                                    <img src="${processedImg}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
                                    <span class="absolute top-2.5 right-2.5 bg-slate-900/75 backdrop-blur-xs text-white text-[10px] font-semibold px-2.5 py-1 rounded-md">${item.category}</span>
                                </div>
                                <div class="p-3.5">
                                    <p class="text-[11px] text-slate-400 font-medium mb-1"><i class="fa-regular fa-calendar mr-1"></i>${friendlyDate}</p>
                                    <h3 class="font-bold text-slate-900 text-sm mb-1.5 line-clamp-1">${item.title}</h3>
                                    <p class="text-slate-600 text-xs line-clamp-2 leading-relaxed">${item.description}</p>
                                </div>
                            </div>
                            <div class="p-3 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
                                <button onclick="triggerEdit('${id}', '${encodeURIComponent(item.title)}', '${encodeURIComponent(item.date)}', '${encodeURIComponent(item.category)}', '${encodeURIComponent(item.image)}', '${encodeURIComponent(item.description)}', ${item.showButton ? true : false}, '${encodeURIComponent(item.btnText || '')}', '${encodeURIComponent(item.btnLink || '')}')" class="text-blue-600 hover:text-blue-700 text-xs font-semibold flex items-center gap-1.5 px-2.5 py-1 rounded-lg hover:bg-blue-50 transition">
                                    <i class="fa-solid fa-pen-to-square"></i> Edit
                                </button>
                                <button onclick="triggerDelete('${id}')" class="text-rose-600 hover:text-rose-700 text-xs font-semibold flex items-center gap-1.5 px-2.5 py-1 rounded-lg hover:bg-rose-50 transition">
                                    <i class="fa-regular fa-trash-can"></i> Delete
                                </button>
                            </div>
                        `;
                        adminGrid.appendChild(card);
                    });
                } else {
                    adminGrid.innerHTML = `<div class="col-span-full text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300"><p class="text-slate-400 text-xs">No records available. Tap 'Add New Post' to start.</p></div>`;
                }
            } catch (err) {
                loadingBox.innerHTML = `<p class="text-rose-500 text-xs font-medium">Connection error: ${err.message}</p>`;
            }
        }

        document.getElementById('newsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            const id = document.getElementById('recordId').value;
            const newsPayload = {
                title: document.getElementById('inputTitle').value.trim(),
                date: document.getElementById('inputDate').value.trim(),
                category: document.getElementById('inputCategory').value.trim(),
                image: document.getElementById('inputImage').value.trim(),
                description: document.getElementById('inputDescription').value.trim(),
                showButton: document.getElementById('toggleButtonSwitch').checked,
                btnText: document.getElementById('inputBtnText').value.trim(),
                btnLink: document.getElementById('inputBtnLink').value.trim()
            };

            try {
                if (id) {
                    await fetch(`${DB_URL}/${id}.json`, { method: 'PUT', body: JSON.stringify(newsPayload) });
                } else {
                    await fetch(DB_URL + ".json", { method: 'POST', body: JSON.stringify(newsPayload) });
                }
                closeNewsModal();
                loadAdminData();
            } catch (err) {
                alert("Operation failed: " + err.message);
            } finally {
                saveBtn.innerText = "Save Post";
                saveBtn.disabled = false;
            }
        });

        window.triggerDelete = async function(id) {
            if (confirm("Are you sure you want to remove this entry?")) {
                try {
                    await fetch(`${DB_URL}/${id}.json`, { method: 'DELETE' });
                    loadAdminData();
                } catch (err) {
                    alert("Deletion failed: " + err.message);
                }
            }
        }

        window.triggerEdit = function(id, title, date, category, image, description, showButton, btnText, btnLink) {
            document.getElementById('modalHeading').innerText = "Edit Record";
            document.getElementById('recordId').value = id;
            document.getElementById('inputTitle').value = decodeURIComponent(title);
            document.getElementById('inputDate').value = decodeURIComponent(date);
            document.getElementById('inputCategory').value = decodeURIComponent(category);
            document.getElementById('inputImage').value = decodeURIComponent(image);
            document.getElementById('inputDescription').value = decodeURIComponent(description);
            
            const toggle = document.getElementById('toggleButtonSwitch');
            toggle.checked = (showButton === true || showButton === 'true');
            toggleActionFields();

            document.getElementById('inputBtnText').value = decodeURIComponent(btnText);
            document.getElementById('inputBtnLink').value = decodeURIComponent(btnLink);
            document.getElementById('newsModal').classList.replace('hidden', 'flex');
        }

        loadAdminData();
    </script>
</body>
</html>
