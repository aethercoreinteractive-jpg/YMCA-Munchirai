<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Admin Panel | YMCA Munchirai</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-blue-900 p-2 rounded-full font-bold text-xl">
                    <i class="fa-solid fa-gear"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">YMCA Munchirai</h1>
                    <p class="text-xs text-blue-200">News Admin Dashboard</p>
                </div>
            </div>
            <nav class="flex items-center space-x-4 text-sm font-medium">
                <a href="news.html" target="_blank" class="bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded transition flex items-center gap-1">
                    <i class="fa-solid fa-eye text-xs"></i> View Live News Page
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Section -->
    <main class="container mx-auto px-6 py-8 flex-grow">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Manage Articles & Events</h2>
                <p class="text-sm text-gray-600">Create, edit, delete news cards, and configure custom dynamic action buttons.</p>
            </div>
            <button type="button" onclick="openModalForAdd()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Add New Post
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading-box" class="text-center py-20">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-900 mb-3"></i>
            <p class="text-gray-500 text-sm">Connecting to Firebase Realtime Database...</p>
        </div>

        <!-- Cards Container Grid -->
        <div id="admin-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>
    </main>

    <!-- Modal Popup Form (Add / Edit) -->
    <div id="newsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl relative my-8">
            <button type="button" onclick="closeNewsModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            <h3 id="modalHeading" class="text-xl font-bold text-blue-900 mb-4">Add New Post</h3>
            
            <form id="newsForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="recordId" value="">

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Post Title</label>
                    <input type="text" id="inputTitle" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="e.g. Youth Leadership Meet">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Date</label>
                        <input type="text" id="inputDate" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="e.g. October 15, 2026">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Category Badge</label>
                        <input type="text" id="inputCategory" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="e.g. Seminar">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Image Link (Direct / Drive)</label>
                    <input type="url" id="inputImage" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="https://...">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Description / Content</label>
                    <textarea id="inputDescription" rows="4" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="Enter details..."></textarea>
                </div>

                <!-- Custom Action Button Controller Panel -->
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-700 uppercase">Enable Custom Action Button</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggleButtonSwitch" class="sr-only peer" onchange="toggleActionFields()">
                            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>

                    <div id="actionFieldsContainer" class="space-y-3 hidden pt-2 border-t border-gray-200">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Button Custom Name</label>
                            <input type="text" id="inputBtnText" class="w-full px-3 py-1.5 border rounded-lg text-sm bg-white" placeholder="e.g. Register Now, Donate">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Button Destination URL</label>
                            <input type="url" id="inputBtnLink" class="w-full px-3 py-1.5 border rounded-lg text-sm bg-white" placeholder="https://example.com">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeNewsModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition">Save to Database</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-xs mt-12">
        &copy; 2026 YMCA Munchirai. All Rights Reserved.
    </footer>

    <!-- Global Modal & UI Logic Script -->
    <script>
        function openModalForAdd() {
            document.getElementById('modalHeading').innerText = "Add New Post";
            document.getElementById('recordId').value = "";
            document.getElementById('newsForm').reset();
            document.getElementById('toggleButtonSwitch').checked = false;
            toggleActionFields();
            
            const modal = document.getElementById('newsModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeNewsModal() {
            const modal = document.getElementById('newsModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function toggleActionFields() {
            const isChecked = document.getElementById('toggleButtonSwitch').checked;
            const container = document.getElementById('actionFieldsContainer');
            if (isChecked) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }
    </script>

    <!-- Firebase Realtime Database Integration Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.app.js";
        import { getDatabase, ref, get, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const adminGrid = document.getElementById('admin-grid');
        const loadingBox = document.getElementById('loading-box');

        // Fetch & Display Records
        async function loadAdminData() {
            try {
                const dbRef = ref(db, 'news');
                const snapshot = await get(dbRef);

                loadingBox.style.display = 'none';
                adminGrid.classList.remove('hidden');
                adminGrid.innerHTML = '';

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    
                    Object.keys(data).forEach(id => {
                        const item = data[id];
                        const img = item.image || 'https://via.placeholder.com/600x400?text=No+Image';

                        const card = document.createElement('div');
                        card.className = "bg-white rounded-xl shadow-md overflow-hidden border border-gray-200 flex flex-col justify-between";
                        
                        card.innerHTML = `
                            <div>
                                <div class="h-40 overflow-hidden bg-gray-200 relative">
                                    <img src="${img}" alt="Preview" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/600x400?text=Broken+Link'">
                                    <span class="absolute top-2 right-2 bg-black bg-opacity-60 text-white text-[10px] px-2 py-1 rounded">${item.category || 'General'}</span>
                                </div>
                                <div class="p-4">
                                    <p class="text-xs text-gray-500 mb-1"><i class="fa-solid fa-calendar-days mr-1"></i> ${item.date || 'Recent'}</p>
                                    <h3 class="font-bold text-gray-900 text-base mb-2 line-clamp-1">${item.title}</h3>
                                    <p class="text-gray-600 text-xs line-clamp-2">${item.description}</p>
                                    ${item.showButton ? `<div class="mt-2 text-[11px] text-blue-600 font-medium"><i class="fa-solid fa-link"></i> Button: "${item.btnText}"</div>` : ''}
                                </div>
                            </div>
                            <div class="p-4 bg-gray-50 border-t border-gray-100 flex justify-between items-center">
                                <button type="button" onclick="window.triggerEdit('${id}', '${encodeURIComponent(item.title)}', '${encodeURIComponent(item.date)}', '${encodeURIComponent(item.category)}', '${encodeURIComponent(item.image)}', '${encodeURIComponent(item.description)}', ${item.showButton ? true : false}, '${encodeURIComponent(item.btnText || '')}', '${encodeURIComponent(item.btnLink || '')}')" class="text-blue-600 hover:text-blue-800 text-xs font-semibold flex items-center gap-1">
                                    <i class="fa-solid fa-pen-to-square"></i> Edit
                                </button>
                                <button type="button" onclick="window.triggerDelete('${id}')" class="text-red-600 hover:text-red-800 text-xs font-semibold flex items-center gap-1">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </div>
                        `;
                        adminGrid.appendChild(card);
                    });
                } else {
                    adminGrid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10 bg-white rounded-xl border border-dashed border-gray-300">No database articles found. Click 'Add New Post' above.</p>`;
                }
            } catch (err) {
                console.error(err);
                loadingBox.innerHTML = `<p class="text-red-500 text-sm">Failed to connect to Firebase database.</p>`;
            }
        }

        // Form Submit Handler (Create or Update)
        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const id = document.getElementById('recordId').value;
            const title = document.getElementById('inputTitle').value;
            const date = document.getElementById('inputDate').value;
            const category = document.getElementById('inputCategory').value;
            const image = document.getElementById('inputImage').value;
            const description = document.getElementById('inputDescription').value;
            
            const showButton = document.getElementById('toggleButtonSwitch').checked;
            const btnText = document.getElementById('inputBtnText').value;
            const btnLink = document.getElementById('inputBtnLink').value;

            const payload = { title, date, category, image, description, showButton, btnText, btnLink };

            try {
                if (id) {
                    await update(ref(db, 'news/' + id), payload);
                } else {
                    const newRef = push(ref(db, 'news'));
                    await set(newRef, payload);
                }
                closeNewsModal();
                loadAdminData();
            } catch (err) {
                alert("Operation failed: " + err.message);
            }
        }

        // Delete Item Handler
        window.triggerDelete = async function(id) {
            if (confirm("Are you sure you want to delete this news article?")) {
                try {
                    await remove(ref(db, 'news/' + id));
                    loadAdminData();
                } catch (err) {
                    alert("Delete failed: " + err.message);
                }
            }
        }

        // Prepare Edit Mode
        window.triggerEdit = function(id, title, date, category, image, description, showButton, btnText, btnLink) {
            document.getElementById('modalHeading').innerText = "Edit Post Details";
            document.getElementById('recordId').value = id;
            document.getElementById('inputTitle').value = decodeURIComponent(title);
            document.getElementById('inputDate').value = decodeURIComponent(date);
            document.getElementById('inputCategory').value = decodeURIComponent(category);
            document.getElementById('inputImage').value = decodeURIComponent(image);
            document.getElementById('inputDescription').value = decodeURIComponent(description);

            const toggle = document.getElementById('toggleButtonSwitch');
            toggle.checked = showButton;
            toggleActionFields();

            document.getElementById('inputBtnText').value = decodeURIComponent(btnText || '');
            document.getElementById('inputBtnLink').value = decodeURIComponent(btnLink || '');

            const modal = document.getElementById('newsModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // Trigger initial data load
        loadAdminData();
    </script>
</body>
</html>
