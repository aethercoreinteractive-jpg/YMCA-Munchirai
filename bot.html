<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MY Food Products - AI Assistant & Navigator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes floatAnime {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        @keyframes animeBlink {
            0%, 85%, 100% { transform: scaleY(1); }
            90% { transform: scaleY(0.1); }
        }
        @keyframes animeTalk {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.8); }
        }
        .animate-float { animation: floatAnime 3s ease-in-out infinite; }
        .anime-eyes { animation: animeBlink 4s infinite; transform-origin: center; }
        .is-talking .anime-mouth { animation: animeTalk 0.2s ease-in-out infinite; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* Chat bubble interactive link styling */
        .chat-action-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: #22d3ee;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .chat-action-link:hover {
            background: rgba(6, 182, 212, 0.3);
            border-color: rgba(6, 182, 212, 0.8);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-slate-950 text-white h-[100dvh] w-screen overflow-hidden flex flex-col justify-between select-none font-sans m-0 p-0 box-border">

    <!-- Top Status Bar Branded for MY Food Products -->
    <header class="w-full px-4 py-2.5 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex justify-between items-center z-10 shrink-0">
        <span class="text-xs font-semibold tracking-wide text-cyan-400 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> MY Food AI Navigator & Support
        </span>
        <span class="text-xs font-mono px-2.5 py-0.5 bg-cyan-500/10 text-cyan-300 border border-cyan-500/20 rounded-full">Online</span>
    </header>

    <!-- Main Workspace Area with Persistent Chat Log -->
    <main class="flex-1 flex flex-col justify-end p-3 relative overflow-hidden">
        <div id="chat-log" class="w-full flex-1 overflow-y-auto space-y-3 mb-2 pr-1 flex flex-col justify-end">
            <!-- Chat history will load here -->
        </div>
    </main>

    <!-- Floating Draggable Anime Companion Widget -->
    <div id="companion" class="absolute bottom-28 right-4 cursor-grab active:cursor-grabbing z-50 animate-float flex flex-col items-center touch-none">
        
        <!-- High-End Anime SVG Avatar Container -->
        <div id="avatar-container" class="w-16 h-16 bg-gradient-to-b from-slate-900 to-indigo-950 rounded-2xl p-1 shadow-2xl shadow-cyan-500/20 border-2 border-cyan-400/50 flex items-center justify-center relative overflow-hidden">
            <svg viewBox="0 0 100 100" class="w-full h-full">
                <!-- Hair Background Base -->
                <path d="M20,40 Q50,15 80,40 Q90,70 85,90 Q50,95 15,90 Q10,70 20,40 Z" fill="#1e1b4b"/>
                <!-- Face Skin Tone -->
                <path d="M28,35 Q50,25 72,35 Q80,60 72,82 Q50,90 28,82 Q20,60 28,35 Z" fill="#fed7aa"/>
                <!-- Anime Eye Left -->
                <g class="anime-eyes">
                    <ellipse cx="38" cy="55" rx="7" ry="9" fill="#0f172a"/>
                    <ellipse cx="38" cy="56" rx="5" ry="7" fill="#0284c7"/>
                    <circle cx="36" cy="53" r="2" fill="#ffffff"/>
                </g>
                <!-- Anime Eye Right -->
                <g class="anime-eyes">
                    <ellipse cx="62" cy="55" rx="7" ry="9" fill="#0f172a"/>
                    <ellipse cx="62" cy="56" rx="5" ry="7" fill="#0284c7"/>
                    <circle cx="60" cy="53" r="2" fill="#ffffff"/>
                </g>
                <!-- Eyelashes / Eyebrows -->
                <path d="M30,46 Q38,43 46,47" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M54,47 Q62,43 70,46" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
                <!-- Blush -->
                <ellipse cx="32" cy="66" rx="4" ry="2" fill="#fb7185" opacity="0.6"/>
                <ellipse cx="68" cy="66" rx="4" ry="2" fill="#fb7185" opacity="0.6"/>
                <!-- Nose -->
                <circle cx="50" cy="64" r="0.8" fill="#c2410c"/>
                <!-- Mouth -->
                <path id="anime-mouth" class="anime-mouth" d="M45,72 Q50,76 55,72" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round" transform-origin="50 73"/>
                <!-- Front Bangs -->
                <path d="M25,32 Q50,18 75,32 Q65,45 50,38 Q35,45 25,32 Z" fill="#312e81"/>
                <path d="M35,35 Q50,50 42,32 Z" fill="#312e81"/>
                <path d="M65,35 Q50,50 58,32 Z" fill="#312e81"/>
            </svg>
        </div>
    </div>

    <!-- Bottom Controls & Text Input Footer -->
    <footer class="w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-3 flex flex-col gap-2 z-10 shrink-0">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Ask e.g., 'Where is staff registration?' or 'Show Avalose Sweet'" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
            <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-xs font-medium shadow-lg shadow-cyan-600/30">Send</button>
        </form>
        <div class="flex justify-between items-center text-[10px] text-slate-500 px-1">
            <span>Support Line: +91-9943021998</span>
            <button id="clear-chat" class="text-red-400 hover:underline">Clear Chat History</button>
        </div>
    </footer>

    <!-- Smart Knowledge Base & Assistant Script -->
    <script>
        const GROQ_API_KEY = "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";

        const companion = document.getElementById('companion');
        const avatarContainer = document.getElementById('avatar-container');
        const chatLog = document.getElementById('chat-log');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const clearChatBtn = document.getElementById('clear-chat');

        let recognition = null;
        let isAiSpeaking = false;
        let siteDictionary = null; // Will cache aidictionary.html data

        // Load site dictionary configuration dynamically on boot
        async function loadDictionaryData() {
            try {
                const response = await fetch('aidictionary.html');
                if (response.ok) {
                    const text = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    // Extract script text containing AIDictionary object if available, or parse text elements
                    const scriptTag = doc.querySelector('script');
                    if (scriptTag && scriptTag.textContent.includes('AIDictionary')) {
                        // Safely evaluate or extract dictionary data object
                        const evalScript = new Function(scriptTag.textContent + '; return AIDictionary;');
                        siteDictionary = evalScript();
                    }
                }
            } catch (e) {
                console.log("Dictionary auto-load notice:", e);
            }
        }

        // Load chat history from localStorage on startup
        function loadChatHistory() {
            const savedHistory = localStorage.getItem('aria_chat_history');
            if (savedHistory) {
                chatLog.innerHTML = savedHistory;
                chatLog.scrollTop = chatLog.scrollHeight;
            } else {
                appendMessage('Aria', "Hello! I am Aria, your personal guide for MY Food Products. Ask me about our products, store locations, staff registration, or bank details!", false);
            }
        }

        function saveChatHistory() {
            localStorage.setItem('aria_chat_history', chatLog.innerHTML);
        }

        clearChatBtn.addEventListener('click', () => {
            localStorage.removeItem('aria_chat_history');
            chatLog.innerHTML = '';
            appendMessage('Aria', "Chat history cleared. How can I help you navigate today?", true);
        });

        // Append message with support for direct interactive action links
        function appendMessage(sender, htmlContent, save = true) {
            const msgDiv = document.createElement('div');
            const isUser = sender === 'You';
            msgDiv.className = `p-3 rounded-xl max-w-[85%] text-xs ${isUser ? 'bg-cyan-950/80 border border-cyan-800/60 self-end text-cyan-100' : 'bg-slate-900/80 border border-slate-800/80 self-start text-slate-300'}`;
            msgDiv.innerHTML = `<span class="text-[10px] ${isUser ? 'text-cyan-300' : 'text-cyan-400'} font-semibold block mb-1">${sender}</span><div>${htmlContent}</div>`;
            chatLog.appendChild(msgDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
            if (save) {
                saveChatHistory();
            }
        }

        // Text-to-Speech Engine
        function speakAloud(textClean) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                // Strip HTML tags for clean speech synthesis
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = textClean;
                const plainText = tempDiv.textContent || tempDiv.innerText || "";

                const utterance = new SpeechSynthesisUtterance(plainText);
                utterance.rate = 1.0;
                utterance.pitch = 1.2;
                
                utterance.onstart = () => {
                    isAiSpeaking = true;
                    if (recognition) { try { recognition.stop(); } catch(e) {} }
                    avatarContainer.classList.add('is-talking', 'border-red-400');
                };
                utterance.onend = () => {
                    avatarContainer.classList.remove('is-talking', 'border-red-400');
                    setTimeout(() => {
                        isAiSpeaking = false;
                        if (recognition) { try { recognition.start(); } catch(e) {} }
                    }, 500);
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        // Smart Local Intent Engine using Dictionary Data
        function evaluateLocalQuery(query) {
            const q = query.toLowerCase();
            if (!siteDictionary) return null;

            // 1. Check Staff / Employee Registration
            if (q.includes('staff') || q.includes('register') || q.includes('employee') || q.includes('career')) {
                return `You can register as new staff via our career opportunities section. Tap the button below to go straight to the registration page:<br><a href="employeeregistration.html" class="chat-action-link">👉 Tap here for Employee Registration</a>`;
            }

            // 2. Check Staff Login
            if (q.includes('login') || q.includes('signin') || q.includes('staff login')) {
                return `Staff members can log in through the navigation panel option.<br><a href="stafflogin.html" class="chat-action-link">👉 Tap here for Staff Login</a>`;
            }

            // 3. Store / Shop / Products
            if (q.includes('store') || q.includes('shop') || q.includes('buy') || q.includes('product') || q.includes('avalose') || q.includes('puttu')) {
                // If asking about a specific product match
                if (siteDictionary.inventory) {
                    const found = siteDictionary.inventory.find(item => q.includes(item.productName.toLowerCase()) || q.includes(item.category.toLowerCase()));
                    if (found) {
                        return `<strong>${found.productName}</strong> (${found.category})<br>Price: ₹${found.finalPrice} (${found.offerPercentage > 0 ? found.offerPercentage + '% off' : 'Regular'}) | Rating: ★${found.rating}/5<br>${found.description.substring(0, 140)}...<br><a href="mystore.html" class="chat-action-link">🛍️ View in My Store</a>`;
                    }
                }
                return `You can browse all our organic items and make purchases in our store.<br><a href="mystore.html" class="chat-action-link">🛍️ Go to My Store</a>`;
            }

            // 4. Bank Details / Payment
            if (q.includes('bank') || q.includes('payment') || q.includes('pay') || q.includes('account')) {
                return `All bank account and payment details are available on our dedicated information page.<br><a href="bankdetails.html" class="chat-action-link">🏦 View Bank Details</a>`;
            }

            // 5. About Us / Page details
            if (q.includes('about') || q.includes('who') || q.includes('mission')) {
                return `Learn more about our organization, organic values, and charity mission with Munchirai YMCA.<br><a href="aboutus.html" class="chat-action-link">📖 Read About Us</a>`;
            }

            // 6. News / Updates
            if (q.includes('news') || q.includes('update')) {
                return `Check out our latest announcements and updates.<br><a href="news.html" class="chat-action-link">📰 View News & Updates</a>`;
            }

            // 7. Contact
            if (q.includes('contact') || q.includes('phone') || q.includes('call') || q.includes('support')) {
                return `You can reach our primary customer support line directly at <strong>+91-9943021998</strong> or visit our contact page.<br><a href="contact.html" class="chat-action-link">📞 Go to Contact Page</a>`;
            }

            return null;
        }

        // Master Handler
        async function handleUserQuery(promptText) {
            appendMessage('You', promptText);

            // Step 1: Check Local Dictionary Matrix for precise navigation & inventory routing
            const localReply = evaluateLocalQuery(promptText);
            if (localReply) {
                appendMessage('Aria', localReply);
                speakAloud(localReply);
                return;
            }

            // Step 2: Fallback to Groq API for general organic food queries / improvisation
            try {
                const response = "https://api.groq.com/openai/v1/chat/completions";
                const res = await fetch(response, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-20b",
                        messages: [
                            {
                                role: "system",
                                content: "You are Aria, the intelligent assistant for MY Food Products. Direct users clearly using links when requested (e.g. store: mystore.html, staff registration: employeeregistration.html, bank details: bankdetails.html). Profits go toward Munchirai YMCA charity initiatives."
                            },
                            { role: "user", content: promptText }
                        ]
                    })
                });

                const data = await res.json();
                if (data.choices && data.choices[0].message.content) {
                    let aiReply = data.choices[0].message.content.trim();
                    // Append direct store link context if text mentions store
                    if (aiReply.toLowerCase().includes('store') || aiReply.toLowerCase().includes('shop')) {
                        aiReply += `<br><a href="mystore.html" class="chat-action-link">🛍️ Visit My Store Now</a>`;
                    }
                    appendMessage('Aria', aiReply);
                    speakAloud(aiReply);
                } else {
                    const fallback = `You can check our store page or contact support at +91-9943021998.<br><a href="mystore.html" class="chat-action-link">🛍️ Go to My Store</a>`;
                    appendMessage('Aria', fallback);
                    speakAloud(fallback);
                }
            } catch (err) {
                const netMsg = `I'm having trouble reaching the network server right now. You can call support at +91-9943021998.<br><a href="mystore.html" class="chat-action-link">🛍️ Open My Store</a>`;
                appendMessage('Aria', netMsg);
                speakAloud(netMsg);
            }
        }

        // Initialization
        window.addEventListener('load', async () => {
            await loadDictionaryData();
            loadChatHistory();
            startContinuousListening();
        });

        // Voice Recognition Support
        function startContinuousListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    if (isAiSpeaking) return;
                    const speechToText = event.results[event.results.length - 1][0].transcript.trim();
                    if (speechToText) handleUserQuery(speechToText);
                };

                recognition.onerror = () => {
                    if (!isAiSpeaking) setTimeout(() => { try { recognition.start(); } catch(e){} }, 1000);
                };
                recognition.onend = () => {
                    if (!isAiSpeaking) try { recognition.start(); } catch(e){}
                };
                try { recognition.start(); } catch(e){}
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if(!text) return;
            userInput.value = '';
            handleUserQuery(text);
        });

        // Touch & Drag Companion Widget
        let startX, startY, initialX, initialY, isDragging = false;
        companion.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            initialX = companion.offsetLeft;
            initialY = companion.offsetTop;
            companion.style.bottom = 'auto';
            companion.style.right = 'auto';
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            companion.style.left = `${Math.max(10, Math.min(window.innerWidth - 80, initialX + dx))}px`;
            companion.style.top = `${Math.max(40, Math.min(window.innerHeight - 160, initialY + dy))}px`;
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });
    </script>
</body>
</html>
