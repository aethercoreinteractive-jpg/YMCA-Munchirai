<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MY Food Products - AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        .chat-action-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .chat-action-link:hover {
            background: rgba(245, 158, 11, 0.2);
            border-color: rgba(245, 158, 11, 0.6);
            transform: translateY(-1px);
        }

        /* Desktop specific layout container constraints */
        @media (min-width: 768px) {
            .app-container {
                max-width: 768px;
                margin: 0 auto;
                height: 100vh;
                border-left: 1px solid rgba(30, 41, 59, 0.8);
                border-right: 1px solid rgba(30, 41, 59, 0.8);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            }
        }
    </style>
</head>
<body class="bg-[#020617] text-slate-100 h-[100dvh] w-screen overflow-hidden flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950 m-0 p-0 box-border">

    <div class="app-container w-full h-full flex flex-col justify-between relative overflow-hidden">

        <!-- Professional Header matching bankdetails.html styling -->
        <header class="w-full px-4 py-3.5 bg-slate-900/90 backdrop-blur-xl border-b border-slate-800/80 flex justify-between items-center z-10 shrink-0 shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 font-extrabold flex items-center justify-center text-xs shadow-inner flex-shrink-0">
                    <i class="fa-solid fa-robot text-amber-400"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs sm:text-sm font-bold tracking-tight text-white flex items-center gap-2">
                        MY Food AI Assistant
                    </span>
                    <span class="text-[10px] text-slate-400 font-medium">Always online & ready to help</span>
                </div>
            </div>
            <button id="clear-chat-top" class="text-xs font-semibold px-3 py-1.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl hover:bg-red-500/20 transition-all flex items-center gap-1.5 cursor-pointer active:scale-95 shadow-sm">
                <i class="fa-solid fa-trash-can text-[11px]"></i> Clear Chat
            </button>
        </header>

        <!-- Main Chat Workspace -->
        <main class="flex-1 w-full relative overflow-hidden flex flex-col p-3 max-w-3xl mx-auto">
            <div id="chat-log" class="absolute inset-0 overflow-y-auto p-4 space-y-4 flex flex-col pb-28 sm:pb-32"></div>
        </main>

        <!-- Inbuilt Custom Confirmation Modal -->
        <div id="custom-confirm-modal" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-xs w-full shadow-2xl flex flex-col gap-4 text-center">
                <div class="w-12 h-12 bg-red-500/10 text-red-400 rounded-2xl flex items-center justify-center mx-auto text-lg border border-red-500/20 shadow-inner">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div class="flex flex-col gap-1">
                    <h3 class="text-sm font-extrabold text-white">Delete Chat History</h3>
                    <p class="text-xs text-slate-400 font-light">Are you sure you want to delete all chat records?</p>
                </div>
                <div class="flex gap-2 pt-1">
                    <button id="confirm-cancel" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-semibold transition-all cursor-pointer">Cancel</button>
                    <button id="confirm-ok" class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-red-600/30 transition-all cursor-pointer">Delete</button>
                </div>
            </div>
        </div>

        <!-- Professional Input Footer with Blubi Responsive Sizing (Cleaned text box area) -->
        <footer class="w-full bg-slate-900/95 backdrop-blur-xl border-t border-slate-800/80 p-3.5 sm:p-4 flex flex-col gap-2 z-20 shrink-0 shadow-2xl relative">
            
            <!-- Blubi Transparent Layer Overlay -->
            <div class="absolute -top-20 sm:-top-28 left-4 z-30 pointer-events-none flex items-center">
                <img id="blubi-avatar" src="blubiani1.gif" alt="Blubi Avatar" class="w-20 h-20 sm:w-28 sm:h-28 object-contain drop-shadow-[0_10px_15px_rgba(0,0,0,0.95)]">
            </div>

            <form id="chat-form" class="flex gap-2 max-w-3xl w-full mx-auto relative pt-1 pl-18 sm:pl-28">
                <input type="text" id="user-input" placeholder="Ask anything about MY Food Products..." class="flex-1 bg-slate-950/80 border border-slate-800 rounded-2xl px-4 py-3 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500/60 focus:ring-1 focus:ring-amber-500/30 transition shadow-inner">
                <button type="submit" class="bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 px-5 py-3 rounded-2xl text-xs sm:text-sm font-bold shadow-lg shadow-amber-500/20 transition cursor-pointer flex items-center gap-1.5 flex-shrink-0">
                    <span>Send</span> <i class="fa-solid fa-paper-plane text-[10px]"></i>
                </button>
            </form>
        </footer>

    </div>

    <!-- Assistant Script Engine -->
    <script>
        const chatLog = document.getElementById('chat-log');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const clearChatTopBtn = document.getElementById('clear-chat-top');
        const customConfirmModal = document.getElementById('custom-confirm-modal');
        const confirmOkBtn = document.getElementById('confirm-ok');
        const confirmCancelBtn = document.getElementById('confirm-cancel');
        const blubiAvatar = document.getElementById('blubi-avatar');

        let recognition = null;
        let isAiSpeaking = false;
        let siteDictionary = null;
        let idleInterval = null;

        const dynamicGreetings = [
            "Hey! What's on your mind today? Anything about our store or just want to chat?",
            "Hi there! How's your day going? Let me know if you need help finding anything here.",
            "Hey! I'm Aria. What can I help you out with right now?"
        ];

        // Blubi State Handlers
        function setBlubiState(state) {
            if (state === 'thinking') {
                blubiAvatar.src = 'blubi thinking.gif';
            } else if (state === 'speaking') {
                blubiAvatar.src = 'blubi speaking.gif';
            } else if (state === 'idle') {
                const idleGifs = ['blubiani1.gif', 'blubiani2.gif'];
                const randomGif = idleGifs[Math.floor(Math.random() * idleGifs.length)];
                blubiAvatar.src = randomGif;
            }
        }

        function startIdleLoop() {
            if (idleInterval) clearInterval(idleInterval);
            idleInterval = setInterval(() => {
                if (!isAiSpeaking && !userInput.value.trim()) {
                    setBlubiState('idle');
                }
            }, 6000);
        }

        userInput.addEventListener('input', () => {
            if (userInput.value.trim().length > 0) {
                setBlubiState('thinking');
            } else {
                setBlubiState('idle');
            }
        });

        async function loadDictionaryData() {
            try {
                const response = await fetch('aidictionary.html');
                if (response.ok) {
                    const text = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    const scriptTag = doc.querySelector('script');
                    if (scriptTag && scriptTag.textContent.includes('AIDictionary')) {
                        const evalScript = new Function(scriptTag.textContent + '; return AIDictionary;');
                        siteDictionary = evalScript();
                    }
                }
            } catch (e) {}
        }

        function loadChatHistory() {
            const savedHistory = localStorage.getItem('aria_chat_history');
            if (savedHistory) {
                chatLog.innerHTML = savedHistory;
                chatLog.scrollTop = chatLog.scrollHeight;
            } else {
                const randomGreeting = dynamicGreetings[Math.floor(Math.random() * dynamicGreetings.length)];
                appendMessage('Aria', randomGreeting, false);
            }
            setBlubiState('idle');
            startIdleLoop();
        }

        function saveChatHistory() {
            localStorage.setItem('aria_chat_history', chatLog.innerHTML);
        }

        clearChatTopBtn.addEventListener('click', () => customConfirmModal.classList.remove('hidden'));
        confirmCancelBtn.addEventListener('click', () => customConfirmModal.classList.add('hidden'));
        confirmOkBtn.addEventListener('click', () => {
            customConfirmModal.classList.add('hidden');
            localStorage.removeItem('aria_chat_history');
            chatLog.innerHTML = '';
            appendMessage('Aria', "Cleared everything out. What should we talk about now?", true);
        });

        function appendMessage(sender, htmlContent, save = true) {
            const msgDiv = document.createElement('div');
            const isUser = sender === 'You';
            msgDiv.className = `p-4 rounded-2xl max-w-[85%] text-xs sm:text-sm shadow-md ${isUser ? 'bg-amber-500/10 border border-amber-500/30 self-end text-amber-100 font-medium' : 'bg-slate-900 border border-slate-800/80 self-start text-slate-300'}`;
            msgDiv.innerHTML = `<span class="text-[10px] sm:text-xs ${isUser ? 'text-amber-400' : 'text-amber-500'} font-extrabold block mb-1.5 uppercase tracking-wider">${sender}</span><div class="leading-relaxed">${htmlContent}</div>`;
            chatLog.appendChild(msgDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
            if (save) saveChatHistory();
        }

        function speakAloud(textClean) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = textClean;
                const plainText = tempDiv.textContent || tempDiv.innerText || "";
                const utterance = new SpeechSynthesisUtterance(plainText);
                utterance.rate = 1.0;
                utterance.pitch = 1.1;
                
                utterance.onstart = () => {
                    isAiSpeaking = true;
                    setBlubiState('speaking');
                    if (recognition) { try { recognition.stop(); } catch(e) {} }
                };
                utterance.onend = () => {
                    isAiSpeaking = false;
                    setBlubiState('idle');
                    setTimeout(() => {
                        if (recognition) { try { recognition.start(); } catch(e) {} }
                    }, 400);
                };
                window.speechSynthesis.speak(utterance);
            }
        }

        function evaluateQuery(query) {
            const q = query.toLowerCase().trim();

            const casualHIs = [
                "Hey there! Good to hear from you. What's on your mind?",
                "Hello! How's it going today? Let me know if you need anything.",
                "Hey! Always nice chatting with you. What are you up to?"
            ];
            const casualHowAreYou = [
                "I'm doing really well, just hanging out in the background helping out! How are things with you?",
                "All good on my end, keeping things running smoothly. How's your day going?",
                "Pretty great, thanks for asking! What about you, how are you doing?"
            ];
            const casualWhoAreYou = [
                "I'm Aria, your virtual companion here at MY Food Products. I'm basically here to chat, help you navigate the site, or find whatever you need!",
                "I'm Aria — part assistant, part conversational partner. I help people find products, look up info, or just have a normal chat.",
                "You can call me Aria! I'm the AI assistant for MY Food Products, always here to keep you company and help out."
            ];

            if (['hi', 'hello', 'hey', 'sup', 'greetings', 'yo'].some(word => q === word || q.startsWith(word + ' '))) {
                return casualHIs[Math.floor(Math.random() * casualHIs.length)];
            }

            if (q.includes('how are you') || q.includes('how\'s it going') || q.includes('what\'s up') || q.includes('how do you feel')) {
                return casualHowAreYou[Math.floor(Math.random() * casualHowAreYou.length)];
            }

            if (q.includes('who are you') || q.includes('what are you') || q.includes('your name')) {
                return casualWhoAreYou[Math.floor(Math.random() * casualWhoAreYou.length)];
            }

            if (q.includes('staff') || q.includes('apply') || q.includes('job') || q.includes('hiring') || q.includes('career') || q.includes('register') || q.includes('join') || q.includes('work')) {
                if (q.includes('login') || q.includes('signin')) {
                    return `Trying to get into your staff account? You can log in right here:<br><a href="stafflogin.html" class="chat-action-link"><i class="fa-solid fa-key"></i> Open Staff Login</a>`;
                }
                return `Thinking about joining the team? That's awesome! You can fill out our employee registration form right here:<br><a href="employeeregistration.html" class="chat-action-link"><i class="fa-solid fa-file-pen"></i> Open Staff Registration Form</a>`;
            }

            if (q.includes('store') || q.includes('shop') || q.includes('buy') || q.includes('purchase') || q.includes('order') || q.includes('product') || q.includes('catalog') || q.includes('where')) {
                return `If you want to check out our organic products and see what's available, head over to the store:<br><a href="mystore.html" class="chat-action-link"><i class="fa-solid fa-store"></i> Open MY Store</a>`;
            }

            if (siteDictionary && siteDictionary.inventory) {
                const found = siteDictionary.inventory.find(item => q.includes(item.productName.toLowerCase()) || q.includes(item.category.toLowerCase()));
                if (found) {
                    return `Ah, looking for <strong>${found.productName}</strong>? Here are the details:<br>` +
                           `Price: ₹${found.finalPrice} ${found.offerPercentage > 0 ? `(on sale from ₹${found.originalPrice}, saving${found.offerPercentage}%)` : ''} | Rating: ★${found.rating}/5<br>` +
                           `${found.description}<br>` +
                           `<a href="mystore.html" class="chat-action-link"><i class="fa-solid fa-store"></i> Open MY Store</a>`;
                }
            }

            if (q.includes('bank') || q.includes('account') || q.includes('payment') || q.includes('upi') || q.includes('cod')) {
                return `Need the official bank account info or payment routing details? You can find them right here:<br><a href="bankdetails.html" class="chat-action-link"><i class="fa-solid fa-building-columns"></i> View Bank Details</a>`;
            }

            if (q.includes('about') || q.includes('who') || q.includes('charity') || q.includes('munchirai') || q.includes('ymca')) {
                return `MY Food Products is all about organic goodness while supporting community initiatives with Munchirai YMCA. You can read our full story here:<br><a href="aboutus.html" class="chat-action-link"><i class="fa-solid fa-book-open"></i> Read About Us</a>`;
            }

            if (q.includes('news') || q.includes('update') || q.includes('announcement')) {
                return `Want to see what's new with us? Check out our latest updates and announcements:<br><a href="news.html" class="chat-action-link"><i class="fa-solid fa-newspaper"></i> View News & Updates</a>`;
            }

            if (q.includes('contact') || q.includes('phone') || q.includes('call') || q.includes('support') || q.includes('help')) {
                return `Feel free to give us a call at <strong>+91-9943021998</strong> or check out our support page for more ways to reach us:<br><a href="contact.html" class="chat-action-link"><i class="fa-solid fa-phone"></i> Contact Us</a>`;
            }

            const casualFallbacks = [
                `That's an interesting question! If you're looking for our products or want to browse the catalog, you can check out the store:<br><a href="mystore.html" class="chat-action-link"><i class="fa-solid fa-store"></i> Open MY Store</a>`,
                `Hmm, I'm following you! If you need to jump straight to our shop or look at items, here's a quick link:<br><a href="mystore.html" class="chat-action-link"><i class="fa-solid fa-store"></i> Open MY Store</a>`,
                `I hear you! To explore everything we offer, feel free to visit our store page:<br><a href="mystore.html" class="chat-action-link"><i class="fa-solid fa-store"></i> Open MY Store</a>`
            ];
            return casualFallbacks[Math.floor(Math.random() * casualFallbacks.length)];
        }

        async function handleUserQuery(promptText) {
            setBlubiState('thinking');
            appendMessage('You', promptText);
            const reply = evaluateQuery(promptText);
            appendMessage('Aria', reply);
            speakAloud(reply);
        }

        window.addEventListener('load', async () => {
            await loadDictionaryData();
            loadChatHistory();
            startContinuousListening();
        });

        function startContinuousListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    if (isAiSpeaking) return;
                    let interim = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            const speechToText = event.results[i][0].transcript.trim();
                            if (speechToText) handleUserQuery(speechToText);
                        } else {
                            interim += event.results[i][0].transcript;
                        }
                    }
                    if (interim.trim()) {
                        setBlubiState('thinking');
                        userInput.value = interim;
                    }
                };

                recognition.onerror = () => {
                    if (!isAiSpeaking) setTimeout(() => { try { recognition.start(); } catch(e){} }, 1000);
                };
                recognition.onend = () => {
                    if (!isAiSpeaking) try { recognition.start(); } catch(e){}
                };
                try { recognition.start(); } catch(e){}
            }
        }

         chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if(!text) return;
            userInput.value = '';
            handleUserQuery(text);
        });
    </script>
</body>
</html>
