<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MY Food Products - Customer Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes floatAnime {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        @keyframes animeBlink {
            0%, 85%, 100% { transform: scaleY(1); }
            90% { transform: scaleY(0.1); }
        }
        @keyframes animeTalk {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.8); }
        }
        .animate-float { animation: floatAnime 3s ease-in-out infinite; }
        .anime-eyes { animation: animeBlink 4s infinite; transform-origin: center; }
        .is-talking .anime-mouth { animation: animeTalk 0.2s ease-in-out infinite; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-white h-[100dvh] w-screen overflow-hidden flex flex-col justify-between select-none font-sans m-0 p-0 box-border">

    <header class="w-full px-4 py-2.5 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex justify-between items-center z-10 shrink-0">
        <span class="text-xs font-semibold tracking-wide text-cyan-400 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> MY Food Products Support
        </span>
        <span class="text-xs font-mono px-2.5 py-0.5 bg-cyan-500/10 text-cyan-300 border border-cyan-500/20 rounded-full">Active</span>
    </header>

    <main class="flex-1 flex flex-col justify-end p-3 relative overflow-hidden">
        <div id="chat-log" class="w-full flex-1 overflow-y-auto space-y-2 mb-2 pr-1 flex flex-col justify-end"></div>
    </main>

    <div id="companion" class="absolute bottom-28 right-4 cursor-grab active:cursor-grabbing z-50 animate-float flex flex-col items-center touch-none">
        <div id="avatar-container" class="w-16 h-16 bg-gradient-to-b from-slate-900 to-indigo-950 rounded-2xl p-1 shadow-2xl shadow-cyan-500/20 border-2 border-cyan-400/50 flex items-center justify-center relative overflow-hidden">
            <svg viewBox="0 0 100 100" class="w-full h-full">
                <path d="M20,40 Q50,15 80,40 Q90,70 85,90 Q50,95 15,90 Q10,70 20,40 Z" fill="#1e1b4b"/>
                <path d="M28,35 Q50,25 72,35 Q80,60 72,82 Q50,90 28,82 Q20,60 28,35 Z" fill="#fed7aa"/>
                <g class="anime-eyes">
                    <ellipse cx="38" cy="55" rx="7" ry="9" fill="#0f172a"/>
                    <ellipse cx="38" cy="56" rx="5" ry="7" fill="#0284c7"/>
                    <circle cx="36" cy="53" r="2" fill="#ffffff"/>
                </g>
                <g class="anime-eyes">
                    <ellipse cx="62" cy="55" rx="7" ry="9" fill="#0f172a"/>
                    <ellipse cx="62" cy="56" rx="5" ry="7" fill="#0284c7"/>
                    <circle cx="60" cy="53" r="2" fill="#ffffff"/>
                </g>
                <path d="M30,46 Q38,43 46,47" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M54,47 Q62,43 70,46" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
                <ellipse cx="32" cy="66" rx="4" ry="2" fill="#fb7185" opacity="0.6"/>
                <ellipse cx="68" cy="66" rx="4" ry="2" fill="#fb7185" opacity="0.6"/>
                <circle cx="50" cy="64" r="0.8" fill="#c2410c"/>
                <path id="anime-mouth" class="anime-mouth" d="M45,72 Q50,76 55,72" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round" transform-origin="50 73"/>
                <path d="M25,32 Q50,18 75,32 Q65,45 50,38 Q35,45 25,32 Z" fill="#312e81"/>
                <path d="M35,35 Q50,50 42,32 Z" fill="#312e81"/>
                <path d="M65,35 Q50,50 58,32 Z" fill="#312e81"/>
            </svg>
        </div>
    </div>

    <footer class="w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-3 flex flex-col gap-2 z-10 shrink-0">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Ask about products, employee registration, or website doubts..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
            <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-xs font-medium shadow-lg shadow-cyan-600/30">Send</button>
        </form>
        <div class="flex justify-between items-center text-[10px] text-slate-500 px-1">
            <span>Support Line: +91-9943021998</span>
            <button id="clear-chat" class="text-red-400 hover:underline">Clear Chat History</button>
        </div>
    </footer>

    <script>
        const GROQ_API_KEY = "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";

        const companion = document.getElementById('companion');
        const avatarContainer = document.getElementById('avatar-container');
        const chatLog = document.getElementById('chat-log');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const clearChatBtn = document.getElementById('clear-chat');

        let recognition = null;
        let isAiSpeaking = false;
        let repositoryKnowledge = "Loading all repository files...";

        // Automatically fetch EVERY HTML file in your repository
        async function fetchRepositoryData() {
            let combinedContent = "";
            const targetFiles = [
                'aidictionary.html',
                'employeeregistration.html',
                'bankdetails.html',
                'productmanagement.html',
                'mystore.html',
                'testmerchandise.html',
                'testfood.html',
                'news.html',
                'index.html'
            ];

            for (const file of targetFiles) {
                try {
                    const response = await fetch(file);
                    if (response.ok) {
                        const htmlText = await response.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(htmlText, 'text/html');
                        combinedContent += `\n[Source File: ${file}]\n` + doc.body.innerText.replace(/\s+/g, ' ') + "\n";
                    }
                } catch (e) {}
            }
            repositoryKnowledge = combinedContent || "MY Food Products active store.";
        }

        function cleanDisplayContent(text) {
            if (!text) return "";
            let sanitized = text.replace(/[^a-zA-Z0-9\s.,?!+\-]/g, ' ');
            return sanitized.replace(/\s+/g, ' ').trim();
        }

        function cleanSpeechContent(text) {
            return cleanDisplayContent(text);
        }

        function loadChatHistory() {
            const savedHistory = localStorage.getItem('aria_chat_history');
            if (savedHistory) {
                chatLog.innerHTML = savedHistory;
                chatLog.scrollTop = chatLog.scrollHeight;
            } else {
                appendMessage('Aria', "Hey there! Welcome to MY Food Products. Looking for a specific product or need help with employee registration or the website?", false, false);
            }
        }

        function saveChatHistory() {
            localStorage.setItem('aria_chat_history', chatLog.innerHTML);
        }

        clearChatBtn.addEventListener('click', () => {
            localStorage.removeItem('aria_chat_history');
            chatLog.innerHTML = '';
            appendMessage('Aria', "Chat cleared! What else can I help you with?", true, true);
        });

        function appendMessage(sender, text, speak = true, save = true) {
            const isUser = sender === 'You';
            let formattedText = isUser ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : cleanDisplayContent(text);
            let speechText = cleanSpeechContent(text);

            const msgDiv = document.createElement('div');
            msgDiv.className = `p-2.5 rounded-xl max-w-[85%] text-xs ${isUser ? 'bg-cyan-950/80 border border-cyan-800/60 self-end text-cyan-100' : 'bg-slate-900/80 border border-slate-800/80 self-start text-slate-300'}`;
            msgDiv.innerHTML = `<span class="text-[10px] ${isUser ? 'text-cyan-300' : 'text-cyan-400'} font-semibold block mb-0.5">${sender}</span>${formattedText}`;
            
            chatLog.appendChild(msgDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
            
            if (save) saveChatHistory();
            if (speak && !isUser) speakAloud(speechText);
        }

        function speakAloud(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.2;
                utterance.volume = 1.0;
                
                utterance.onstart = () => {
                    isAiSpeaking = true;
                    if (recognition) { try { recognition.stop(); } catch(e) {} }
                    avatarContainer.classList.add('is-talking', 'border-red-400');
                };
                utterance.onend = () => {
                    avatarContainer.classList.remove('is-talking', 'border-red-400');
                    setTimeout(() => {
                        isAiSpeaking = false;
                        if (recognition) { try { recognition.start(); } catch(e) {} }
                    }, 500);
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        async function callGroq(promptText) {
            appendMessage('You', promptText, false, true);

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-20b",
                        messages: [
                            {
                                role: "system",
                                content: `You are Aria, a friendly, casual, and warm shopping buddy and helper for MY Food Products. Your tone is relaxed, chatty, and very friendly, never robotic or overly professional.

                                COMPLETE REPOSITORY FILES LOADED:
                                ${repositoryKnowledge}

                                RULES:
                                - For products: Check [Source File: aidictionary.html]. If the product is found, share its info in a friendly way. If nothing is found or it is not listed there, simply say "we don't have it".
                                - For employee registration, bank details, product management, or website doubts: Scan and analyze the rest of the loaded repository files (like employeeregistration.html, bankdetails.html, productmanagement.html, etc.) and explain how it works clearly and conversationally.
                                - Speak strictly in normal conversational sentences.
                                - NEVER output any markdown, symbols, hashtags, asterisks, pipes, bullets, or dashes. Only plain text letters, numbers, and basic punctuation.`
                            },
                            {
                                role: "user",
                                content: promptText
                            }
                        ]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0].message.content) {
                    const aiReply = data.choices[0].message.content.trim();
                    appendMessage('Aria', aiReply, true, true);
                } else {
                    appendMessage('Aria', "we don't have it", true, true);
                }
            } catch (err) {
                console.error(err);
                appendMessage('Aria', "we don't have it", true, true);
            }
        }

        window.addEventListener('load', async () => {
            await fetchRepositoryData();
            loadChatHistory();
            startContinuousListening();
        });

        function startContinuousListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    if (isAiSpeaking) return;
                    const speechToText = event.results[event.results.length - 1][0].transcript.trim();
                    if (speechToText) {
                        callGroq(speechToText);
                    }
                };

                recognition.onerror = () => {
                    if (!isAiSpeaking) {
                        setTimeout(() => { try { recognition.start(); } catch(e){} }, 1000);
                    }
                };
                recognition.onend = () => {
                    if (!isAiSpeaking) {
                        try { recognition.start(); } catch(e){}
                    }
                };
                try { recognition.start(); } catch(e){}
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if(!text) return;
            userInput.value = '';
            callGroq(text);
        });

        let startX, startY, initialX, initialY, isDragging = false;
        companion.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            initialX = companion.offsetLeft;
            initialY = companion.offsetTop;
            companion.style.bottom = 'auto';
            companion.style.right = 'auto';
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            companion.style.left = `${Math.max(10, Math.min(window.innerWidth - 80, initialX + dx))}px`;
            companion.style.top = `${Math.max(40, Math.min(window.innerHeight - 160, initialY + dy))}px`;
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });
    </script>
</body>
</html>
