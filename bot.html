<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        .chat-action-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .chat-action-link:hover {
            background: rgba(245, 158, 11, 0.2);
            border-color: rgba(245, 158, 11, 0.6);
            transform: translateY(-1px);
        }

        .quick-option-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.8);
            color: #e2e8f0;
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }
        .quick-option-btn:hover {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.4);
            color: #fbbf24;
            transform: translateY(-1px);
        }

        /* Toast animation */
        #toast-notification {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Desktop specific layout container constraints */
        @media (min-width: 768px) {
            .app-container {
                max-width: 768px;
                margin: 0 auto;
                height: 100vh;
                border-left: 1px solid rgba(30, 41, 59, 0.8);
                border-right: 1px solid rgba(30, 41, 59, 0.8);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            }
        }
    </style>
</head>

            </div>
        </div>

        <footer class="w-full bg-slate-900/95 backdrop-blur-xl border-t border-slate-800/80 p-3.5 sm:p-4 flex flex-col gap-2.5 z-20 shrink-0 shadow-2xl relative">

        // Toggle Language Function
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ta' : 'en';
            langLabel.textContent = currentLang === 'en' ? 'தமிழ்' : 'English';
            
            if (currentLang === 'ta') {
                headerTitle.textContent = "Blubi உதவியாளர்";
                headerSubtitle.textContent = "பேச கீழே உள்ள தலைப்பைத் தட்டவும்";
                modalTitle.textContent = "அரட்டை வரலாற்றை நீக்கு";
                modalDesc.textContent = "அரட்டை வரலாற்றை முழுமையாக நீக்க விரும்புகிறீர்களா?";
                toastText.textContent = "அரட்டை வரலாறு வெற்றிகரமாக அழிக்கப்பட்டது!";
            } else {
                headerTitle.textContent = "Blubi Assistant";
                headerSubtitle.textContent = "Tap a topic below to chat";
                modalTitle.textContent = "Delete Chat History";
                modalDesc.textContent = "Are you sure you want to clear our chat history?";
                toastText.textContent = "Chat history cleared successfully!";
            }

            renderMainCategories();
        }

        // Show Floating Toast Notification
        function showToast(message) {
            toastText.textContent = message;
            toastNotification.classList.remove('hidden', 'opacity-0', 'translate-y-[-10px]');
            toastNotification.classList.add('opacity-100', 'translate-y-0');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastNotification.classList.remove('opacity-100', 'translate-y-0');
                toastNotification.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toastNotification.classList.add('hidden'), 300);
            }, 3000);
        }

        // Blubi State Handlers
        function setBlubiState(state) {
            if (state === 'thinking') {
                blubiAvatar.src = 'blubi thinking.gif';
            } else if (state === 'speaking') {
                blubiAvatar.src = 'blubi speaking.gif';
            } else if (state === 'idle') {
                const idleGifs = ['blubiani1.gif', 'blubiani2.gif'];
                const randomGif = idleGifs[Math.floor(Math.random() * idleGifs.length)];
                blubiAvatar.src = randomGif;
            }
        }

        function startIdleLoop() {
            if (idleInterval) clearInterval(idleInterval);
            idleInterval = setInterval(() => {
                if (!isAiSpeaking) {
                    setBlubiState('idle');
                }
            }, 6000);
        }

        function loadChatHistory() {
            const savedHistory = localStorage.getItem('blubi_chat_history');
            if (savedHistory) {
                chatLog.innerHTML = savedHistory;
                chatLog.scrollTop = chatLog.scrollHeight;
            } else {
                const greetingsPool = humanGreetings[currentLang];
                const randomGreeting = greetingsPool[Math.floor(Math.random() * greetingsPool.length)];
                appendMessage(currentLang === 'ta' ? 'பிளூபி' : 'Blubi', randomGreeting, false);
            }
            setBlubiState('idle');
            startIdleLoop();
            renderMainCategories();
        }

        function saveChatHistory() {
            localStorage.setItem('blubi_chat_history', chatLog.innerHTML);
        }

        clearChatTopBtn.addEventListener('click', () => customConfirmModal.classList.remove('hidden'));
        confirmCancelBtn.addEventListener('click', () => customConfirmModal.classList.add('hidden'));
        confirmOkBtn.addEventListener('click', () => {
            customConfirmModal.classList.add('hidden');
            localStorage.removeItem('blubi_chat_history');
            chatLog.innerHTML = '';
            
            showToast(currentLang === 'ta' ? "அரட்டை வரலாறு அழிக்கப்பட்டது!" : "Chat history cleared successfully!");

            const greetingsPool = humanGreetings[currentLang];
            const randomGreeting = greetingsPool[Math.floor(Math.random() * greetingsPool.length)];
            appendMessage(currentLang === 'ta' ? 'பிளூபி' : 'Blubi', randomGreeting, true);
            renderMainCategories();
        });

        function appendMessage(sender, htmlContent, save = true) {
            const msgDiv = document.createElement('div');
            const isUser = sender === 'You' || sender === 'நீங்கள்';
            msgDiv.className = `p-4 rounded-2xl max-w-[85%] text-xs sm:text-sm shadow-md ${isUser ? 'bg-amber-500/10 border border-amber-500/30 self-end text-amber-100 font-medium' : 'bg-slate-900 border border-slate-800/80 self-start text-slate-300'}`;
            msgDiv.innerHTML = `<span class="text-[10px] sm:text-xs ${isUser ? 'text-amber-400' : 'text-amber-500'} font-extrabold block mb-1.5 uppercase tracking-wider">${sender}</span><div class="leading-relaxed">${htmlContent}</div>`;
            chatLog.appendChild(msgDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
            if (save) saveChatHistory();
        }

        function speakAloud(textClean) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = textClean;
                const plainText = tempDiv.textContent || tempDiv.innerText || "";
                const utterance = new SpeechSynthesisUtterance(plainText);
                utterance.rate = 1.0;
                utterance.pitch = 1.05;
                utterance.lang = currentLang === 'ta' ? 'ta-IN' : 'en-US';
                
                utterance.onstart = () => {
                    isAiSpeaking = true;
                    setBlubiState('speaking');
                };
                utterance.onend = () => {
                    isAiSpeaking = false;
                    setBlubiState('idle');
                };
                window.speechSynthesis.speak(utterance);
            }
        }

        // Render Main Category Buttons
        function renderMainCategories() {
            let html = '';
            for (const key in categories) {
                const cat = categories[key];
                html += `<button onclick="handleMainCategoryClick('${key}')" class="quick-option-btn shrink-0">
                    <i class="fa-brands ${cat.icon} text-amber-400"></i> ${cat.label[currentLang]}
                </button>`;
            }
            buttonPanel.innerHTML = html;
        }

        // When a main category is clicked
        function handleMainCategoryClick(categoryKey) {
            const cat = categories[categoryKey];
            if (!cat) return;

            setBlubiState('thinking');
            const userPromptText = currentLang === 'ta' ? `${cat.label.ta} பற்றி பேசலாம்` : `Let's talk about ${cat.label.en}`;
            appendMessage(currentLang === 'ta' ? 'நீங்கள்' : 'You', userPromptText);
            
            const introReply = currentLang === 'ta' ? 
                `கண்டிப்பாக! ${cat.label.ta} தொடர்பான கேள்விகள் இதோ. கீழே உள்ளதைத் தட்டவும்:` : 
                `Sure thing! Here are a few things you can ask about ${cat.label.en}. Tap one below:`;
            
            appendMessage(currentLang === 'ta' ? 'பிளூபி' : 'Blubi', introReply);
            speakAloud(introReply);
            setBlubiState('idle');

            let subHtml = '';
            cat.subquestions.forEach((sub, index) => {
                const iconClass = sub.isBack ? "fa-arrow-left" : "fa-circle-question";
                subHtml += `<button onclick="handleSubQuestionClick('${categoryKey}', ${index})" class="quick-option-btn shrink-0">
                    <i class="fa-solid ${iconClass} text-amber-400"></i> ${sub.text[currentLang]}
                </button>`;
            });
            buttonPanel.innerHTML = subHtml;
        }

        // When a sub-question is tapped
        function handleSubQuestionClick(categoryKey, subIndex) {
            const cat = categories[categoryKey];
            const sub = cat.subquestions[subIndex];

            setBlubiState('thinking');
            appendMessage(currentLang === 'ta' ? 'நீங்கள்' : 'You', sub.text[currentLang]);

            appendMessage(currentLang === 'ta' ? 'பிளூபி' : 'Blubi', sub.reply[currentLang]);
            speakAloud(sub.reply[currentLang]);
            setBlubiState('idle');

            if (sub.isBack) {
                renderMainCategories();
            }
        }

        window.addEventListener('load', () => {
            loadChatHistory();
        });
    </script>
