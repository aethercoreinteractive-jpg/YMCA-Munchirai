<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MY Food Products - AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes floatAnime {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float { animation: floatAnime 3s ease-in-out infinite; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .chat-action-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fbbf24;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .chat-action-link:hover {
            background: rgba(245, 158, 11, 0.3);
            border-color: rgba(245, 158, 11, 0.8);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] w-screen overflow-hidden flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950 m-0 p-0 box-border">

    <!-- Fixed Header -->
    <header class="w-full px-4 py-3 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 flex justify-between items-center z-10 shrink-0 shadow-lg">
        <div class="flex items-center gap-2">
            <div id="header-logo-container" class="w-7 h-7 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 font-black flex items-center justify-center text-[10px] tracking-tighter shadow-md overflow-hidden border border-amber-400/30 flex-shrink-0">
                <span id="header-logo-fallback">MY</span>
            </div>
            <span class="text-xs font-extrabold tracking-wide text-white flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> MY Food AI Assistant
            </span>
        </div>
        <button id="clear-chat-top" class="text-xs font-bold px-3 py-1.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl hover:bg-red-500/20 transition-all flex items-center gap-1.5 cursor-pointer active:scale-95 shadow-sm">
            <i class="fa-solid fa-trash-can text-[11px]"></i> Delete Chat
        </button>
    </header>

    <!-- Main Chat Workspace -->
    <main class="flex-1 w-full relative overflow-hidden flex flex-col p-3 max-w-3xl mx-auto">
        <div id="chat-log" class="absolute inset-0 overflow-y-auto p-3 space-y-3 flex flex-col pb-24"></div>
    </main>

    <!-- Inbuilt Custom Confirmation Modal -->
    <div id="custom-confirm-modal" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-xs w-full shadow-2xl flex flex-col gap-4 text-center">
            <div class="w-12 h-12 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center mx-auto text-lg border border-red-100 shadow-inner">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div class="flex flex-col gap-1">
                <h3 class="text-sm font-extrabold text-white">Delete Chat History</h3>
                <p class="text-xs text-slate-400 font-light">Are you sure you want to delete all chat records?</p>
            </div>
            <div class="flex gap-2 pt-1">
                <button id="confirm-cancel" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-bold transition-all cursor-pointer">Cancel</button>
                <button id="confirm-ok" class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-red-600/30 transition-all cursor-pointer">Delete</button>
            </div>
        </div>
    </div>

    <!-- Input Footer with Blubi Standing On Top -->
    <footer class="w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-3 flex flex-col gap-2 z-20 shrink-0 shadow-lg relative">
        
        <!-- Blubi Avatar Standing Above Text Box -->
        <div class="absolute -top-12 left-6 z-30 pointer-events-none flex items-center">
            <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-amber-400/80 bg-slate-900 shadow-lg shadow-amber-500/30 flex items-center justify-center bg-slate-950">
                <img id="blubi-avatar" src="blubiani1.gif" alt="Blubi Avatar" class="w-full h-full object-cover">
            </div>
        </div>

        <form id="chat-form" class="flex gap-2 max-w-3xl w-full mx-auto relative pt-1">
            <input type="text" id="user-input" placeholder="Ask anything about MY Food Products..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500 transition shadow-inner">
            <button type="submit" class="bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 px-5 py-2.5 rounded-xl text-xs font-bold shadow-md transition cursor-pointer flex items-center gap-1.5">
                <span>Send</span> <i class="fa-solid fa-paper-plane text-[10px]"></i>
            </button>
        </form>
        <div class="flex justify-between items-center text-[11px] text-slate-400 px-1 max-w-3xl w-full mx-auto font-medium">
            <span>Support: +91-9943021998</span>
            <span>MY Food Products</span>
        </div>
    </footer>

    <!-- Grok Natural Reasoning Engine Script -->
    <script>
        const chatLog = document.getElementById('chat-log');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const clearChatTopBtn = document.getElementById('clear-chat-top');
        const customConfirmModal = document.getElementById('custom-confirm-modal');
        const confirmOkBtn = document.getElementById('confirm-ok');
        const confirmCancelBtn = document.getElementById('confirm-cancel');
        const blubiAvatar = document.getElementById('blubi-avatar');

        let recognition = null;
        let isAiSpeaking = false;
        let siteDictionary = null;
        let idleInterval = null;

        const dynamicGreetings = [
            "What's up? Ready to explore MY Store or need help with something else?",
            "Hey there! What can I help you find today?",
            "Yo! Ask me anything about our organic products, staff applications, or store catalog."
        ];

        // Blubi State Handlers
        function setBlubiState(state) {
            if (state === 'thinking') {
                blubiAvatar.src = 'blubi thinking.gif';
            } else if (state === 'speaking') {
                blubiAvatar.src = 'blubi speaking.gif';
            } else if (state === 'idle') {
                const idleGifs = ['blubiani1.gif', 'blubiani2.gif'];
                const randomGif = idleGifs[Math.floor(Math.random() * idleGifs.length)];
                blubiAvatar.src = randomGif;
            }
        }

        function startIdleLoop() {
            if (idleInterval) clearInterval(idleInterval);
            idleInterval = setInterval(() => {
                if (!isAiSpeaking && !userInput.value.trim()) {
                    setBlubiState('idle');
                }
            }, 6000);
        }

        userInput.addEventListener('input', () => {
            if (userInput.value.trim().length > 0) {
                setBlubiState('thinking');
            } else {
                setBlubiState('idle');
            }
        });

        async function loadDictionaryData() {
            try {
                const response = await fetch('aidictionary.html');
                if (response.ok) {
                    const text = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    const scriptTag = doc.querySelector('script');
                    if (scriptTag && scriptTag.textContent.includes('AIDictionary')) {
                        const evalScript = new Function(scriptTag.textContent + '; return AIDictionary;');
                        siteDictionary = evalScript();
                    }
                }
            } catch (e) {}
        }

        function loadChatHistory() {
            const savedHistory = localStorage.getItem('aria_chat_history');
            if (savedHistory) {
                chatLog.innerHTML = savedHistory;
                chatLog.scrollTop = chatLog.scrollHeight;
            } else {
                const randomGreeting = dynamicGreetings[Math.floor(Math.random() * dynamicGreetings.length)];
                appendMessage('Aria', randomGreeting, false);
            }
            setBlubiState('idle');
            startIdleLoop();
        }

        function saveChatHistory() {
            localStorage.setItem('aria_chat_history', chatLog.innerHTML);
        }

        clearChatTopBtn.addEventListener('click', () => customConfirmModal.classList.remove('hidden'));
        confirmCancelBtn.addEventListener('click', () => customConfirmModal.classList.add('hidden'));
        confirmOkBtn.addEventListener('click', () => {
            customConfirmModal.classList.add('hidden');
            localStorage.removeItem('aria_chat_history');
            chatLog.innerHTML = '';
            appendMessage('Aria', "Wiped the slate clean. What's next?", true);
        });

        function appendMessage(sender, htmlContent, save = true) {
            const msgDiv = document.createElement('div');
            const isUser = sender === 'You';
            msgDiv.className = `p-3.5 rounded-2xl max-w-[85%] text-xs shadow-sm ${isUser ? 'bg-amber-500/10 border border-amber-500/30 self-end text-amber-100 font-medium' : 'bg-slate-900 border border-slate-800 self-start text-slate-300'}`;
            msgDiv.innerHTML = `<span class="text-[10px] ${isUser ? 'text-amber-400' : 'text-amber-500'} font-extrabold block mb-1 uppercase tracking-wider">${sender}</span><div class="leading-relaxed">${htmlContent}</div>`;
            chatLog.appendChild(msgDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
            if (save) saveChatHistory();
        }

        function speakAloud(textClean) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = textClean;
                const plainText = tempDiv.textContent || tempDiv.innerText || "";
                const utterance = new SpeechSynthesisUtterance(plainText);
                utterance.rate = 1.0;
                utterance.pitch = 1.1;
                
                utterance.onstart = () => {
                    isAiSpeaking = true;
                    setBlubiState('speaking');
                    if (recognition) { try { recognition.stop(); } catch(e) {} }
                };
                utterance.onend = () => {
                    isAiSpeaking = false;
                    setBlubiState('idle');
                    setTimeout(() => {
                        if (recognition) { try { recognition.start(); } catch(e) {} }
                    }, 400);
                };
                window.speechSynthesis.speak(utterance);
            }
        }

        // Natural Conversational & Intent Matching Engine
        function evaluateQuery(query) {
            const q = query.toLowerCase().trim();

            if (['hi', 'hello', 'hey', 'sup', 'greetings', 'yo'].some(word => q === word || q.startsWith(word + ' '))) {
                const randomHIs = [
                    "Hey! What's on your mind today?",
                    "Hello there! Looking to browse MY Store or check out something specific?",
                    "Hey! How can I help you navigate MY Food Products today?"
                ];
                return randomHIs[Math.floor(Math.random() * randomHIs.length)];
            }

            if (q.includes('how are you') || q.includes('how\'s it going') || q.includes('what\'s up')) {
                const responses = [
                    "I'm doing great, fully online and keeping an eye on the store! What about you?",
                    "All systems are green! Ready to help you check out products or sort out staff info.",
                    "Livin' in the cloud and keeping things running smooth. What can I do for you?"
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }

            if (q.includes('who are you') || q.includes('what are you')) {
                return "I'm Aria, your digital assistant for MY Food Products. I'm here to help you navigate the store, check products, or get connected with our team.";
            }

            if (q.includes('staff') || q.includes('apply') || q.includes('job') || q.includes('hiring') || q.includes('career') || q.includes('register') || q.includes('join') || q.includes('work')) {
                if (q.includes('login') || q.includes('signin')) {
                    return `Need to sign into your staff account? Jump right in here:<br><a href="stafflogin.html" class="chat-action-link"><i class="fa-solid fa-key"></i> Open Staff Login</a>`;
                }
                return `Want to join the team? You can submit your application right through our employee registration form.<br><a href="employeeregistration.html" class="chat-action-link"><i class="fa-solid fa-file-pen"></i> Open Staff Registration Form</a>`;
            }

            if (q.includes('store') || q.includes('shop') || q.includes('buy') || q.includes('purchase') || q.includes('order') || q.includes('product') || q.includes('catalog') || q.includes('where')) {
                return `You can explore our entire organic product lineup and place orders directly in MY Store:<br><a href="mystore.html" class="chat-action-link"><i class="fa-solid fa-store"></i> Open MY Store</a>`;
            }

            if (siteDictionary && siteDictionary.inventory) {
                const found = siteDictionary.inventory.find(item => q.includes(item.productName.toLowerCase()) || q.includes(item.category.toLowerCase()));
                if (found) {
                    return `Found <strong>${found.productName}</strong> (${found.category}):<br>` +
                           `Price: ₹${found.finalPrice} ${found.offerPercentage > 0 ? `(${found.offerPercentage}% off original ₹${found.originalPrice})` : ''} | Rating: ★${found.rating}/5<br>` +
                           `${found.description}<br>` +
                           `<a href="mystore.html" class="chat-action-link"><i class="fa-solid fa-store"></i> Open MY Store</a>`;
                }
            }

            if (q.includes('bank') || q.includes('account') || q.includes('payment') || q.includes('upi') || q.includes('cod')) {
                return `All official bank account details and payment routing info are listed here:<br><a href="bankdetails.html" class="chat-action-link"><i class="fa-solid fa-building-columns"></i> View Bank Details</a>`;
            }

            if (q.includes('about') || q.includes('who') || q.includes('charity') || q.includes('munchirai') || q.includes('ymca')) {
                return `MY Food Products is a commercial organic business directing its profits toward charity initiatives with Munchirai YMCA. Read more about our story:<br><a href="aboutus.html" class="chat-action-link"><i class="fa-solid fa-book-open"></i> Read About Us</a>`;
            }

            if (q.includes('news') || q.includes('update') || q.includes('announcement')) {
                return `Catch up on our latest announcements and community updates here:<br><a href="news.html" class="chat-action-link"><i class="fa-solid fa-newspaper"></i> View News & Updates</a>`;
            }

            if (q.includes('contact') || q.includes('phone') || q.includes('call') || q.includes('support') || q.includes('help')) {
                return `You can reach out directly at <strong>+91-9943021998</strong> or visit our support page:<br><a href="contact.html" class="chat-action-link"><i class="fa-solid fa-phone"></i> Contact Us</a>`;
            }

            return `I'm tracking with you, but if you're looking to browse our items or check out the catalog, you can head straight over to the store:<br><a href="mystore.html" class="chat-action-link"><i class="fa-solid fa-store"></i> Open MY Store</a>`;
        }

        async function handleUserQuery(promptText) {
            setBlubiState('thinking');
            appendMessage('You', promptText);
            const reply = evaluateQuery(promptText);
            appendMessage('Aria', reply);
            speakAloud(reply);
        }

        window.addEventListener('load', async () => {
            await loadDictionaryData();
            loadChatHistory();
            startContinuousListening();
        });

        function startContinuousListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    if (isAiSpeaking) return;
                    let interim = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            const speechToText = event.results[i][0].transcript.trim();
                            if (speechToText) handleUserQuery(speechToText);
                        } else {
                            interim += event.results[i][0].transcript;
                        }
                    }
                    if (interim.trim()) {
                        setBlubiState('thinking');
                        userInput.value = interim;
                    }
                };

                recognition.onerror = () => {
                    if (!isAiSpeaking) setTimeout(() => { try { recognition.start(); } catch(e){} }, 1000);
                };
                recognition.onend = () => {
                    if (!isAiSpeaking && !isAiSpeaking) try { recognition.start(); } catch(e){}
                };
                try { recognition.start(); } catch(e){}
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if(!text) return;
            userInput.value = '';
            handleUserQuery(text);
        });
    </script>
</body>
</html>
