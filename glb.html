<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB 3D Logo Integration</title>
    
    <!-- Import Google Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }

        header {
            background-color: #1a1a1a;
            color: white;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Container box for your integrated 3D logo */
        .logo-container {
            width: 100%;
            height: 400px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
            overflow: hidden;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Webpage</h1>
        <p>Featuring an integrated 3D GLB model below</p>
    </header>

    <div class="container">
        <h2>3D Logo Showcase</h2>
        <p>You can drag to rotate the logo or zoom in and out.</p>

        <!-- Integrated 3D Model Box -->
        <div class="logo-container">
            <model-viewer 
                src="logo.glb" 
                alt="3D Logo" 
                auto-rotate 
                camera-controls 
                shadow-intensity="1">
            </model-viewer>
        </div>

        <p>Rest of your webpage content goes here...</p>
    </div>

</body>
</html>
