<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Order History</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-amber-500 selection:text-slate-950 pt-14 flex flex-col min-h-screen">

    <!-- Professional Fixed Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md text-white shadow-lg border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-14 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 shrink-0">
                <a href="index.html" class="text-sm sm:text-2xl font-black tracking-tighter uppercase text-white flex items-center gap-1.5">
                    <span class="bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-xs sm:text-lg font-bold shadow">MY</span> Order History
                </a>
            </div>
            <div class="flex items-center gap-2">
                <a href="orders.html" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition border border-slate-700 flex items-center gap-1 font-semibold">
                    <i class="fa-solid fa-list-check text-amber-400"></i> Live Orders
                </a>
                <button onclick="promptClearHistory()" class="text-[11px] bg-rose-900/40 hover:bg-rose-900/70 text-rose-200 px-3 py-1.5 rounded-lg transition border border-rose-800 flex items-center gap-1 font-semibold">
                    <i class="fa-solid fa-trash-can text-rose-400"></i> Clear All
                </button>
            </div>
        </div>
    </header>

    <!-- Main History Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
            <div>
                <span class="text-[9px] font-bold uppercase tracking-widest text-slate-600 bg-slate-200 px-2 py-0.5 rounded border border-slate-300">Archived Records</span>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-gray-900 mt-1">Completed & Cancelled Orders</h1>
            </div>
            <div class="flex items-center gap-2">
                <span id="total-history-badge" class="text-xs font-bold bg-slate-200 text-slate-800 px-3 py-1.5 rounded-xl shadow-sm">0 Archived Orders</span>
            </div>
        </div>

        <!-- History Container -->
        <div id="history-container" class="space-y-4">
            <div class="text-center py-16 bg-white rounded-2xl border border-gray-200 shadow-sm text-gray-400 text-xs">
                Loading order history...
            </div>
        </div>

        <!-- Empty State Notice -->
        <div id="empty-history-state" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-200 shadow-sm">
            <div class="w-12 h-12 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center mx-auto mb-3 text-lg shadow-inner">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </div>
            <h3 class="font-bold text-xs text-gray-900">No history records yet</h3>
            <p class="text-[11px] text-gray-500 mt-1">Completed or cancelled orders will appear here automatically.</p>
        </div>
    </main>

    <!-- Firebase SDK Imports & History Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const ordersRef = ref(db, 'orders');

        onValue(ordersRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('history-container');
            const emptyState = document.getElementById('empty-history-state');
            const badge = document.getElementById('total-history-badge');

            if (!data) {
                container.innerHTML = "";
                emptyState.classList.remove('hidden');
                badge.textContent = "0 Archived Orders";
                return;
            }

            const ordersList = Object.keys(data).map(key => ({
                firebaseKey: key,
                ...data[key]
            })).reverse();

            // Filter strictly for history records (Completed or Cancelled)
            const historyOrders = ordersList.filter(order => {
                const status = order.status || '';
                return status === 'Completed' || status === 'Cancelled' || status === 'Delivered';
            });

            if (historyOrders.length === 0) {
                container.innerHTML = "";
                emptyState.classList.remove('hidden');
                badge.textContent = "0 Archived Orders";
                return;
            }

            emptyState.classList.add('hidden');
            badge.textContent = `${historyOrders.length} Archived Order${historyOrders.length > 1 ? 's' : ''}`;

            container.innerHTML = historyOrders.map(order => {
                const orderDateStr = order.timestamp ? new Date(order.timestamp).toLocaleString() : 'N/A';
                const status = order.status || 'Completed';
                
                let statusBadgeColor = 'bg-emerald-100 text-emerald-800 border-emerald-200';
                if (status === 'Cancelled') statusBadgeColor = 'bg-rose-100 text-rose-800 border-rose-200';

                const itemsHtml = (order.items || []).map(item => `
                    <div class="flex items-center justify-between text-xs py-1 border-b border-gray-100 last:border-0">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-900">${item.qtyCount || 1}x</span>
                            <span class="text-gray-700">${item.name}</span>
                        </div>
                        <span class="font-semibold text-slate-900">₹${(item.price || 0) * (item.qtyCount || 1)}</span>
                    </div>
                `).join('');

                return `
                    <div class="bg-white border border-gray-200 rounded-2xl p-4 sm:p-5 shadow-sm space-y-3">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b pb-3 border-gray-100">
                            <div>
                                <span class="text-[10px] text-gray-400 font-mono">ID: ${order.firebaseKey.slice(-6)}</span>
                                <p class="text-[11px] text-gray-500 font-medium"><i class="fa-regular fa-calendar-days text-amber-500 mr-1"></i> Ordered: ${orderDateStr}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-lg border uppercase tracking-wider ${statusBadgeColor}">${status}</span>
                            </div>
                        </div>

                        <!-- Items Breakdown -->
                        <div class="bg-gray-50 rounded-xl p-3 border border-gray-100 space-y-1">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Purchased Items</span>
                            ${itemsHtml}
                        </div>

                        <div class="flex items-center justify-between pt-1">
                            <div class="text-xs">
                                <span class="text-gray-500">Total:</span>
                                <span class="font-black text-slate-900 text-sm ml-1">₹${order.totalAmount || 0}</span>
                            </div>
                            
                            <button onclick="window.deleteSingleHistory('${order.firebaseKey}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold transition border border-red-200 flex items-center gap-1">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        });

        window.deleteSingleHistory = function(firebaseKey) {
            if (confirm("Are you sure you want to permanently delete this order record?")) {
                remove(ref(db, `orders/${firebaseKey}`))
                    .catch(err => {
                        console.error("Error deleting order:", err);
                        alert("Failed to delete record.");
                    });
            }
        };

        window.promptClearHistory = function() {
            const companyKey = prompt("Enter company key or admin password to clear all history:");
            // Change 'ymca2026' to whatever secure password or company key you prefer
            if (companyKey === "ymca2026") {
                if (confirm("WARNING: This will wipe all archived history records. Proceed?")) {
                    // Fetch all orders and remove completed/cancelled ones
                    onValue(ordersRef, (snapshot) => {
                        const data = snapshot.val();
                        if (!data) return;
                        
                        Object.keys(data).forEach(key => {
                            const status = data[key].status || '';
                            if (status === 'Completed' || status === 'Cancelled' || status === 'Delivered') {
                                remove(ref(db, `orders/${key}`));
                            }
                        });
                    }, { onlyOnce: true });
                }
            } else if (companyKey !== null) {
                alert("Incorrect company key / password.");
            }
        };
    </script>
</body>
</html>
