<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | MY Food Employee Registration</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; height: 100%; width: 100%; overflow: hidden; position: fixed; }
    </style>
</head>
<body class="bg-gray-50 text-gray-950 antialiased selection:bg-amber-500 selection:text-slate-950 flex flex-col">

    <!-- Professional Fixed Header Matching Index Page Theme -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md text-white shadow-lg border-b border-slate-800 shrink-0 h-11 flex items-center">
        <div class="max-w-7xl mx-auto px-3 w-full flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 shrink-0">
                <a href="#" onclick="history.back(); return false;" class="text-xs font-black tracking-tighter uppercase text-white flex items-center gap-1.5 cursor-pointer">
                    <span class="bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-[10px] font-bold shadow">MY</span> My Store
                </a>
            </div>

            <div class="flex items-center gap-2">
                <!-- Back Button Triggering window.history.back() -->
                <button onclick="history.back()" class="bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 px-2.5 py-1 rounded-md font-bold text-[10px] shadow transition flex items-center gap-1 cursor-pointer">
                    <i class="fa-solid fa-arrow-left text-[9px]"></i>
                    <span>Back</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Strictly Screen-Locked Container without any outer body or window scrolling -->
    <main class="absolute inset-0 top-11 flex justify-center items-center px-2 py-1.5 w-full overflow-hidden">
        <div class="bg-white w-full max-w-md rounded-xl shadow-sm border border-gray-200 p-3.5 flex flex-col justify-center h-full max-h-[calc(100vh-3.2rem)]">
            <div id="formContainer" class="flex flex-col h-full justify-between">
                <div class="text-center mb-1">
                    <div class="w-7 h-7 bg-amber-50 text-amber-600 rounded-lg flex items-center justify-center mx-auto mb-1 text-xs shadow-inner border border-amber-100">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                    <h1 class="text-sm font-extrabold tracking-tight text-slate-900 leading-tight">Employee Registration</h1>
                    <p class="text-[10px] text-gray-500 leading-none mt-0.5 max-w-xs mx-auto">
                        Provide credentials to submit your employment profile.
                    </p>
                </div>

                <form id="employeeRegForm" onsubmit="handleRegistration(event)" class="space-y-2 flex-1 flex flex-col justify-evenly my-0.5">
                    <div>
                        <label for="fullName" class="block text-[10px] font-bold text-slate-900 mb-0.5">Full Name</label>
                        <input type="text" id="fullName" placeholder="Enter your full name" required class="w-full bg-white border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-amber-500 shadow-sm transition">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label for="dob" class="block text-[10px] font-bold text-slate-900 mb-0.5">Date of Birth</label>
                            <input type="date" id="dob" required class="w-full bg-white border border-gray-200 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500 shadow-sm transition">
                        </div>

                        <div>
                            <label for="experienceYears" class="block text-[10px] font-bold text-slate-900 mb-0.5">Experience (Years)</label>
                            <input type="number" id="experienceYears" min="0" max="50" placeholder="e.g. 3" required class="w-full bg-white border border-gray-200 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500 shadow-sm transition">
                        </div>
                    </div>

                    <div>
                        <label for="experienceDetails" class="block text-[10px] font-bold text-slate-900 mb-0.5">Work Experience Detail</label>
                        <textarea id="experienceDetails" placeholder="Briefly specify your industry background..." required class="w-full bg-white border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-amber-500 shadow-sm transition resize-none h-12"></textarea>
                    </div>

                    <div>
                        <label for="resumeLink" class="block text-[10px] font-bold text-slate-900 mb-0.5">Google Drive Resume Link</label>
                        <input type="url" id="resumeLink" placeholder="https://drive.google.com/file/d/..." required class="w-full bg-white border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-amber-500 shadow-sm transition">
                    </div>

                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-extrabold text-xs py-2 px-3 rounded-lg transition shadow flex items-center justify-center gap-1 cursor-pointer">
                        <i class="fa-solid fa-paper-plane text-[9px]"></i> Submit Application
                    </button>
                </form>
            </div>

            <!-- Success Notification Card -->
            <div id="successNotification" class="hidden text-center py-6 px-4 my-auto">
                <div class="w-9 h-9 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2 text-sm shadow-inner border border-emerald-100">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3 class="text-xs font-extrabold text-emerald-800 mb-1">Application Received</h3>
                <p class="text-[11px] text-gray-500 leading-relaxed">Thank you for registering. Our recruitment operations team will review your credentials and contact you shortly.</p>
            </div>
        </div>
    </main>

    <!-- Firebase SDK Imports & Form Submission Handler -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        window.handleRegistration = function(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const dob = document.getElementById('dob').value;
            const experienceYears = document.getElementById('experienceYears').value;
            const experienceDetails = document.getElementById('experienceDetails').value.trim();
            const resumeLink = document.getElementById('resumeLink').value.trim();

            const registrationData = {
                fullName,
                dob,
                experienceYears,
                experienceDetails,
                resumeLink,
                submittedAt: new Date().toISOString()
            };

            const employeesRef = ref(db, 'employees');
            push(employeesRef, registrationData)
                .then(() => {
                    document.getElementById('formContainer').style.display = 'none';
                    document.getElementById('successNotification').style.display = 'block';
                })
                .catch((error) => {
                    console.error("Error saving employee registration: ", error);
                    alert("Failed to submit registration. Please check your connection and try again.");
                });
        };
    </script>
</body>
</html>
