<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Employee Registration - My Food</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-yellow: #fef08a;
            --accent-yellow-border: #fde047;
            --btn-orange: #fb923c;
            --btn-orange-hover: #f97316;
            --card-bg: #f8fafc;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Mobile First: Full screen, tight fit with zero scrolling */
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 100vh;
            background: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .header-section {
            text-align: center;
            padding-top: 4px;
        }

        .mission-badge {
            display: inline-block;
            background-color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow-border);
            color: #854d0e;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 3px;
            letter-spacing: -0.02em;
        }

        .description {
            font-size: 0.72rem;
            color: var(--text-muted);
            line-height: 1.25;
            padding: 0 10px;
            margin-bottom: 8px;
        }

        /* Form Layout Optimized for Compact Mobile Screens */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            text-align: left;
            flex-grow: 1;
            align-content: start;
        }

        .form-group {
            margin-bottom: 2px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.8rem;
            background-color: #fff;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group textarea {
            resize: none;
            height: 40px;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: var(--btn-orange);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--btn-orange);
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 6px;
            margin-bottom: 6px;
            box-shadow: 0 4px 12px rgba(251, 146, 60, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .notification {
            display: none;
            padding: 20px;
            background-color: #dcfce7;
            border: 1px solid #bbf7d0;
            color: #166534;
            font-size: 0.85rem;
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-section">
            <div class="mission-badge">Join Our Team</div>
            <h1>Employee Registration</h1>
            <p class="description">
                Upload your resume to Google Drive, enable sharing, and paste the accessible link below with your background details.
            </p>
        </div>

        <form id="employeeRegForm" onsubmit="handleRegistration(event)">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>

                <div class="form-group">
                    <label for="experienceYears">Experience (Years)</label>
                    <input type="number" id="experienceYears" min="0" max="50" placeholder="e.g., 3" required>
                </div>

                <div class="form-group full-width">
                    <label for="experienceDetails">Work Experience Detail (Food / Operations)</label>
                    <textarea id="experienceDetails" placeholder="Briefly specify your industry roles, quality control, or supply chain background..." required></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="resumeLink">Google Drive Resume Link</label>
                    <input type="url" id="resumeLink" placeholder="https://drive.google.com/file/d/..." required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Submit Application</button>
        </form>

        <div id="successNotification" class="notification">
            Application submitted successfully! Our recruitment team will review your credentials.
        </div>
    </div>

    <script>
        function handleRegistration(event) {
            event.preventDefault();
            const form = document.getElementById('employeeRegForm');
            const notification = document.getElementById('successNotification');
            
            form.style.display = 'none';
            notification.style.display = 'block';
        }
    </script>
</body>
</html>
