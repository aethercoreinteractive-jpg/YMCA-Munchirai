<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration - My Food</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-yellow: #fef08a;
            --accent-yellow-border: #fde047;
            --btn-orange: #fb923c;
            --btn-orange-hover: #f97316;
            --card-bg: #f8fafc;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .mission-badge {
            display: inline-block;
            background-color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow-border);
            color: #854d0e;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .description {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Inbuilt Custom Modal Form Styling */
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #fff;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: var(--btn-orange);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--btn-orange);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(251, 146, 60, 0.3);
        }

        .btn-submit:hover {
            background-color: var(--btn-orange-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Inbuilt Custom Notification Banner instead of browser default popup */
        .notification {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background-color: #dcfce7;
            border: 1px solid #bbf7d0;
            color: #166534;
            font-size: 0.9rem;
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="mission-badge">Join Our Team</div>
        <h1>Employee Registration</h1>
        <p class="description">
            Please fill out the structural details below to submit your official application for review by our recruitment operations team.
        </p>

        <!-- Inbuilt Form with zero default browser alert popups -->
        <form id="employeeRegForm" onsubmit="handleRegistration(event)">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="department">Preferred Department</label>
                <select id="department" required>
                    <option value="" disabled selected>Select department</option>
                    <option value="quality">Quality Management</option>
                    <option value="supply-chain">Supply Chain & Logistics</option>
                    <option value="agriculture">Sustainable Agricultural Ventures</option>
                    <option value="corporate">Corporate Operations</option>
                </select>
            </div>

            <div class="form-group">
                <label for="resumeLink">Resume / Portfolio Link (Google Drive)</label>
                <input type="url" id="resumeLink" placeholder="https://drive.google.com/..." required>
            </div>

            <button type="submit" class="btn-submit">Submit Application</button>
        </form>

        <!-- Inbuilt confirmation box -->
        <div id="successNotification" class="notification">
            Application submitted successfully! Our team will review your profile.
        </div>
    </div>

    <script>
        function handleRegistration(event) {
            // Prevents page reload and any browser native popup behavior
            event.preventDefault();

            // Hide form or show inbuilt customized UI status feedback
            const form = document.getElementById('employeeRegForm');
            const notification = document.getElementById('successNotification');

            // Optional: Handle data or firebase integration hook here seamlessly
            form.style.display = 'none';
            notification.style.display = 'block';
        }
    </script>
</body>
  </html>
