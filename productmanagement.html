<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Management | Admin Control Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151c2c', 900: '#0f172a', 950: '#090d16' },
                        amber: { 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .enterprise-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }
        .enterprise-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.03);
        }
        /* Explicit toggle switch styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .2s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        input:checked + .slider {
            background-color: #f59e0b;
        }
        input:checked + .slider:before {
            transform: translateX(16px);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- SECURITY GATEKEEPER & REDIRECT CHECK -->
    <script>
        if (!sessionStorage.getItem("admin_authenticated") || !sessionStorage.getItem("ymca_redirect_token")) {
            window.location.href = "admin.html";
        }
    </script>

    <!-- INDUSTRY STANDARD PROFESSIONAL NOTIFICATION TOAST -->
    <div id="toast-notification" class="fixed top-5 right-5 z-50 transform translate-y-[-150%] opacity-0 transition-all duration-300 max-w-sm w-full bg-slate-900/95 backdrop-blur-md text-white px-4 py-3.5 rounded-2xl shadow-2xl border border-slate-800 flex items-center gap-3">
        <div id="toast-icon-wrapper" class="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs flex-shrink-0">
            <i id="toast-icon" class="fa-solid fa-check"></i>
        </div>
        <div class="flex-grow min-w-0">
            <h4 id="toast-title" class="text-xs font-extrabold text-white tracking-tight">Success</h4>
            <p id="toast-message" class="text-[11px] text-slate-400 truncate">Action completed successfully.</p>
        </div>
        <button onclick="window.hideToast()" class="text-slate-500 hover:text-slate-300 transition text-xs p-1">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- CATEGORY FILTER POP-UP MODAL -->
    <div id="category-modal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-2xl border border-slate-200 space-y-4 animate-in fade-in zoom-in duration-200">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-600 flex items-center justify-center text-xs">
                        <i class="fa-solid fa-filter"></i>
                    </div>
                    <h3 class="text-sm font-black text-slate-900 uppercase tracking-wider">Select Category</h3>
                </div>
                <button onclick="window.closeCategoryModal()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div id="modal-categories-list" class="space-y-1.5 max-h-72 overflow-y-auto pr-1">
                <!-- Dynamically populated categories -->
            </div>
        </div>
    </div>

    <!-- HEADER NAVIGATION -->
    <header class="bg-slate-900 text-slate-100 border-b border-slate-800 sticky top-0 z-40 shadow-lg">
        <div class="max-w-5xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <a href="admin.html" onclick="sessionStorage.setItem('ymca_redirect_token', 'active');" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 font-black flex items-center justify-center text-xs sm:text-sm tracking-tighter shadow-md flex-shrink-0 overflow-hidden border border-amber-400/30">
                    MY
                </a>
                <div>
                    <h1 class="text-xs sm:text-sm font-extrabold text-white tracking-tight leading-none">MY Food</h1>
                    <span class="text-[9px] sm:text-[10px] text-amber-400 font-semibold tracking-wide block mt-0.5">Product Feed Control</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a href="admininventory.html" onclick="sessionStorage.setItem('ymca_redirect_token', 'active');" class="px-2.5 sm:px-3 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 transition border border-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-boxes-stacked text-amber-400 text-xs"></i> <span class="hidden sm:inline">Inventory Hub</span>
                </a>
                <a href="addproduct.html" onclick="sessionStorage.setItem('ymca_redirect_token', 'active');" class="px-3 py-2 rounded-xl text-xs font-semibold text-slate-950 bg-amber-500 hover:bg-amber-400 transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-xs"></i> <span>Add Product</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN FEED CONTAINER -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-3 sm:px-6 py-4 sm:py-8 space-y-4">
        
        <!-- Search & Category Pop-up Trigger Bar -->
        <div class="bg-white p-3 sm:p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center justify-between w-full sm:w-auto gap-3">
                <h2 class="text-xs sm:text-sm font-black text-slate-900 uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block animate-pulse"></span>
                    Live Feed
                </h2>
                <!-- Category Pop-up Trigger Button -->
                <button onclick="window.openCategoryModal()" class="bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-list text-amber-600"></i>
                    <span id="active-category-label">All Categories</span>
                    <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
                </button>
            </div>

            <!-- Search Box -->
            <div class="relative w-full sm:max-w-xs">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-xs">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="feed-search" placeholder="Search products..." oninput="applyFilters()" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-8 pr-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-500 shadow-inner">
            </div>
        </div>

        <!-- Vertical Scrolling Product List Container -->
        <div id="product-feed-list" class="space-y-3 sm:space-y-4">
            <div class="text-center py-16 bg-white rounded-2xl border border-slate-200 text-slate-400 text-xs font-medium">
                <i class="fa-solid fa-spinner fa-spin text-amber-500 text-lg mb-2"></i><br>Loading product feed...
            </div>
        </div>

    </main>

    <!-- ENTERPRISE FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 px-4 text-center text-[11px] font-medium text-slate-500">
        MY Food Admin Panel &bull; Vertical Management Stream
    </footer>

    <!-- FIREBASE & FEED CONTROLLER SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let globalInventory = [];
        let categoriesCache = [];
        let activeCategoryFilter = "ALL";
        let toastTimeout = null;

        window.formatDriveUrl = function(rawUrl) {
            if (!rawUrl) return "";
            let url = rawUrl.trim();
            const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            const matchId = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (matchId && matchId[1]) {
                return `https://lh3.googleusercontent.com/d/${matchId[1]}`;
            }
            return url;
        };

        window.showToast = function(title, message, isError = false) {
            const toast = document.getElementById('toast-notification');
            const titleEl = document.getElementById('toast-title');
            const msgEl = document.getElementById('toast-message');
            const iconWrapper = document.getElementById('toast-icon-wrapper');
            const icon = document.getElementById('toast-icon');

            titleEl.innerText = title;
            msgEl.innerText = message;

            if (isError) {
                iconWrapper.className = "w-9 h-9 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xs flex-shrink-0";
                icon.className = "fa-solid fa-triangle-exclamation";
            } else {
                iconWrapper.className = "w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs flex-shrink-0";
                icon.className = "fa-solid fa-circle-check";
            }

            toast.classList.remove('translate-y-[-150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                window.hideToast();
            }, 3500);
        };

        window.hideToast = function() {
            const toast = document.getElementById('toast-notification');
            if (toast) {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-150%]', 'opacity-0');
            }
        };

        // Modal Controls
        window.openCategoryModal = function() {
            document.getElementById('category-modal').classList.remove('hidden');
            document.getElementById('category-modal').classList.add('flex');
        };

        window.closeCategoryModal = function() {
            document.getElementById('category-modal').classList.remove('flex');
            document.getElementById('category-modal').classList.add('hidden');
        };

        // Fetch categories for modal pop-up list
        const categoriesRef = ref(db, 'categories');
        onValue(categoriesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                categoriesCache = Object.keys(data).map(key => ({ key, ...data[key] }));
                categoriesCache.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            } else {
                categoriesCache = [];
            }
            renderModalCategories();
        });

        function renderModalCategories() {
            const container = document.getElementById('modal-categories-list');
            let html = `
                <button onclick="window.selectCategory('ALL')" class="w-full text-left px-4 py-3 rounded-xl text-xs font-bold transition flex items-center justify-between ${activeCategoryFilter === 'ALL' ? 'bg-amber-50 text-amber-900 border border-amber-200' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200'}">
                    <span>All Categories</span>
                    ${activeCategoryFilter === 'ALL' ? '<i class="fa-solid fa-check text-amber-600"></i>' : ''}
                </button>
            `;

            categoriesCache.forEach(cat => {
                const isActive = activeCategoryFilter === cat.name;
                html += `
                    <button onclick="window.selectCategory('${cat.name}')" class="w-full text-left px-4 py-3 rounded-xl text-xs font-bold transition flex items-center justify-between ${isActive ? 'bg-amber-50 text-amber-900 border border-amber-200' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200'}">
                        <span>${cat.name}</span>
                        ${isActive ? '<i class="fa-solid fa-check text-amber-600"></i>' : ''}
                    </button>
                `;
            });

            container.innerHTML = html;
        }

        window.selectCategory = function(catName) {
            activeCategoryFilter = catName;
            document.getElementById('active-category-label').textContent = catName === 'ALL' ? 'All Categories' : catName;
            renderModalCategories();
            closeCategoryModal();
            applyFilters();
        };

        // Real-time listener for Inventory Feed
        const inventoryRef = ref(db, 'inventory');
        onValue(inventoryRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                globalInventory = Object.keys(data).map(key => ({
                    firebaseKey: key,
                    ...data[key]
                }));
            } else {
                globalInventory = [];
            }
            applyFilters();
        });

        window.applyFilters = function() {
            const query = document.getElementById('feed-search').value.toLowerCase().trim();
            
            let filtered = globalInventory.filter(item => {
                const matchesCat = (activeCategoryFilter === 'ALL') || (item.category === activeCategoryFilter);
                const matchesSearch = !query || (item.name && item.name.toLowerCase().includes(query)) || (item.category && item.category.toLowerCase().includes(query));
                return matchesCat && matchesSearch;
            });

            renderProductFeed(filtered);
        };

        window.renderProductFeed = function(items) {
            const listContainer = document.getElementById('product-feed-list');

            if (items.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-2xl border border-slate-200 text-slate-400 text-xs font-medium">
                        <i class="fa-solid fa-boxes-packing text-slate-300 text-2xl mb-2"></i><br>No matching products found.
                    </div>
                `;
                return;
            }

            let html = '';
            items.forEach(item => {
                const inStock = item.inStock !== false;
                const hasOffer = item.hasOffer === true;
                const offerPercent = item.offerPercent || 0;
                const rawPrice = Number(typeof item.price === 'string' ? item.price.replace('₹', '') : item.price) || 0;
                const formattedImg = window.formatDriveUrl(item.img) || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=300';
                const smallDesc = item.descSmall || item.smallDesc || item.desc || item.description || 'No summary description available.';

                html += `
                    <div class="enterprise-card rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
                        
                        <!-- Left: Thumbnail & Core Info -->
                        <div class="flex items-center gap-3.5 w-full sm:w-auto flex-grow min-w-0">
                            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-slate-50 border border-slate-200 rounded-xl overflow-hidden flex items-center justify-center shrink-0">
                                <img src="${formattedImg}" alt="${item.name}" class="w-full h-full object-contain p-1">
                            </div>
                            <div class="space-y-1 min-w-0 flex-grow">
                                <div class="flex items-center gap-2">
                                    <span class="text-[9px] font-extrabold uppercase tracking-widest text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200 truncate max-w-[120px]">${item.category || 'General'}</span>
                                    <span class="text-[10px] text-slate-400 font-medium">Qty: ${item.qty || 'Std'}</span>
                                </div>
                                <h3 class="text-xs sm:text-sm font-extrabold text-slate-900 truncate">${item.name}</h3>
                                <p class="text-[11px] text-slate-500 line-clamp-1">${smallDesc}</p>
                                <div class="text-xs font-bold text-slate-900">₹${rawPrice.toFixed(2).replace(/\.00$/, '')}</div>
                            </div>
                        </div>

                        <!-- Right: Industrial Controls -->
                        <div class="flex items-center justify-between sm:justify-end gap-2 sm:gap-3 w-full sm:w-auto pt-3 sm:pt-0 border-t sm:border-t-0 border-slate-100 shrink-0">
                                <!-- 1. Stock Availability Toggle Switch -->
                            <div class="flex items-center gap-2 bg-slate-50 px-2.5 sm:px-3 py-2 rounded-xl border border-slate-200">
                                <div class="text-right">
                                    <span class="block text-[9px] sm:text-[10px] font-bold text-slate-700 uppercase tracking-tight">Stock</span>
                                    <span id="stock-text-${item.firebaseKey}" class="text-[8px] sm:text-[9px] font-semibold ${inStock ? 'text-emerald-600' : 'text-rose-600'}">${inStock ? 'Available' : 'Out'}</span>
                                </div>
                                <label class="switch">
                                    <input type="checkbox" ${inStock ? 'checked' : ''} onchange="window.toggleProductStock('${item.firebaseKey}', this.checked)">
                                    <span class="slider"></span>
                                </label>
                            </div>

                            <!-- 2. Offer Toggle & Percentage Input -->
                            <div class="flex items-center gap-2 bg-slate-50 px-2.5 sm:px-3 py-2 rounded-xl border border-slate-200">
                                <div class="text-right">
                                    <span class="block text-[9px] sm:text-[10px] font-bold text-slate-700 uppercase tracking-tight">Offer</span>
                                    <span id="offer-status-text-${item.firebaseKey}" class="text-[8px] sm:text-[9px] font-semibold ${hasOffer ? 'text-amber-600' : 'text-slate-400'}">${hasOffer ? 'Active' : 'Off'}</span>
                                </div>
                                <label class="switch">
                                    <input type="checkbox" ${hasOffer ? 'checked' : ''} onchange="window.toggleOfferSwitch('${item.firebaseKey}', this.checked)">
                                    <span class="slider"></span>
                                </label>
                                <div class="relative flex items-center ml-0.5">
                                    <input type="number" min="0" max="100" value="${offerPercent}" id="offer-input-${item.firebaseKey}" ${!hasOffer ? 'disabled' : ''} onchange="window.updateOfferPercent('${item.firebaseKey}', this.value)" placeholder="%" class="w-10 bg-white border border-slate-200 rounded-lg px-1 py-1 text-[11px] text-center font-bold text-slate-900 focus:outline-none focus:border-amber-500 disabled:opacity-30 shadow-inner">
                                    <span class="text-[9px] text-slate-400 font-bold ml-0.5">%</span>
                                </div>
                            </div>

                            <!-- 3. Edit Action Button -->
                            <button onclick="sessionStorage.setItem('ymca_redirect_token', 'active'); window.location.href='addproduct.html?id=${item.firebaseKey}'" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-3 py-2.5 rounded-xl text-xs transition shadow-sm flex items-center gap-1.5" title="Edit Product">
                                <i class="fa-solid fa-pen-to-square text-amber-400 text-[11px]"></i>
                                <span class="hidden md:inline">Edit</span>
                            </button>

                        </div>

                    </div>
                `;
            });

            listContainer.innerHTML = html;
        };

        // Auto-save Stock Switch
        window.toggleProductStock = async function(firebaseKey, isChecked) {
            try {
                const productRef = ref(db, `inventory/${firebaseKey}`);
                await update(productRef, { inStock: isChecked });
                
                const statusLabel = document.getElementById(`stock-text-${firebaseKey}`);
                if (statusLabel) {
                    statusLabel.className = `text-[8px] sm:text-[9px] font-semibold ${isChecked ? 'text-emerald-600' : 'text-rose-600'}`;
                    statusLabel.textContent = isChecked ? 'Available' : 'Out';
                }
                window.showToast("Stock Updated", "Availability status saved successfully.");
            } catch (err) {
                console.error("Error updating stock:", err);
                window.showToast("Action Failed", "Could not update stock status.", true);
            }
        };

        // Auto-save Offer Switch
        window.toggleOfferSwitch = async function(firebaseKey, isChecked) {
            try {
                const inputEl = document.getElementById(`offer-input-${firebaseKey}`);
                const statusText = document.getElementById(`offer-status-text-${firebaseKey}`);
                
                if (inputEl) {
                    inputEl.disabled = !isChecked;
                }
                if (statusText) {
                    statusText.className = `text-[8px] sm:text-[9px] font-semibold ${isChecked ? 'text-amber-600' : 'text-slate-400'}`;
                    statusText.textContent = isChecked ? 'Active' : 'Off';
                }

                const currentVal = inputEl ? Number(inputEl.value) || 0 : 0;
                
                const productRef = ref(db, `inventory/${firebaseKey}`);
                await update(productRef, { 
                    hasOffer: isChecked,
                    offerPercent: isChecked ? (currentVal > 0 ? currentVal : 10) : 0
                });
                window.showToast("Offer State Saved", "Promotional status updated.");
            } catch (err) {
                console.error("Error updating offer toggle:", err);
                window.showToast("Action Failed", "Could not update offer toggle.", true);
            }
        };

        // Auto-save Offer Percentage Input
        window.updateOfferPercent = async function(firebaseKey, val) {
            const num = Math.max(0, Math.min(100, Number(val) || 0));
            try {
                const productRef = ref(db, `inventory/${firebaseKey}`);
                await update(productRef, { offerPercent: num, hasOffer: true });
                window.showToast("Discount Saved", `Discount updated to ${num}%.`);
            } catch (err) {
                console.error("Error updating discount percentage:", err);
                window.showToast("Action Failed", "Could not update discount.", true);
            }
        };
    </script>
</body>
</html>
