<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Management | Admin Control Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151c2c', 900: '#0f172a', 950: '#090d16' },
                        amber: { 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .enterprise-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }
        .enterprise-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- SECURITY GATEKEEPER & REDIRECT CHECK -->
    <script>
        if (!sessionStorage.getItem("admin_authenticated") || !sessionStorage.getItem("ymca_redirect_token")) {
            window.location.href = "admin.html";
        }
    </script>

    <!-- INBUILT NOTIFICATION TOAST -->
    <div id="toast-notification" class="fixed top-20 right-4 sm:right-6 z-50 transform translate-y-[-150%] opacity-0 transition-all duration-300 max-w-sm w-full bg-slate-900 text-white px-4 py-3.5 rounded-2xl shadow-2xl border border-slate-800 flex items-center gap-3">
        <div id="toast-icon-wrapper" class="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs flex-shrink-0">
            <i id="toast-icon" class="fa-solid fa-check"></i>
        </div>
        <div class="flex-grow">
            <h4 id="toast-title" class="text-xs font-bold text-white">Success</h4>
            <p id="toast-message" class="text-[11px] text-slate-400">Action completed successfully.</p>
        </div>
    </div>

    <!-- HEADER NAVIGATION -->
    <header class="bg-slate-900 text-slate-100 border-b border-slate-800 sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <a href="admin.html" onclick="sessionStorage.setItem('ymca_redirect_token', 'active');" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 font-black flex items-center justify-center text-xs sm:text-sm tracking-tighter shadow-md flex-shrink-0 overflow-hidden border border-amber-400/30">
                    MY
                </a>
                <div>
                    <h1 class="text-xs sm:text-sm font-extrabold text-white tracking-tight leading-none">MY Food</h1>
                    <span class="text-[9px] sm:text-[10px] text-amber-400 font-semibold tracking-wide block mt-0.5">Product Feed Control</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a href="admininventory.html" onclick="sessionStorage.setItem('ymca_redirect_token', 'active');" class="px-3 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 transition border border-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-boxes-stacked text-amber-400 text-xs"></i> <span>Inventory Hub</span>
                </a>
                <a href="addproduct.html" onclick="sessionStorage.setItem('ymca_redirect_token', 'active');" class="px-3 py-2 rounded-xl text-xs font-semibold text-slate-950 bg-amber-500 hover:bg-amber-400 transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-xs"></i> <span class="hidden sm:inline">Add Product</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN FEED CONTAINER (Scrolling Up to Down) -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-4">
        
        <!-- Feed Control Header Bar -->
        <div class="flex items-center justify-between bg-white px-5 py-4 rounded-2xl border border-slate-200 shadow-sm">
            <div>
                <h2 class="text-xs sm:text-sm font-black text-slate-900 uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block animate-pulse"></span>
                    Live Product Feed
                </h2>
                <p id="feed-counter" class="text-[11px] text-slate-500 mt-0.5">Synchronizing database records...</p>
            </div>
            <div class="relative">
                <input type="text" id="feed-search" placeholder="Filter products..." oninput="filterProductFeed()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-500 w-36 sm:w-48 shadow-inner">
            </div>
        </div>

        <!-- Vertical Scrolling List Container -->
        <div id="product-feed-list" class="space-y-4">
            <div class="text-center py-16 text-slate-400 text-xs font-medium bg-white rounded-2xl border border-slate-200">
                <i class="fa-solid fa-spinner fa-spin text-amber-500 text-lg mb-2"></i><br>Loading product feed...
            </div>
        </div>

    </main>

    <!-- ENTERPRISE FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 px-4 text-center text-[11px] font-medium text-slate-500">
        MY Food Admin Panel &bull; Vertical Management Stream
    </footer>

    <!-- FIREBASE & FEED CONTROLLER SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let globalInventory = [];

        window.formatDriveUrl = function(rawUrl) {
            if (!rawUrl) return "";
            let url = rawUrl.trim();
            const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            const matchId = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (matchId && matchId[1]) {
                return `https://lh3.googleusercontent.com/d/${matchId[1]}`;
            }
            return url;
        };

        window.showToast = function(title, message, isError = false) {
            const toast = document.getElementById('toast-notification');
            const titleEl = document.getElementById('toast-title');
            const msgEl = document.getElementById('toast-message');
            const iconWrapper = document.getElementById('toast-icon-wrapper');
            const icon = document.getElementById('toast-icon');

            titleEl.innerText = title;
            msgEl.innerText = message;

            if (isError) {
                iconWrapper.className = "w-9 h-9 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xs flex-shrink-0";
                icon.className = "fa-solid fa-circle-exclamation";
            } else {
                iconWrapper.className = "w-9 h-9 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs flex-shrink-0";
                icon.className = "fa-solid fa-check";
            }

            toast.classList.remove('translate-y-[-150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-150%]', 'opacity-0');
            }, 3000);
        };

        // Real-time listener for Inventory Feed
        const inventoryRef = ref(db, 'inventory');
        onValue(inventoryRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                globalInventory = Object.keys(data).map(key => ({
                    firebaseKey: key,
                    ...data[key]
                }));
            } else {
                globalInventory = [];
            }
            renderProductFeed(globalInventory);
        });

        window.renderProductFeed = function(items) {
            const listContainer = document.getElementById('product-feed-list');
            const counterEl = document.getElementById('feed-counter');
            
            counterEl.textContent = `Displaying ${items.length} active catalog record${items.length === 1 ? '' : 's'}`;

            if (items.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-2xl border border-slate-200 text-slate-400 text-xs font-medium">
                        <i class="fa-solid fa-boxes-packing text-slate-300 text-2xl mb-2"></i><br>No inventory items found.
                    </div>
                `;
                return;
            }

            let html = '';
            items.forEach(item => {
                const inStock = item.inStock !== false;
                const hasOffer = item.hasOffer === true;
                const offerPercent = item.offerPercent || 0;
                const rawPrice = Number(typeof item.price === 'string' ? item.price.replace('₹', '') : item.price) || 0;
                const formattedImg = window.formatDriveUrl(item.img) || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=300';
                const smallDesc = item.descSmall || item.smallDesc || item.desc || item.description || 'No summary description available.';

                html += `
                    <div class="enterprise-card rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        
                        <!-- Left: Thumbnail & Core Info -->
                        <div class="flex items-center gap-3.5 w-full sm:w-auto flex-grow">
                            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-slate-50 border border-slate-200 rounded-xl overflow-hidden flex items-center justify-center shrink-0">
                                <img src="${formattedImg}" alt="${item.name}" class="w-full h-full object-contain p-1">
                            </div>
                            <div class="space-y-1 min-w-0 flex-grow">
                                <div class="flex items-center gap-2">
                                    <span class="text-[9px] font-extrabold uppercase tracking-widest text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">${item.category || 'General'}</span>
                                    <span class="text-[10px] text-slate-400 font-medium">Qty: ${item.qty || 'Std'}</span>
                                </div>
                                <h3 class="text-xs sm:text-sm font-extrabold text-slate-900 truncate">${item.name}</h3>
                                <p class="text-[11px] text-slate-500 line-clamp-1">${smallDesc}</p>
                                <div class="text-xs font-bold text-slate-900">₹${rawPrice.toFixed(2).replace(/\.00$/, '')}</div>
                            </div>
                        </div>

                        <!-- Right: Industrial Controls (Stock Toggle, Offer Toggle + Input, Edit Button) -->
                        <div class="flex flex-wrap sm:flex-nowrap items-center justify-between sm:justify-end gap-3 w-full sm:w-auto pt-3 sm:pt-0 border-t sm:border-t-0 border-slate-100">
                            
                            <!-- 1. Stock Availability Toggle Switch -->
                            <div class="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200">
                                <div class="text-right">
                                    <span class="block text-[10px] font-bold text-slate-700 uppercase tracking-tight">Stock</span>
                                    <span id="stock-text-${item.firebaseKey}" class="text-[9px] font-semibold ${inStock ? 'text-emerald-600' : 'text-rose-600'}">${inStock ? 'Available' : 'Out'}</span>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" ${inStock ? 'checked' : ''} onchange="window.toggleProductStock('${item.firebaseKey}', this.checked)" class="sr-only peer">
                                    <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
                                </label>
                            </div>

                            <!-- 2. Offer On/Off Switch & Percentage Input -->
                            <div class="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200">
                                <div class="text-right">
                                    <span class="block text-[10px] font-bold text-slate-700 uppercase tracking-tight">Offer</span>
                                    <span id="offer-status-text-${item.firebaseKey}" class="text-[9px] font-semibold ${hasOffer ? 'text-amber-600' : 'text-slate-400'}">${hasOffer ? 'Active' : 'Off'}</span>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" ${hasOffer ? 'checked' : ''} onchange="window.toggleOfferSwitch('${item.firebaseKey}', this.checked)" class="sr-only peer">
                                    <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
                                </label>
                                <div class="relative flex items-center ml-1">
                                    <input type="number" min="0" max="100" value="${offerPercent}" id="offer-input-${item.firebaseKey}" ${!hasOffer ? 'disabled' : ''} onchange="window.updateOfferPercent('${item.firebaseKey}', this.value)" placeholder="%" class="w-11 bg-white border border-slate-200 rounded-lg px-1.5 py-1 text-xs text-center font-bold text-slate-900 focus:outline-none focus:border-amber-500 disabled:opacity-30 shadow-inner">
                                    <span class="text-[10px] text-slate-400 font-bold ml-0.5">%</span>
                                </div>
                            </div>

                            <!-- 3. Edit Action Button -> Leads to addproduct.html with ID -->
                            <button onclick="sessionStorage.setItem('ymca_redirect_token', 'active'); window.location.href='addproduct.html?id=${item.firebaseKey}'" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-3.5 py-2.5 rounded-xl text-xs transition shadow-sm flex items-center gap-1.5 ml-auto sm:ml-0" title="Edit Product">
                                <i class="fa-solid fa-pen-to-square text-amber-400 text-[11px]"></i>
                                <span>Edit</span>
                            </button>

                        </div>

                    </div>
                `;
            });

            listContainer.innerHTML = html;
        };

        window.filterProductFeed = function() {
            const query = document.getElementById('feed-search').value.toLowerCase().trim();
            if (!query) {
                renderProductFeed(globalInventory);
                return;
            }
            const filtered = globalInventory.filter(item => 
                (item.name && item.name.toLowerCase().includes(query)) ||
                (item.category && item.category.toLowerCase().includes(query))
            );
            renderProductFeed(filtered);
        };

        // Auto-save Stock Switch
        window.toggleProductStock = async function(firebaseKey, isChecked) {
            try {
                const productRef = ref(db, `inventory/${firebaseKey}`);
                await update(productRef, { inStock: isChecked });
                
                const statusLabel = document.getElementById(`stock-text-${firebaseKey}`);
                if (statusLabel) {
                    statusLabel.className = `text-[9px] font-semibold ${isChecked ? 'text-emerald-600' : 'text-rose-600'}`;
                    statusLabel.textContent = isChecked ? 'Available' : 'Out';
                }
                window.showToast("Updated", "Stock availability auto-saved.");
            } catch (err) {
                console.error("Error updating stock:", err);
                window.showToast("Error", "Failed to auto-save stock.", true);
            }
        };

        // Auto-save Offer Switch
        window.toggleOfferSwitch = async function(firebaseKey, isChecked) {
            try {
                const inputEl = document.getElementById(`offer-input-${firebaseKey}`);
                const statusText = document.getElementById(`offer-status-text-${firebaseKey}`);
                
                if (inputEl) {
                    inputEl.disabled = !isChecked;
                }
                if (statusText) {
                    statusText.className = `text-[9px] font-semibold ${isChecked ? 'text-amber-600' : 'text-slate-400'}`;
                    statusText.textContent = isChecked ? 'Active' : 'Off';
                }

                const currentVal = inputEl ? Number(inputEl.value) || 0 : 0;
                
                const productRef = ref(db, `inventory/${firebaseKey}`);
                await update(productRef, { 
                    hasOffer: isChecked,
                    offerPercent: isChecked ? (currentVal > 0 ? currentVal : 10) : 0
                });
                window.showToast("Updated", "Offer switch auto-saved.");
            } catch (err) {
                console.error("Error updating offer toggle:", err);
                window.showToast("Error", "Failed to auto-save offer state.", true);
            }
        };

        // Auto-save Offer Percentage Input
        window.updateOfferPercent = async function(firebaseKey, val) {
            const num = Math.max(0, Math.min(100, Number(val) || 0));
            try {
                const productRef = ref(db, `inventory/${firebaseKey}`);
                await update(productRef, { offerPercent: num, hasOffer: true });
                
                // Automatically activate the switch UI if user typed a percentage
                const item = globalInventory.find(p => p.firebaseKey === firebaseKey);
                if (item) item.hasOffer = true;
                
                window.showToast("Saved", `Discount updated to ${num}%.`);
            } catch (err) {
                console.error("Error updating discount percentage:", err);
                window.showToast("Error", "Failed to update discount.", true);
            }
        };
    </script>
</body>
</html>
