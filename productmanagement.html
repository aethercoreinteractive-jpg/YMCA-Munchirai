<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Product Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#090d16',
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- ENTERPRISE NAVIGATION HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
            <!-- Brand Mark -->
            <div class="flex items-center gap-3 shrink-0">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 font-black flex items-center justify-center text-xs tracking-tighter shadow-md">MY</div>
                <div>
                    <h1 class="text-xs font-extrabold text-white tracking-tight">MUNCHIRAI YMCA</h1>
                    <span class="text-[10px] text-amber-400 font-mono tracking-wider block">DATABASE_NODE</span>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="flex items-center gap-2">
                <a href="addproduct.html" class="px-3 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-sm flex items-center gap-1.5 transition active:scale-95">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>Add Product</span>
                </a>
                <a href="admin.html" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 shadow-sm flex items-center gap-1.5 transition active:scale-95">
                    <i class="fa-solid fa-arrow-left text-amber-400"></i>
                    <span class="hidden xs:inline">Admin Hub</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-10 flex-grow space-y-6">
        
        <!-- Controls Bar Section -->
        <section class="bg-white rounded-3xl p-5 sm:p-6 shadow-xl shadow-slate-200/50 border border-slate-200/80 flex flex-col sm:flex-row gap-4 items-center justify-between">
            <div class="w-full sm:w-auto">
                <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200/60">Inventory Database</span>
                <h2 class="text-base sm:text-lg font-extrabold text-slate-900 mt-1.5">Product Management</h2>
            </div>

            <!-- Search & Filter Controls -->
            <div class="flex flex-wrap items-center gap-2.5 w-full sm:w-auto">
                <div class="relative flex-grow sm:w-64">
                    <i class="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="search-input" placeholder="Search products..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition shadow-sm">
                </div>
                <select id="filter-category" class="bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white transition shadow-sm">
                    <option value="">All Categories</option>
                </select>
            </div>
        </section>

        <div id="db-status-msg" class="hidden mb-4 p-3.5 rounded-xl text-xs font-medium text-center shadow-sm"></div>

        <!-- Inventory Container -->
        <section class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200/80 overflow-hidden">
            <!-- Desktop Table View -->
            <div class="hidden md:block overflow-x-auto no-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-[10px] font-extrabold uppercase tracking-widest text-slate-500">
                            <th class="py-4 px-5">Product</th>
                            <th class="py-4 px-4">Category</th>
                            <th class="py-4 px-4">Price</th>
                            <th class="py-4 px-4">Unit</th>
                            <th class="py-4 px-4">Rating</th>
                            <th class="py-4 px-5 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body" class="divide-y divide-slate-100 text-xs font-medium text-slate-700">
                        <tr>
                            <td colspan="6" class="py-10 text-center text-slate-400">Loading inventory records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Mobile Card View -->
            <div id="inventory-card-container" class="md:hidden divide-y divide-slate-100 p-4 space-y-3">
                <div class="py-8 text-center text-slate-400 text-xs">Loading inventory records...</div>
            </div>
        </section>

    </main>

    <!-- ENTERPRISE FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 py-5 px-4 text-center text-[11px] text-slate-400">
        Munchirai YMCA Secure Portal &bull; Enterprise Operations Center
    </footer>

    <!-- Firebase Realtime Engine & Analytics -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        let rawInventoryCache = [];
        let categoriesCache = [];

        const searchInput = document.getElementById('search-input');
        const filterCategory = document.getElementById('filter-category');
        const tableBody = document.getElementById('inventory-table-body');
        const cardContainer = document.getElementById('inventory-card-container');

        function showStatus(message, isError = false) {
            const msgEl = document.getElementById('db-status-msg');
            msgEl.textContent = message;
            msgEl.className = `mb-4 p-3.5 rounded-xl text-xs font-medium text-center shadow-sm ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            msgEl.classList.remove('hidden');
            setTimeout(() => { msgEl.classList.add('hidden'); }, 4000);
        }

        // Load Categories for filtering dropdown
        onValue(ref(db, 'categories'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                categoriesCache = Object.keys(data).map(k => data[k]);
                categoriesCache.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
                
                const currentSelection = filterCategory.value;
                filterCategory.innerHTML = `<option value="">All Categories</option>` + categoriesCache.map(c => `
                    <option value="${c.name}" ${currentSelection === c.name ? 'selected' : ''}>${c.name}</option>
                `).join('');
            }
        });

        // Load Inventory Data
        onValue(ref(db, 'inventory'), (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                rawInventoryCache = [];
                tableBody.innerHTML = `<tr><td colspan="6" class="py-10 text-center text-slate-400">No products found in inventory.</td></tr>`;
                cardContainer.innerHTML = `<div class="py-10 text-center text-slate-400 text-xs">No products found in inventory.</div>`;
                return;
            }

            rawInventoryCache = Object.keys(data).map(key => ({ key, ...data[key] }));
            renderFilteredInventory();
        });

        // Event listeners for searching and filtering
        searchInput.addEventListener('input', renderFilteredInventory);
        filterCategory.addEventListener('change', renderFilteredInventory);

        function renderFilteredInventory() {
            const query = searchInput.value.toLowerCase().trim();
            const selectedCat = filterCategory.value;

            const filtered = rawInventoryCache.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(query) || (item.category && item.category.toLowerCase().includes(query));
                const matchesCat = !selectedCat || item.category === selectedCat;
                return matchesSearch && matchesCat;
            });

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="py-10 text-center text-slate-400">No matching records found.</td></tr>`;
                cardContainer.innerHTML = `<div class="py-10 text-center text-slate-400 text-xs">No matching records found.</div>`;
                return;
            }

            // Render Desktop Table Rows
            tableBody.innerHTML = filtered.map(item => `
                <tr class="hover:bg-slate-50/80 transition">
                    <td class="py-3.5 px-5">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 rounded-xl bg-slate-100 border border-slate-200 overflow-hidden shrink-0 flex items-center justify-center">
                                <img src="${item.img || ''}" alt="" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100?text=IMG'">
                            </div>
                            <div>
                                <span class="font-bold text-slate-900 block">${item.name}</span>
                                <span class="text-[10px] text-slate-400 font-mono">ID: ${item.key.slice(-6)}</span>
                            </div>
                        </div>
                    </td>
                    <td class="py-3.5 px-4">
                        <span class="bg-amber-50 text-amber-800 border border-amber-200/60 px-2.5 py-1 rounded-md text-[10px] font-bold">${item.category || 'General'}</span>
                    </td>
                    <td class="py-3.5 px-4 font-extrabold text-slate-900">
                        ₹${Number(item.price || 0).toFixed(2)}
                    </td>
                    <td class="py-3.5 px-4 font-bold text-slate-800">
                        ${item.qty || '1 Pc'}
                    </td>
                    <td class="py-3.5 px-4">
                        <span class="flex items-center gap-1 text-amber-600 font-bold text-xs">
                            <i class="fa-solid fa-star text-[10px]"></i> ${item.rating ?? '5'}
                        </span>
                    </td>
                    <td class="py-3.5 px-5 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <a href="addproduct.html?edit=${item.key}" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-800 border border-slate-200 flex items-center justify-center transition active:scale-95" title="Edit Product">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </a>
                            <button onclick="window.deleteProduct('${item.key}', '${item.name}')" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-red-100 text-slate-600 hover:text-red-600 border border-slate-200 flex items-center justify-center transition active:scale-95" title="Delete Product">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');

            // Render Mobile Cards View
            cardContainer.innerHTML = filtered.map(item => `
                <div class="bg-slate-50/70 border border-slate-200/80 rounded-2xl p-4 space-y-3 shadow-sm">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <div class="w-14 h-14 rounded-xl bg-white border border-slate-200 overflow-hidden shrink-0 flex items-center justify-center shadow-sm">
                                <img src="${item.img || ''}" alt="" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100?text=IMG'">
                            </div>
                            <div>
                                <h3 class="font-extrabold text-slate-900 text-sm leading-snug">${item.name}</h3>
                                <span class="bg-amber-50 text-amber-800 border border-amber-200/60 px-2 py-0.5 rounded text-[10px] font-bold inline-block mt-1">${item.category || 'General'}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2 bg-white p-3 rounded-xl border border-slate-200/60 text-center">
                        <div>
                            <span class="block text-[9px] font-bold uppercase tracking-wider text-slate-400">Price</span>
                            <span class="font-extrabold text-slate-900 text-xs">₹${Number(item.price || 0).toFixed(2)}</span>
                        </div>
                        <div>
                            <span class="block text-[9px] font-bold uppercase tracking-wider text-slate-400">Unit</span>
                            <span class="font-bold text-slate-800 text-xs">${item.qty || '1 Pc'}</span>
                        </div>
                        <div>
                            <span class="block text-[9px] font-bold uppercase tracking-wider text-slate-400">Rating</span>
                            <span class="font-bold text-amber-600 text-xs flex items-center justify-center gap-0.5">
                                <i class="fa-solid fa-star text-[9px]"></i> ${item.rating ?? '5'}
                            </span>
                        </div>
                    </div>

                    ${item.descSmall ? `<p class="text-[11px] text-slate-500 line-clamp-1 italic">${item.descSmall}</p>` : ''}

                    <div class="flex items-center justify-end gap-2 pt-1">
                        <a href="addproduct.html?edit=${item.key}" class="flex-grow py-2 rounded-xl bg-slate-200/70 hover:bg-amber-100 text-slate-700 hover:text-amber-900 border border-slate-200 text-xs font-bold text-center transition active:scale-95 flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-pen text-[10px]"></i> Edit Record
                        </a>
                        <button onclick="window.deleteProduct('${item.key}', '${item.name}')" class="px-4 py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold transition active:scale-95 flex items-center justify-center">
                            <i class="fa-solid fa-trash text-[10px]"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Global Delete Handler
        window.deleteProduct = function(key, name) {
            if (confirm(`Are you sure you want to delete "${name}" from inventory?`)) {
                remove(ref(db, `inventory/${key}`))
                    .then(() => showStatus(`Product "${name}" deleted successfully.`))
                    .catch(err => showStatus("Failed to delete product: " + err.message, true));
            }
        };
    </script>
</body>
</html>
