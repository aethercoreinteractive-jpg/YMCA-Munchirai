<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Enterprise CMS & Operations</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151c2c',
                            900: '#0f172a',
                            950: '#090d16',
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Pro/Free Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .light-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- ENTERPRISE AUTHENTICATION MODAL -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden">
        <div class="light-card rounded-2xl max-w-sm w-full p-6 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-500 via-amber-600 to-amber-400"></div>
            
            <div class="w-12 h-12 bg-amber-500/10 text-amber-600 border border-amber-500/20 rounded-xl flex items-center justify-center mx-auto mb-4 text-lg font-bold">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            
            <div class="text-center mb-6">
                <span class="text-[10px] font-extrabold uppercase tracking-widest text-amber-700 bg-amber-500/10 px-2.5 py-1 rounded-md">Authorized personnel only</span>
                <h2 class="text-lg font-extrabold text-slate-900 mt-2">Admin Login</h2>
                <p class="text-xs text-slate-500 mt-1">Secure administrator access</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1.5">Enter administrator password to continue.</label>
                    <div class="relative">
                        <input type="password" id="login-input" required placeholder="••••••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 pr-10 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition">
                        <button type="button" onclick="togglePasswordVisibility('login-input', 'login-eye-icon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1">
                            <i id="login-eye-icon" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>
                <p id="login-error" class="text-[11px] text-red-500 font-semibold hidden flex items-center gap-1.5"><i class="fa-solid fa-circle-exclamation"></i> Incorrect authorization key.</p>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
                    <span>Authenticate Session</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- RESPONSIVE MOBILE-OPTIMIZED NAVIGATION HEADER -->
    <header class="bg-slate-900 text-slate-100 border-b border-slate-800 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            
            <!-- Brand Logo -->
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 font-black flex items-center justify-center text-xs tracking-tighter shadow-md">MY</div>
                <div>
                    <h1 class="text-xs font-bold text-white tracking-tight">YMCA Munchirai</h1>
                    <span class="text-[9px] text-amber-400 font-mono block">SYS_ADMIN_v2.6</span>
                </div>
            </div>
            
            <!-- Header Utility Actions & Payment Control Button -->
            <div class="flex items-center gap-2">
                <a href="paymentcontrol.html" class="px-3 py-2 rounded-xl text-xs font-bold bg-amber-500 text-slate-950 hover:bg-amber-400 transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-credit-card"></i>
                    <span class="hidden xs:inline">Payment Control</span>
                </a>
                <a href="index.html" target="_blank" class="px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition border border-slate-700/80 flex items-center gap-1.5 shadow-sm" title="View Live Site">
                    <i class="fa-solid fa-arrow-up-right-from-square text-amber-400"></i>
                    <span class="hidden xs:inline">View Site</span>
                </a>
                <button onclick="handleLogout()" class="px-3 py-2 rounded-xl text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-950/40 transition border border-red-900/30 flex items-center gap-1.5 shadow-sm" title="Logout">
                    <i class="fa-solid fa-power-off"></i>
                    <span class="hidden xs:inline">Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- EMPTY FLEX GROW AREA -->
    <main class="flex-grow"></main>

    <!-- ENTERPRISE FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 px-4 text-center text-[10px] text-slate-500">
        Munchirai YMCA Secure Portal &bull; Enterprise Operations Center
    </footer>

    <!-- CORE FIREBASE & AUTH SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const FALLBACK_PASSWORD = "Admin@123";
        const IMMUTABLE_COMPANY_CODE = "399812";

        window.togglePasswordVisibility = function(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        };

        async function checkAuth() {
            if (!sessionStorage.getItem("admin_authenticated")) {
                document.getElementById('login-modal').classList.remove('hidden');
            }
        }

        window.handleLogin = async function(event) {
            event.preventDefault();
            const enteredVal = document.getElementById('login-input').value;
            
            try {
                // Check password and company code from Firebase
                const passRef = ref(db, 'settings/adminPassword');
                const codeRef = ref(db, 'settings/companyCode');
                
                const [passSnap, codeSnap] = await Promise.all([get(passRef), get(codeRef)]);
                
                let currentPass = FALLBACK_PASSWORD;
                if (passSnap.exists()) {
                    currentPass = passSnap.val();
                } else {
                    await set(passRef, FALLBACK_PASSWORD);
                }

                let savedCompanyCode = IMMUTABLE_COMPANY_CODE;
                if (codeSnap.exists()) {
                    savedCompanyCode = codeSnap.val();
                } else {
                    await set(codeRef, IMMUTABLE_COMPANY_CODE);
                }

                // Match against either the Admin Password or the Company Code
                if (enteredVal === currentPass || enteredVal === savedCompanyCode) {
                    sessionStorage.setItem("admin_authenticated", "true");
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('login-error').classList.add('hidden');
                    document.getElementById('login-input').value = "";
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            } catch (error) {
                console.error("Login verification error:", error);
                if (enteredVal === FALLBACK_PASSWORD || enteredVal === IMMUTABLE_COMPANY_CODE) {
                    sessionStorage.setItem("admin_authenticated", "true");
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('login-error').classList.add('hidden');
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            }
        };

        window.handleLogout = function() {
            sessionStorage.removeItem("admin_authenticated");
            window.location.reload();
        };

        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
