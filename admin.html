<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Enterprise CMS & Operations</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151c2c',
                            900: '#0f172a',
                            950: '#090d16',
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Pro/Free Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Light theme panel card styling matching public site */
        .light-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- ENTERPRISE AUTHENTICATION MODAL -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden">
        <div class="light-card rounded-2xl max-w-sm w-full p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-500 via-amber-600 to-amber-400"></div>
            
            <div class="w-12 h-12 bg-amber-500/10 text-amber-600 border border-amber-500/20 rounded-xl flex items-center justify-center mx-auto mb-4 text-lg font-bold">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            
            <div class="text-center mb-6">
                <span class="text-[10px] font-extrabold uppercase tracking-widest text-amber-700 bg-amber-500/10 px-2.5 py-1 rounded-md">Restricted Access</span>
                <h2 class="text-lg font-extrabold text-slate-900 mt-2">CMS Security Gateway</h2>
                <p class="text-xs text-slate-500 mt-1">Munchirai YMCA Secure Core Node</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1.5">Master Key / Password</label>
                    <div class="relative">
                        <input type="password" id="login-input" required placeholder="••••••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 pr-10 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition">
                        <button type="button" onclick="togglePasswordVisibility('login-input', 'login-eye-icon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1">
                            <i id="login-eye-icon" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>
                <p id="login-error" class="text-[11px] text-red-500 font-semibold hidden flex items-center gap-1.5"><i class="fa-solid fa-circle-exclamation"></i> Incorrect authorization key.</p>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
                    <span>Authenticate Session</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- ENTERPRISE NAVIGATION HEADER -->
    <header class="bg-slate-900 text-slate-100 border-b border-slate-800 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-2">
            <!-- Brand Mark -->
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 font-black flex items-center justify-center text-xs tracking-tighter shadow-md">MY</div>
                <div class="hidden sm:block">
                    <h1 class="text-xs font-bold text-white tracking-tight">YMCA Munchirai</h1>
                    <span class="text-[9px] text-amber-400 font-mono block">SYS_ADMIN_v2.6</span>
                </div>
            </div>
            
            <!-- Quick Navigation Menu -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                <a href="admin.html" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 shrink-0 shadow-sm flex items-center gap-1">
                    <i class="fa-solid fa-house text-[10px]"></i> Home
                </a>
                <a href="adminnews.html" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 shrink-0 transition flex items-center gap-1 border border-slate-800">
                    <i class="fa-solid fa-newspaper text-amber-400 text-[10px]"></i> News
                </a>
                <a href="admininventory.html" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 shrink-0 transition flex items-center gap-1 border border-slate-800">
                    <i class="fa-solid fa-boxes-stacked text-amber-400 text-[10px]"></i> Inventory
                </a>
                <!-- VISIBLE SETTINGS BUTTON WITH GEAR & TEXT -->
                <a href="settings.html" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-amber-400 shrink-0 transition flex items-center gap-1.5 border border-slate-700">
                    <i class="fa-solid fa-gear text-xs"></i>
                    <span>Settings</span>
                </a>
                <a href="index.html" target="_blank" class="px-2 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800 shrink-0 transition border border-slate-800" title="View Site">
                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                </a>
                <button onclick="handleLogout()" class="px-2 py-1.5 rounded-lg text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-950/40 shrink-0 transition border border-red-900/30" title="Logout">
                    <i class="fa-solid fa-power-off text-[10px]"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="max-w-3xl mx-auto w-full px-3 sm:px-6 py-6 sm:py-10 flex-grow">
        <div class="light-card rounded-2xl p-5 sm:p-8">
            
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4 mb-6">
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-amber-700 bg-amber-500/10 px-2.5 py-0.5 rounded border border-amber-500/20">Module</span>
                    <h2 class="text-base sm:text-lg font-bold text-slate-900 mt-1">Homepage Content Manager</h2>
                </div>
                <button onclick="resetCMSForm()" class="text-[11px] text-slate-500 hover:text-amber-600 transition underline decoration-slate-300 w-max">
                    Restore Defaults
                </button>
            </div>

            <form id="cms-form" onsubmit="saveCMSContent(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1.5">Top Announcement Bar Text</label>
                    <input type="text" id="cms-announcement" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition">
                </div>
                
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1.5">Hero Main Header Title</label>
                    <input type="text" id="cms-title" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1.5">Hero Subtitle Description</label>
                    <textarea id="cms-desc" rows="3" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1.5">Hero Background Image Link</label>
                    <input type="url" id="cms-hero-img" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1.5">Footer About Description</label>
                    <textarea id="cms-footer-desc" rows="2" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition resize-none"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                        <span>Publish Changes to Live Node</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- ENTERPRISE FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 px-4 text-center text-[10px] text-slate-500">
        Munchirai YMCA Secure Portal &bull; Enterprise Operations Center
    </footer>

    <!-- CORE SCRIPT -->
    <script>
        const FALLBACK_PASSWORD = "Admin@123";

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        function checkAuth() {
            if (!sessionStorage.getItem("admin_authenticated")) {
                document.getElementById('login-modal').classList.remove('hidden');
            } else {
                loadCMSValues();
            }
        }

        window.handleLogin = function(event) {
            event.preventDefault();
            const val = document.getElementById('login-input').value;
            const currentPass = localStorage.getItem("admin_password") || FALLBACK_PASSWORD;

            if (val === currentPass) {
                sessionStorage.setItem("admin_authenticated", "true");
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('login-error').classList.add('hidden');
                document.getElementById('login-input').value = "";
                loadCMSValues();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        };

        window.handleLogout = function() {
            sessionStorage.removeItem("admin_authenticated");
            window.location.reload();
        };

        function loadCMSValues() {
            const defaults = {
                announcement: "Empowering Youth & Community • Support Munchirai YMCA Initiatives through MY Food",
                heroTitle: "Building Strong Kids, Strong Families, & Strong Communities.",
                heroDesc: "Welcome to Munchirai YMCA. Discover our youth initiatives, social welfare activities, and support our eco-friendly food store enterprise.",
                heroImg: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&q=80&w=2000",
                footerDesc: "Dedicated to social service, spiritual growth, youth development, and sustainable local community initiatives in Munchirai."
            };

            const saved = JSON.parse(localStorage.getItem("ymca_index_settings")) || defaults;

            document.getElementById('cms-announcement').value = saved.announcement;
            document.getElementById('cms-title').value = saved.heroTitle;
            document.getElementById('cms-desc').value = saved.heroDesc;
            document.getElementById('cms-hero-img').value = saved.heroImg;
            document.getElementById('cms-footer-desc').value = saved.footerDesc;
        }

        window.saveCMSContent = function(event) {
            event.preventDefault();
            const settings = {
                announcement: document.getElementById('cms-announcement').value,
                heroTitle: document.getElementById('cms-title').value,
                heroDesc: document.getElementById('cms-desc').value,
                heroImg: document.getElementById('cms-hero-img').value,
                footerDesc: document.getElementById('cms-footer-desc').value
            };

            localStorage.setItem("ymca_index_settings", JSON.stringify(settings));
            alert("Payload successfully compiled and synchronized with index.html!");
        };

        window.resetCMSForm = function() {
            localStorage.removeItem("ymca_index_settings");
            loadCMSValues();
            alert("CMS cache cleared. Default parameters restored.");
        };

        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
