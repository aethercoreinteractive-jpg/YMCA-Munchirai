<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage Manager - Munchirai YMCA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-50 rounded-2xl shadow-xl border border-slate-200 p-6 space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-lg font-bold text-slate-950 tracking-tight">Cloud Storage Management</h1>
            <p class="text-xs text-slate-500 mt-0.5">Manage permanent cloud data under label <span class="text-amber-600 font-mono font-bold">ad1</span></p>
        </div>

        <!-- Professional In-App Notification Message -->
        <div id="status-msg" class="hidden p-3 rounded-xl text-xs font-semibold text-center transition-all duration-300"></div>

        <!-- Storage Status Card -->
        <div class="space-y-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <span class="text-xs font-semibold text-slate-600">Target Node Label</span>
                <span class="text-xs font-mono font-bold text-slate-900">ad1</span>
            </div>
            <div class="flex items-center justify-between pb-1">
                <span class="text-xs font-semibold text-slate-600">Saved Records Count</span>
                <span id="records-count" class="text-xs font-mono font-bold text-amber-600">Loading...</span>
            </div>
        </div>

        <!-- Clear Cloud Data Button Section -->
        <div class="space-y-3">
            <button type="button" id="clear-btn" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-md active:scale-[0.98] flex items-center justify-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Clear All Cloud Data (ad1)</span>
            </button>
            <p class="text-[10px] text-slate-400 text-center">Warning: This action permanently erases all links stored under ad1 from Firebase.</p>
        </div>

    </div>

    <!-- Firebase Engine Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDKGABXSD7YAulfGJp890fmOxdSAQKpBwg",
          authDomain: "munchirai-ymca.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca",
          storageBucket: "munchirai-ymca.firebasestorage.app",
          messagingSenderId: "697387132253",
          appId: "1:697387132253:web:00bdeb04c36763c8c3f4b4",
          measurementId: "G-XRRT0Q76YK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ad1Ref = ref(db, 'ad1');

        const recordsCount = document.getElementById('records-count');
        const clearBtn = document.getElementById('clear-btn');
        const statusMsg = document.getElementById('status-msg');

        function showMessage(text, isError = false) {
            statusMsg.textContent = text;
            statusMsg.className = `p-3 rounded-xl text-xs font-semibold text-center ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            statusMsg.classList.remove('hidden');
            setTimeout(() => statusMsg.classList.add('hidden'), 4000);
        }

        // Check storage status on page load
        async function checkStorageStatus() {
            try {
                const snapshot = await get(ad1Ref);
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    let count = 0;
                    if (Array.isArray(data)) {
                        count = data.length;
                    } else if (typeof data === 'object') {
                        count = Object.keys(data).length;
                    }
                    recordsCount.textContent = `${count} item(s) stored`;
                } else {
                    recordsCount.textContent = "0 items stored (Empty)";
                }
            } catch (error) {
                console.error("Storage check error:", error);
                recordsCount.textContent = "Error reading database";
            }
        }

        // Permanently clear cloud data under ad1
        clearBtn.addEventListener('click', async () => {
            try {
                await remove(ad1Ref);
                recordsCount.textContent = "0 items stored (Empty)";
                showMessage("Success: All cloud data under ad1 has been permanently cleared.");
            } catch (err) {
                console.error("Clear storage error:", err);
                showMessage("Failed to clear cloud data. Check database rules.", true);
            }
        });

        window.addEventListener('DOMContentLoaded', checkStorageStatus);
    </script>
</body>
  </html>
