<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchirai YMCA | Admin Orders</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-amber-500 selection:text-slate-950 pt-14 flex flex-col min-h-screen">

    <!-- Professional Fixed Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md text-white shadow-lg border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-14 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 shrink-0">
                <a href="index.html" class="text-sm sm:text-2xl font-black tracking-tighter uppercase text-white flex items-center gap-1.5">
                    <span class="bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-xs sm:text-lg font-bold shadow">MY</span> Orders Dashboard
                </a>
            </div>
            <div class="flex items-center gap-2">
                <a href="mystore.html" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition border border-slate-700 flex items-center gap-1 font-semibold">
                    <i class="fa-solid fa-store text-amber-400"></i> Store
                </a>
            </div>
        </div>
    </header>

    <!-- Main Orders Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
            <div>
                <span class="text-[9px] font-bold uppercase tracking-widest text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">Admin Control</span>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-gray-900 mt-1">Customer Orders</h1>
            </div>
            <div class="flex items-center gap-2">
                <span id="total-orders-badge" class="text-xs font-bold bg-slate-200 text-slate-800 px-3 py-1.5 rounded-xl shadow-sm">0 Total Orders</span>
            </div>
        </div>

        <!-- Orders Container -->
        <div id="orders-container" class="space-y-4">
            <div class="text-center py-16 bg-white rounded-2xl border border-gray-200 shadow-sm text-gray-400 text-xs">
                Loading orders...
            </div>
        </div>

        <!-- Empty State Notice -->
        <div id="empty-orders-state" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-200 shadow-sm">
            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center mx-auto mb-3 text-lg shadow-inner">
                <i class="fa-solid fa-clipboard-list"></i>
            </div>
            <h3 class="font-bold text-xs text-gray-900">No orders received yet</h3>
            <p class="text-[11px] text-gray-500 mt-1">New customer checkouts will appear here instantly in real-time.</p>
        </div>
    </main>

    <!-- Firebase SDK Imports & Orders Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const ordersRef = ref(db, 'orders');

        onValue(ordersRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('orders-container');
            const emptyState = document.getElementById('empty-orders-state');
            const badge = document.getElementById('total-orders-badge');

            if (!data) {
                container.innerHTML = "";
                emptyState.classList.remove('hidden');
                badge.textContent = "0 Total Orders";
                return;
            }

            emptyState.classList.add('hidden');

            const ordersList = Object.keys(data).map(key => ({
                firebaseKey: key,
                ...data[key]
            })).reverse(); // Show latest orders first

            badge.textContent = `${ordersList.length} Total Order${ordersList.length > 1 ? 's' : ''}`;

            container.innerHTML = ordersList.map(order => {
                const dateStr = order.timestamp ? new Date(order.timestamp).toLocaleString() : 'Recent';
                const status = order.status || 'Pending Confirmation';
                
                let statusBadgeColor = 'bg-amber-100 text-amber-800 border-amber-200';
                if (status === 'Processing') statusBadgeColor = 'bg-blue-100 text-blue-800 border-blue-200';
                if (status === 'Delivered') statusBadgeColor = 'bg-emerald-100 text-emerald-800 border-emerald-200';
                if (status === 'Cancelled') statusBadgeColor = 'bg-rose-100 text-rose-800 border-rose-200';

                const itemsHtml = (order.items || []).map(item => `
                    <div class="flex items-center justify-between text-xs py-1 border-b border-gray-100 last:border-0">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-900">${item.qtyCount || 1}x</span>
                            <span class="text-gray-700">${item.name}</span>
                        </div>
                        <span class="font-semibold text-slate-900">₹${(item.price || 0) * (item.qtyCount || 1)}</span>
                    </div>
                `).join('');

                return `
                    <div class="bg-white border border-gray-200 rounded-2xl p-4 sm:p-5 shadow-sm space-y-3">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b pb-3 border-gray-100">
                            <div>
                                <span class="text-[10px] text-gray-400 font-mono">ID: ${order.firebaseKey.slice(-6)}</span>
                                <p class="text-[11px] text-gray-500 font-medium">${dateStr}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-lg border uppercase tracking-wider ${statusBadgeColor}">${status}</span>
                            </div>
                        </div>

                        <!-- Items Breakdown -->
                        <div class="bg-gray-50 rounded-xl p-3 border border-gray-100 space-y-1">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Ordered Items</span>
                            ${itemsHtml}
                        </div>

                        <div class="flex items-center justify-between pt-1">
                            <div class="text-xs">
                                <span class="text-gray-500">Total:</span>
                                <span class="font-black text-slate-900 text-sm ml-1">₹${order.totalAmount || 0}</span>
                            </div>
                            
                            <div class="flex items-center gap-1.5">
                                <select onchange="window.updateOrderStatus('${order.firebaseKey}', this.value)" class="text-xs bg-white border border-gray-200 rounded-lg px-2.5 py-1.5 font-semibold text-slate-800 focus:outline-none focus:border-amber-500 shadow-sm">
                                    <option value="Pending Confirmation" ${status === 'Pending Confirmation' ? 'selected' : ''}>Pending</option>
                                    <option value="Processing" ${status === 'Processing' ? 'selected' : ''}>Processing</option>
                                    <option value="Delivered" ${status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                    <option value="Cancelled" ${status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                                <button onclick="window.deleteOrder('${order.firebaseKey}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold transition border border-red-200">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        });

        window.updateOrderStatus = function(firebaseKey, newStatus) {
            update(ref(db, `orders/${firebaseKey}`), { status: newStatus })
                .catch(err => {
                    console.error("Error updating status:", err);
                    alert("Failed to update status.");
                });
        };

        window.deleteOrder = function(firebaseKey) {
            if (confirm("Are you sure you want to delete this order record?")) {
                remove(ref(db, `orders/${firebaseKey}`))
                    .catch(err => {
                        console.error("Error deleting order:", err);
                        alert("Failed to delete order.");
                    });
            }
        };
    </script>
</body>
</html>
