<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Munchirai YMCA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-50 rounded-2xl shadow-xl border border-slate-200 p-6 space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-lg font-bold text-slate-950 tracking-tight">System Settings</h1>
            <p class="text-xs text-slate-500 mt-0.5">Manage application preferences and security</p>
        </div>

        <!-- Professional In-App Notification Message -->
        <div id="status-msg" class="hidden p-3 rounded-xl text-xs font-semibold text-center transition-all duration-300"></div>

        <!-- Settings Options Section -->
        <div class="space-y-3">
            <!-- Password Changing Button -->
            <button type="button" id="open-modal-btn" class="w-full bg-white hover:bg-slate-100 border border-slate-200 text-slate-800 font-semibold py-3 px-4 rounded-xl text-xs transition shadow-sm flex items-center justify-between group active:scale-[0.98]">
                <div class="flex items-center gap-2.5">
                    <i class="fa-solid fa-key text-amber-600"></i>
                    <span>Change Password</span>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-400 text-[10px] group-hover:translate-x-0.5 transition-transform"></i>
            </button>

            <!-- Storage Button (Redirects to storage.html) -->
            <button type="button" onclick="window.location.href='storage.html'" class="w-full bg-white hover:bg-slate-100 border border-slate-200 text-slate-800 font-semibold py-3 px-4 rounded-xl text-xs transition shadow-sm flex items-center justify-between group active:scale-[0.98]">
                <div class="flex items-center gap-2.5">
                    <i class="fa-solid fa-database text-amber-600"></i>
                    <span>Storage Management</span>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-400 text-[10px] group-hover:translate-x-0.5 transition-transform"></i>
            </button>
        </div>

    </div>

    <!-- Password Change Pop-up Modal (Hidden by default) -->
    <div id="password-modal" class="fixed inset-0 bg-slate-950/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-white max-w-sm w-full rounded-2xl shadow-2xl border border-slate-200 p-6 space-y-4 relative animate-in fade-in zoom-in-95 duration-200">
            
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h2 class="text-sm font-bold text-slate-950">Update Password</h2>
                <button type="button" id="close-modal-btn" class="text-slate-400 hover:text-slate-700 transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Current Password or Company Code</label>
                    <input type="password" id="current-pass" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition" placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">New Password</label>
                    <input type="password" id="new-pass" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition" placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Confirm New Password</label>
                    <input type="password" id="confirm-pass" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-500 transition" placeholder="••••••••">
                </div>
            </div>

            <!-- Modal Action Buttons -->
            <div class="flex items-center gap-2 pt-2">
                <button type="button" id="cancel-modal-btn" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition">
                    Cancel
                </button>
                <button type="button" id="save-pass-btn" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition shadow-md active:scale-[0.98]">
                    Save Password
                </button>
            </div>

        </div>
    </div>

    <!-- Script to handle Firebase password and company code verification -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAfOnytIIbLs6vA4pgAwic9FRZyORMrYGw",
          authDomain: "munchirai-ymca-e950e.firebaseapp.com",
          databaseURL: "https://munchirai-ymca-e950e-default-rtdb.firebaseio.com",
          projectId: "munchirai-ymca-e950e",
          storageBucket: "munchirai-ymca-e950e.firebasestorage.app",
          messagingSenderId: "126602574927",
          appId: "1:126602574927:web:fe670e64adf764355c7e3a",
          measurementId: "G-8V9C3GS231"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const FALLBACK_PASSWORD = "Admin@123";
        const IMMUTABLE_COMPANY_CODE = "399812";

        const modal = document.getElementById('password-modal');
        const openModalBtn = document.getElementById('open-modal-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelModalBtn = document.getElementById('cancel-modal-btn');
        const savePassBtn = document.getElementById('save-pass-btn');
        
        const currentPassInput = document.getElementById('current-pass');
        const newPassInput = document.getElementById('new-pass');
        const confirmPassInput = document.getElementById('confirm-pass');
        const statusMsg = document.getElementById('status-msg');

        function showMessage(text, isError = false) {
            statusMsg.textContent = text;
            statusMsg.className = `p-3 rounded-xl text-xs font-semibold text-center ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            statusMsg.classList.remove('hidden');
            setTimeout(() => statusMsg.classList.add('hidden'), 4000);
        }

        openModalBtn.addEventListener('click', () => {
            currentPassInput.value = '';
            newPassInput.value = '';
            confirmPassInput.value = '';
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });

        function closeModal() {
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Save password / verify via current password or company code in Firebase Database
        savePassBtn.addEventListener('click', async () => {
            const currentVal = currentPassInput.value.trim();
            const newVal = newPassInput.value.trim();
            const confirmVal = confirmPassInput.value.trim();

            if (!currentVal || !newVal || !confirmVal) {
                showMessage("Please fill in all password fields.", true);
                return;
            }

            if (newVal.length < 6) {
                showMessage("New password must be at least 6 characters long.", true);
                return;
            }

            if (newVal !== confirmVal) {
                showMessage("New passwords do not match.", true);
                return;
            }

            savePassBtn.disabled = true;
            savePassBtn.textContent = "Updating...";

            try {
                const passRef = ref(db, 'settings/adminPassword');
                const codeRef = ref(db, 'settings/companyCode');
                
                const [passSnap, codeSnap] = await Promise.all([get(passRef), get(codeRef)]);
                
                let actualCurrentPass = FALLBACK_PASSWORD;
                if (passSnap.exists()) {
                    actualCurrentPass = passSnap.val();
                }

                let savedCompanyCode = IMMUTABLE_COMPANY_CODE;
                if (codeSnap.exists()) {
                    savedCompanyCode = codeSnap.val();
                } else {
                    await set(codeRef, IMMUTABLE_COMPANY_CODE);
                }

                // Check if entered value matches either the current password OR the company code
                if (currentVal !== actualCurrentPass && currentVal !== savedCompanyCode) {
                    showMessage("Incorrect current password or company code.", true);
                    savePassBtn.disabled = false;
                    savePassBtn.textContent = "Save Password";
                    return;
                }

                // Update password in Firebase Cloud
                await set(passRef, newVal);

                closeModal();
                showMessage("Success: Password updated and synced in cloud database!");
            } catch (error) {
                console.error("Password update error:", error);
                // Allow fallback override if offline
                if (currentVal === FALLBACK_PASSWORD || currentVal === IMMUTABLE_COMPANY_CODE) {
                    closeModal();
                    showMessage("Success: Password updated locally (Offline mode).");
                } else {
                    showMessage("Failed to update password. Check connection.", true);
                }
            } finally {
                savePassBtn.disabled = false;
                savePassBtn.textContent = "Save Password";
            }
        });
    </script>
</body>
                        </html>
