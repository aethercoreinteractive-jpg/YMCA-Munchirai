<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munchirai YMCA | Shopping Cart</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-black selection:text-white min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xl font-black tracking-tighter uppercase text-white flex items-center gap-2">
                    <span class="bg-amber-500 text-slate-950 px-2 py-0.5 rounded text-lg font-bold">MY</span> Cart
                </a>
            </div>
            <a href="mystore.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-lg transition border border-slate-700 flex items-center gap-1.5">
                <i class="fa-solid fa-store text-amber-400"></i> Back to Store
            </a>
        </div>
    </header>

    <!-- Main Cart Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <h1 class="text-2xl font-extrabold tracking-tight text-gray-900 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-cart-shopping text-amber-500"></i> Your Shopping Cart
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Items List -->
            <div class="md:col-span-2 space-y-4" id="cart-items-container">
                <!-- Injected via script -->
            </div>

            <!-- Summary Box -->
            <div class="md:col-span-1">
                <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm sticky top-24 space-y-4">
                    <h3 class="font-bold text-sm text-gray-900 border-b pb-3 border-gray-100">Order Summary</h3>
                    
                    <div class="flex justify-between text-xs text-gray-600">
                        <span>Items Subtotal</span>
                        <span id="summary-subtotal" class="font-semibold text-gray-900">₹0</span>
                    </div>
                    <div class="flex justify-between text-xs text-gray-600">
                        <span>Delivery Fee</span>
                        <span class="font-semibold text-green-600">FREE</span>
                    </div>
                    
                    <div class="border-t pt-3 flex justify-between text-sm font-black text-gray-900">
                        <span>Total Amount:</span>
                        <span id="summary-total">₹0</span>
                    </div>

                    <button onclick="checkoutOrder()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow">
                        Proceed to Checkout
                    </button>
                    
                    <a href="mystore.html" class="block text-center text-xs text-gray-500 hover:text-black transition pt-1">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Cart Logic Script -->
    <script>
        let cart = JSON.parse(localStorage.getItem("ymca_cart")) || [];

        function renderCartPage() {
            const container = document.getElementById('cart-items-container');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="bg-white border border-gray-200 rounded-2xl p-12 text-center shadow-sm">
                        <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center mx-auto mb-3 text-lg">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </div>
                        <h3 class="font-bold text-sm text-gray-900">Your cart is empty</h3>
                        <p class="text-xs text-gray-500 mt-1 mb-4">Explore our inventory catalog and add items to your cart.</p>
                        <a href="mystore.html" class="inline-block bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-5 py-2.5 rounded-xl shadow transition">
                            Browse Storefront
                        </a>
                    </div>
                `;
                document.getElementById('summary-subtotal').textContent = '₹0';
                document.getElementById('summary-total').textContent = '₹0';
                return;
            }

            let subtotal = 0;

            container.innerHTML = cart.map((item, index) => {
                const cleanPrice = parseInt(typeof item.price === 'string' ? item.price.replace('₹', '') : item.price) || 0;
                const qtyCount = item.qtyCount || 1;
                subtotal += cleanPrice * qtyCount;

                return `
                    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex items-center gap-4">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&q=80&w=600'}" alt="${item.name}" class="w-16 h-16 object-cover rounded-lg border border-gray-100 shrink-0">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-xs text-gray-900 truncate">${item.name}</h4>
                            <p class="text-xs font-black text-gray-900 mt-0.5">₹${cleanPrice}</p>
                            
                            <div class="flex items-center gap-2 mt-2">
                                <button onclick="updateQty(${index}, -1)" class="w-6 h-6 rounded bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold flex items-center justify-center text-xs transition">-</button>
                                <span class="text-xs font-bold px-1">${qtyCount}</span>
                                <button onclick="updateQty(${index}, 1)" class="w-6 h-6 rounded bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold flex items-center justify-center text-xs transition">+</button>
                            </div>
                        </div>
                        <button onclick="removeItem(${index})" class="text-red-400 hover:text-red-600 p-2 transition">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('summary-subtotal').textContent = `₹${subtotal}`;
            document.getElementById('summary-total').textContent = `₹${subtotal}`;
        }

        function updateQty(index, change) {
            cart[index].qtyCount = (cart[index].qtyCount || 1) + change;
            if (cart[index].qtyCount <= 0) {
                cart.splice(index, 1);
            }
            saveAndRefresh();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem("ymca_cart", JSON.stringify(cart));
            renderCartPage();
        }

        function checkoutOrder() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            alert("Order placed successfully! Thank you for supporting Munchirai YMCA and MY Food.");
            cart = [];
            saveAndRefresh();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
        });
    </script>
</body>
</html>
